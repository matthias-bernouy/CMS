<div cms-bloc="ulvia--mossa--pricing-plan">
    <h3 text-align="start" size="lg" cms-bloc="ulvia--mossa--heading" slot="name">{{ cms.i18n.ulvia/mossa.ui-plan-name }}</h3>
    <p slot="price">{{ cms.i18n.ulvia/mossa.ui-29-month }}</p>
    <p slot="description">{{ cms.i18n.ulvia/mossa.ui-a-clear-description-of-who-this-plan-is-for }}</p>
    <ul slot="features">
        <li>{{ cms.i18n.ulvia/mossa.ui-first-benefit }}</li>
        <li>{{ cms.i18n.ulvia/mossa.ui-second-benefit }}</li>
    </ul>
    <button size="md" tone="primary" variant="filled" cms-bloc="ulvia--mossa--action" wide="" slot="action" type="button">
        <span>{{ cms.i18n.ulvia/mossa.ui-choose-plan }}</span>
    </button>
</div>
