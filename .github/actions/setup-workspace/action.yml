name: Set up CmsCore workspace
description: Install the pinned Bun toolchain and bootstrap workspace dependencies.

inputs:
  bun-version:
    description: Exact Bun version used by the repository.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install locked dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Bootstrap components
      shell: bash
      run: bun run --cwd packages/foundation/components build
