name: Set up CmsCore workspace
description: Install the pinned Bun toolchain and bootstrap workspace dependencies.

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version

    - name: Install locked dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Bootstrap browser assets
      shell: bash
      run: bun run --cwd packages/surfaces/cms-control src/prebuildControl.ts
