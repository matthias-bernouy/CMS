name: Control fresh-install smoke

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-install:
    name: Fresh install, mutations, and restart
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify Docker Compose
        run: docker compose version

      - name: Install Chromium
        run: bun node_modules/playwright/cli.js install --with-deps chromium

      - name: Exercise a fresh Control installation and restart
        run: bun run test:control-smoke
