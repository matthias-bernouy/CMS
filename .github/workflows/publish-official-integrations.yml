name: Publish official integrations

on:
  workflow_dispatch:
    inputs:
      timeout_ms:
        description: Per-candidate admission and polling timeout in milliseconds
        required: true
        default: "900000"
        type: string
      dry_run:
        description: Build and report packages without publishing
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      timeout_ms:
        description: Per-candidate admission and polling timeout in milliseconds
        required: false
        default: "900000"
        type: string
      dry_run:
        description: Build and report packages without publishing
        required: false
        default: false
        type: boolean
    secrets:
      ULVIA_TOKEN:
        description: CMS Personal Access Token exposed to the Ulvia CLI for publication
        required: false

permissions:
  contents: read

concurrency:
  group: official-integration-publication
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  plan:
    name: Audit every official integration
    runs-on: ubuntu-24.04
    environment: integration-repository
    timeout-minutes: 60
    env:
      ULVIA_REPOSITORY_URL: ${{ vars.REPOSITORY_PUBLIC_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Pull immutable remote history
        run: bun run ulvia -- pull --all

      - name: Audit every official package without publication credentials
        run: >-
          bun run ulvia -- audit --all
          --root packages/resources/official-integrations/integrations

  publish:
    name: Verify and publish through the repository-manager CMS
    needs: plan
    if: ${{ ! inputs.dry_run }}
    runs-on: ubuntu-24.04
    environment: integration-repository
    timeout-minutes: 60
    env:
      ULVIA_URL: ${{ vars.REPOSITORY_CMS_URL }}
      ULVIA_REPOSITORY_URL: ${{ vars.REPOSITORY_PUBLIC_URL }}
      ULVIA_PUSH_TIMEOUT_MS: ${{ inputs.timeout_ms }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate the CMS publication credential
        shell: bash
        env:
          ULVIA_TOKEN: ${{ secrets.ULVIA_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${ULVIA_TOKEN:-}" || "$ULVIA_TOKEN" =~ [[:space:]] ]]; then
            echo "::error::ULVIA_TOKEN must contain one non-whitespace CMS Personal Access Token"
            exit 1
          fi

      - name: Pull immutable remote history
        run: bun run ulvia -- pull --all

      - name: Release official packages locally
        run: >-
          bun run ulvia -- release --all
          --root packages/resources/official-integrations/integrations

      - name: Submit and verify changed packages in deterministic order
        env:
          ULVIA_TOKEN: ${{ secrets.ULVIA_TOKEN }}
        run: bun run ulvia -- push --all
