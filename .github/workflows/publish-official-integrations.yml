name: Publish official integrations

on:
  workflow_dispatch:
    inputs:
      management_url:
        description: Internal repository management base URL
        required: true
        type: string
      deployment_environment:
        description: GitHub environment holding the management token
        required: true
        default: integration-repository
        type: string
      timeout_ms:
        description: Per-package request timeout in milliseconds
        required: true
        default: "60000"
        type: string
      dry_run:
        description: Build and report packages without publishing
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      management_url:
        description: Internal repository management base URL
        required: true
        type: string
      deployment_environment:
        description: GitHub environment holding the management token
        required: false
        default: integration-repository
        type: string
      timeout_ms:
        description: Per-package request timeout in milliseconds
        required: false
        default: "60000"
        type: string
      dry_run:
        description: Build and report packages without publishing
        required: false
        default: false
        type: boolean
    secrets:
      REPOSITORY_MANAGEMENT_TOKEN:
        description: Bearer token accepted by the private management listener
        required: false

permissions:
  contents: read

concurrency:
  group: official-integration-publication
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  plan:
    name: Build deterministic publication plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build every official package without credentials
        run: >-
          bun run packages/runtimes/cms-cli/src/index.ts
          repository publish-official --dry-run

  publish:
    name: Publish through the private management API
    needs: plan
    if: ${{ ! inputs.dry_run }}
    runs-on: [self-hosted, linux, repository-management]
    environment: ${{ inputs.deployment_environment }}
    timeout-minutes: 30
    env:
      P9R_INTEGRATION_REPOSITORY_MANAGEMENT_URL: ${{ inputs.management_url }}
      P9R_INTEGRATION_REPOSITORY_MANAGEMENT_TOKEN_FILE: ${{ runner.temp }}/repository-management-token
      P9R_INTEGRATION_REPOSITORY_MANAGEMENT_TIMEOUT_MS: ${{ inputs.timeout_ms }}
      REPOSITORY_TOKEN_FILE: ${{ runner.temp }}/repository-management-token
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Materialize the ephemeral management credential
        shell: bash
        env:
          MANAGEMENT_TOKEN: ${{ secrets.REPOSITORY_MANAGEMENT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$MANAGEMENT_TOKEN" || "$MANAGEMENT_TOKEN" =~ [[:space:]] ]]; then
            echo "::error::REPOSITORY_MANAGEMENT_TOKEN must contain one non-whitespace token"
            exit 1
          fi
          umask 077
          printf '%s' "$MANAGEMENT_TOKEN" > "$REPOSITORY_TOKEN_FILE"

      - name: Publish official integrations in deterministic order
        run: >-
          bun run packages/runtimes/cms-cli/src/index.ts
          repository publish-official

      - name: Remove the ephemeral management credential
        if: ${{ always() }}
        run: rm -f -- "$REPOSITORY_TOKEN_FILE"
