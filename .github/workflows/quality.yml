name: Quality

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  # gitleaks v8.30.1 linux_x64 release archive; keep version and digest together.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
jobs:
  static-quality:
    name: Architecture, types, and deterministic build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run all workspace checks
        run: bun run check:all

      - name: Verify deterministic build and clean worktree
        run: bash quality/ci/determinism/deterministic-build.sh

  tests:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: foundation
            path: packages/foundation
          - name: features
            path: packages/features
          - name: resources
            path: packages/resources
          - name: surfaces
            path: packages/surfaces
          - name: runtimes
            path: packages/runtimes
          - name: infrastructure
            path: infra
          - name: CI tooling
            path: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Docker Compose for infrastructure tests
        if: matrix.name == 'infrastructure'
        run: docker compose version

      - name: Run tests
        env:
          TEST_PATH: ${{ matrix.path }}
        run: bun test "$TEST_PATH" --pass-with-no-tests

  integration-contracts:
    uses: ./.github/workflows/quality-integration-contracts.yml

  dependency-security:
    name: Dependency and secret security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Reject high-severity dependency vulnerabilities
        run: bun run quality/ci/audit/audit.ts

      - name: Install pinned gitleaks
        env:
          GITLEAKS_ARCHIVE: ${{ runner.temp }}/gitleaks.tar.gz
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$GITLEAKS_ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${GITLEAKS_ARCHIVE}" | sha256sum --check --strict
          tar --extract --gzip --file "$GITLEAKS_ARCHIVE" --directory "$RUNNER_TEMP" gitleaks

      - name: Scan Git history for secrets
        run: >-
          "$RUNNER_TEMP/gitleaks" git
          --no-banner --no-color --redact
          --gitleaks-ignore-path quality/ci/audit/gitleaks-baseline.txt
          .

  coverage:
    name: Per-package coverage ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Check coverage against the package baseline
        env:
          COVERAGE_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run quality/ci/coverage/ratchet.ts

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: per-package-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - static-quality
      - tests
      - integration-contracts
      - dependency-security
      - coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Require every quality job
        env:
          STATIC_RESULT: ${{ needs.static-quality.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-contracts.result }}
          SECURITY_RESULT: ${{ needs.dependency-security.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$TEST_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$SECURITY_RESULT" = success
          test "$COVERAGE_RESULT" = success
