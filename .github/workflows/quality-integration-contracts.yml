name: Quality integration contracts

on:
  workflow_call:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  postgres-contracts:
    name: PostgreSQL integration contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # postgres:16-alpine, pinned to the validated release image.
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: cmscore_contracts
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname cmscore_contracts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify PostgreSQL client
        run: psql --version

      - name: Run Commerce media and negotiation contracts
        env:
          ALLOW_POSTGRES_CONTRACT_SCHEMA_RESET: cmscore-postgres-contracts
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cmscore_contracts
        run: |
          bun run packages/resources/official-integrations/tests/helpers/postgres/runPostgresContracts.ts --filter commerce-media
          bun run packages/resources/official-integrations/tests/helpers/postgres/runPostgresContracts.ts --filter commerce-negotiated-checkout

      - name: Calibrate all official PostgreSQL schemas
        env:
          ALLOW_POSTGRES_CONTRACT_SCHEMA_RESET: cmscore-postgres-contracts
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cmscore_contracts
        run: bun run packages/resources/official-integrations/tests/helpers/postgres/schema-calibration/execution/run.ts

  source-image-safety:
    name: Source image safety and Chromium smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run Source image security contracts
        run: |
          bun test packages/features/cms-source-images/tests
          bun test \
            packages/features/cms-sources/tests/http/interceptors \
            packages/features/cms-sources/tests/http/observability/sourceImageTelemetry.test.ts \
            packages/features/cms-sources/tests/validation/validateSource.reservedParams.test.ts

      - name: Run Commerce media safety contracts
        run: |
          bun test \
            packages/resources/official-integrations/tests/commerce/selling/media/access.test.ts \
            packages/resources/official-integrations/tests/commerce/selling/media/contracts.test.ts \
            packages/resources/official-integrations/tests/commerce/selling/media/formats.test.ts \
            packages/resources/official-integrations/tests/commerce/selling/media/multipart.test.ts \
            packages/resources/official-integrations/tests/commerce/selling/media/uploads \
            packages/resources/official-integrations/tests/commerce/selling/blocs/offer-preview-money.test.ts

      - name: Run image performance harness tests
        run: bun test quality/image-performance/tests

      - name: Install locked Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: bun node_modules/playwright/cli.js install --with-deps chromium

      - name: Capture deterministic synthetic candidate
        run: |
          bun run quality/image-performance/benchmark/run.ts \
            --label ci-candidate \
            --adapter module:quality/image-performance/core/sourceImagesAdapter.ts \
            --suite-id source-images-ci-smoke \
            --synthetic 2 \
            --repetitions 1 \
            --users 1 \
            --foreground-requests 4 \
            --output "$RUNNER_TEMP/image-performance-candidate.json"

      - name: Verify production responsive runtime in Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: |
          bun run quality/image-performance/browser/run.ts \
            --suite-id source-images-ci-smoke \
            --candidate "$RUNNER_TEMP/image-performance-candidate.json" \
            --output "$RUNNER_TEMP/image-performance-browser.json"

      - name: Validate synthetic performance and browser evidence
        run: |
          bun run quality/image-performance/compare/smoke.ts \
            --candidate "$RUNNER_TEMP/image-performance-candidate.json" \
            --browser "$RUNNER_TEMP/image-performance-browser.json" \
            --output "$RUNNER_TEMP/image-performance-smoke.json"
