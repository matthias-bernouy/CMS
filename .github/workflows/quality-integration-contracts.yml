name: Quality runtime contracts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  files-provider-conformance:
    name: Files provider and binary gateway conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Run Files provider conformance
        run: bun test packages/features/cms-files/tests

      - name: Run binary gateway contracts
        run: bun test packages/features/cms-gateway/tests/http packages/features/cms-gateway/tests/invocation
