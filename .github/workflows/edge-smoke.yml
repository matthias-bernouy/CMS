name: Edge fresh-install smoke

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-install:
    name: Fresh install, mutations, and restart
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          ref: ${{ github.event_name == 'schedule' && 'codex/alpha-v0' || github.ref }}

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify Docker Compose
        run: docker compose version

      - name: Install Chromium
        run: bun node_modules/playwright/cli.js install --with-deps chromium

      - name: Build candidate images
        run: bun run images:build --version 0.1.0-ci all

      - name: Exercise a fresh Edge installation and restart
        env:
          ULVIA_SMOKE_IMAGE_VERSION: 0.1.0-ci
        run: bun run test:edge-smoke

      - name: Gate delivery performance
        env:
          ULVIA_MCP_EDGE_DOCKER_IMAGE: docker.io/cyaxis/ulvia-edge:0.1.0-ci
          ULVIA_MCP_PROVIDER_DOCKER_IMAGE: docker.io/cyaxis/ulvia-provider:0.1.0-ci
          ULVIA_REPOSITORY_DOCKER_IMAGE: docker.io/cyaxis/ulvia-official-repository:0.1.0-ci
        run: bun run test:performance:delivery

      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-delivery-evidence
          path: artifacts/delivery-performance/
          if-no-files-found: warn
          retention-days: 14
