worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    server_tokens off;
    access_log off;
    map_hash_bucket_size 128;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map "$request_method:$uri" $repository_management_route {
        default 0;
        "GET:/.cms/repository-management/api/status" 1;
        "GET:/.cms/repository-management/api/diagnostics" 1;
        "GET:/.cms/repository-management/api/integrations/versions" 1;
        "GET:/.cms/repository-management/api/integrations/compatibility" 1;
        "GET:/.cms/repository-management/api/integrations/release" 1;
        "GET:/.cms/repository-management/api/integrations/candidates/status" 1;
        "GET:/.cms/repository-management/api/integrations/candidates/report" 1;
        "POST:/.cms/repository-management/api/integrations/candidates" 1;
        "POST:/.cms/repository-management/api/integrations/stable-promotions" 1;
        "POST:/.cms/repository-management/api/integrations/version-blocks" 1;
        "POST:/.cms/repository-management/api/integrations/compatibility/reevaluations" 1;
    }

    upstream cms_repository_management {
        zone cms_repository_management 64k;
        server cms-repository:3000 resolve;
    }

    server {
        listen 8080;
        client_max_body_size 64m;
        client_body_timeout 30s;
        send_timeout 65s;

        if ($repository_management_route = 0) {
            return 404;
        }

        location / {
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 65s;
            proxy_send_timeout 65s;
            proxy_set_header Connection "";
            proxy_set_header Host cms-repository;
            # nginx filters the route; the repository guard authenticates it.
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_hide_header Server;
            proxy_pass http://cms_repository_management$uri$is_args$args;
        }
    }
}
