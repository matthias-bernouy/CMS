services:
    repository:
        image: ${PROBE_IMAGE:?}
        user: "1000:1000"
        entrypoint: ["/bin/sh", "-ec"]
        command: ['test "$$(id -u)" = 1000 && test "$$(cat /run/secrets/worker-token)" = shared-worker-token && ! printf x >> /run/secrets/worker-token']
        read_only: true
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        network_mode: none
        secrets:
            - source: repository_worker
              target: worker-token
    verifier:
        image: ${PROBE_IMAGE:?}
        user: "1001:1001"
        entrypoint: ["/bin/sh", "-ec"]
        command: ['test "$$(id -u)" = 1001 && test "$$(cat /run/secrets/worker-token)" = shared-worker-token && test "$$(cat /run/secrets/database-password)" = shared-database-password']
        read_only: true
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        network_mode: none
        secrets:
            - source: verifier_worker
              target: worker-token
            - source: verifier_database
              target: database-password
    postgres:
        image: ${POSTGRES_PROBE_IMAGE:?}
        user: "70:70"
        entrypoint: ["/bin/sh", "-ec"]
        command: ['test -x /usr/local/bin/docker-entrypoint.sh && test "$$(id -u)" = 70 && test "$$(cat /run/secrets/database-password)" = shared-database-password']
        read_only: true
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        network_mode: none
        secrets:
            - source: postgres_database
              target: database-password
    wrong-user:
        image: ${PROBE_IMAGE:?}
        user: "1000:1000"
        entrypoint: ["/bin/sh", "-ec"]
        command: ['test ! -r /run/secrets/verifier-worker']
        read_only: true
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        network_mode: none
        secrets:
            - source: verifier_worker
              target: verifier-worker

secrets:
    repository_worker:
        file: ${REPOSITORY_WORKER_SECRET_FILE:?}
    verifier_worker:
        file: ${VERIFIER_WORKER_SECRET_FILE:?}
    verifier_database:
        file: ${VERIFIER_DATABASE_SECRET_FILE:?}
    postgres_database:
        file: ${POSTGRES_DATABASE_SECRET_FILE:?}
