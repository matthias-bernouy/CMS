# Optional HTTPS ingress for repository administration from a remote p9r CLI.
# The gateway contains no credential and exposes no raw host port. nginx-proxy
# terminates TLS for one dedicated domain and forwards only the ordinary
# management route allow-list declared in management-ingress.nginx.conf.
services:
    cms-repository-management-ingress:
        image: nginx:1.31.1-alpine@sha256:8b1e78743a03dbb2c95171cc58639fef29abc8816598e27fb910ed2e621e589a
        restart: unless-stopped
        init: true
        user: "101:101"
        entrypoint:
            - /usr/sbin/nginx
        command:
            - -g
            - daemon off;
        depends_on:
            cms-repository:
                condition: service_healthy
        environment:
            VIRTUAL_HOST: ${CMS_REPOSITORY_MANAGEMENT_DOMAIN:?CMS_REPOSITORY_MANAGEMENT_DOMAIN must be a dedicated DNS name}
            VIRTUAL_PORT: "8080"
            ACME_HOST: ${CMS_REPOSITORY_MANAGEMENT_DOMAIN:?CMS_REPOSITORY_MANAGEMENT_DOMAIN must be a dedicated DNS name}
            LETSENCRYPT_HOST: ${CMS_REPOSITORY_MANAGEMENT_DOMAIN:?CMS_REPOSITORY_MANAGEMENT_DOMAIN must be a dedicated DNS name}
            HTTPS_METHOD: redirect
            SERVER_TOKENS: "off"
        volumes:
            - ./management-ingress.nginx.conf:/etc/nginx/nginx.conf:ro
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=0700,uid=101,gid=101
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        pids_limit: 32
        mem_limit: 64m
        cpus: "0.25"
        expose:
            - "8080"
        networks:
            cms_proxy:
                gw_priority: 1
            cms_repository: {}
        stop_grace_period: 10s

networks:
    cms_proxy:
        external: true
        name: ${CMS_PROXY_NETWORK_NAME:-cms_proxy}
