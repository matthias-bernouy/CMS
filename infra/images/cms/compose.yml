# One CMS Kernel deployment. Shared infrastructure owns MongoDB, the official
# repository, file storage and the multi-instance Ulvia Provider.
services:
    cms:
        image: ${CMS_IMAGE:?CMS_IMAGE must be an immutable version tag or digest}
        restart: unless-stopped
        init: true
        command: ["bun", "run", "packages/runtimes/cms-kernel-server/src/index.ts"]
        environment:
            MODE: PROD
            NODE_ENV: production
            KERNEL_PORT: "3000"
            KERNEL_HOST: 0.0.0.0
            KERNEL_PUBLIC_URL: "https://${DOMAIN:?DOMAIN must be set}"
            ULVIA_PROVIDER_URL: http://ulvia-provider:5103
            ULVIA_INSTANCE_TOKEN: ${ULVIA_INSTANCE_TOKEN:?ULVIA_INSTANCE_TOKEN must be set}
            CMS_SESSION_SECRET: ${CMS_SESSION_SECRET:?CMS_SESSION_SECRET must be set}
            CMS_KEK_ACTIVE_ID: instance
            CMS_KEK_RING_JSON: '{"instance":"${ULVIA_INSTANCE_KEK_HEX:?ULVIA_INSTANCE_KEK_HEX must be set}"}'
            CMS_FILES_DIR: /var/lib/cms/files/${ULVIA_INSTANCE_STORAGE_KEY:?ULVIA_INSTANCE_STORAGE_KEY must be set}
            MONGO_URL: ${MONGO_URL:?MONGO_URL must select the provisioned instance database}
            CMS_AUTH_SITE_NAME: ${CMS_AUTH_SITE_NAME:-CMS}
            CMS_AUTH_EMAIL_COOLDOWN_SECONDS: "${CMS_AUTH_EMAIL_COOLDOWN_SECONDS:-300}"
            CMS_COLLECTION_MIGRATION_ROLLBACK_RETENTION: "${CMS_COLLECTION_MIGRATION_ROLLBACK_RETENTION:-100}"
            CMS_AUTH_EMAIL_VERIFICATION_URL: ${CMS_AUTH_EMAIL_VERIFICATION_URL:-https://${DOMAIN}/auth/confirm-email}
            CMS_AUTH_PASSWORD_RESET_URL: ${CMS_AUTH_PASSWORD_RESET_URL:-https://${DOMAIN}/auth/reset-password}
            SMTP_HOST: ${SMTP_HOST:-}
            SMTP_PORT: ${SMTP_PORT:-}
            SMTP_SECURE: ${SMTP_SECURE:-}
            SMTP_USER: ${SMTP_USER:-}
            SMTP_PASSWORD: ${SMTP_PASSWORD:-}
            SMTP_FROM: ${SMTP_FROM:-}
            SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
            VIRTUAL_HOST: ${DOMAIN}
            VIRTUAL_PORT: "3000"
            ACME_HOST: ${DOMAIN}
            LETSENCRYPT_HOST: ${DOMAIN}
        volumes:
            - cms_files:/var/lib/cms/files
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=256m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        expose:
            - "3000"
        networks:
            cms_proxy:
                gw_priority: 1
            cms_mongo: {}
            cms_provider: {}
        healthcheck:
            test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/login'); if(r.status>=500) process.exit(1); await r.body?.cancel()"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        stop_grace_period: 30s

networks:
    cms_proxy:
        external: true
    cms_mongo:
        external: true
    cms_provider:
        external: true

volumes:
    cms_files:
        external: true
