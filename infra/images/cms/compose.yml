# Per-instance CMS deployment. Copy this file + a `.env` to a dedicated
# folder on the server (one folder per client/site), then run
# `docker compose up -d`. The shared nginx-proxy, ACME, and MongoDB
# infrastructure must already be running — see `infra/compose.yml`.
#
# MongoDB runs once per server (or as an external managed cluster). Each CMS
# instance uses its own database and a database-scoped account selected by
# `MONGO_URL`. Instances share only the MongoDB process and `cms_mongo` network.
#
# nginx-proxy detects the instance network owner via `VIRTUAL_HOST_MULTIPORTS` and
# routes ${DOMAIN} to the unified Kernel on port 3000.
#
# Required `.env` values (never commit that file):
#   DOMAIN=client.example.com
#   CMS_IMAGE=bernouy/cms:<immutable-version>
#   ULVIA_PROVIDER_MONGO_URL=mongodb://provider_control:<password>@mongo:27017/ulvia_provider_control?authSource=admin
#   CMS_SESSION_SECRET=$(openssl rand -hex 32)
#   CMS_KEK_HEX=$(openssl rand -hex 32)
#   ULVIA_PROVIDER_OPERATOR_TOKEN=$(openssl rand -hex 32)
#
# Add these after POST /ulvia/operator/instances and before starting `cms`:
#   MONGO_URL=mongodb://cms_client:<site-password>@mongo:27017/ulvia_instance_<id>?authSource=ulvia_instance_<id>
#   ULVIA_INSTANCE_TOKEN=<returned token>
#   ULVIA_INSTANCE_STORAGE_KEY=<returned storageKey>
#
# `MONGO_URL` may instead target an external cluster. It remains explicit so
# local shared-Mongo and managed-cluster deployments follow the same contract.

services:
    repository:
        image: ${CMS_IMAGE:?CMS_IMAGE must be an immutable version tag or digest}
        restart: unless-stopped
        init: true
        command: ["bun", "run", "packages/runtimes/official-repository-server/src/index.ts"]
        environment:
            NODE_ENV:                    production
            ULVIA_REPOSITORY_DIR:         /var/lib/ulvia-repository/current
            ULVIA_REPOSITORY_SEED_DIR:    /opt/ulvia-repository-seed
            ULVIA_REPOSITORY_TOKEN:       ${ULVIA_REPOSITORY_TOKEN:?ULVIA_REPOSITORY_TOKEN must be set}
            REPOSITORY_HOST:              0.0.0.0
            REPOSITORY_PORT:              "3100"
        volumes:
            - repository_data:/var/lib/ulvia-repository
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=64m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        networks:
            - cms_internal
        healthcheck:
            test: ["CMD", "bun", "-e", "const response = await fetch('http://127.0.0.1:3100/readyz'); if (!response.ok) process.exit(1); await response.body?.cancel()"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        stop_grace_period: 15s

    provider:
        image: ${CMS_IMAGE:?CMS_IMAGE must be an immutable version tag or digest}
        restart: unless-stopped
        init: true
        command: ["bun", "run", "packages/runtimes/ulvia-provider-server/src/index.ts"]
        environment:
            MODE:                 PROD
            NODE_ENV:             production
            CMS_FILES_DIR:        /var/lib/cms/files
            CMS_REPOSITORY_URL:   http://repository:3100
            ULVIA_PROVIDER_PORT:            "5103"
            ULVIA_PROVIDER_HOST:            127.0.0.1
            ULVIA_PROVIDER_PUBLIC_URL:      http://127.0.0.1:5103

            # Application secrets are injected from `.env`; no secret value is
            # stored in this file or included in the image.
            CMS_SESSION_SECRET:   ${CMS_SESSION_SECRET:?CMS_SESSION_SECRET must be set (32+ chars; openssl rand -hex 32)}
            CMS_KEK_HEX:          ${CMS_KEK_HEX:?CMS_KEK_HEX must be set (32 bytes hex = 64 chars; openssl rand -hex 32)}
            ULVIA_PROVIDER_OPERATOR_TOKEN: ${ULVIA_PROVIDER_OPERATOR_TOKEN:?ULVIA_PROVIDER_OPERATOR_TOKEN must be set}
            # Control-plane account: it creates and opens isolated instance databases.
            # The Kernel never receives this credential.
            MONGO_URL: ${ULVIA_PROVIDER_MONGO_URL:?ULVIA_PROVIDER_MONGO_URL must be set}

            CMS_COLLECTION_MIGRATION_ROLLBACK_RETENTION: "${CMS_COLLECTION_MIGRATION_ROLLBACK_RETENTION:-100}"

            # nginx-proxy + acme-companion routing/cert directives.
            VIRTUAL_HOST_MULTIPORTS: |-
                ${DOMAIN}:
                  "/":
                    port: 3000
            ACME_HOST: "${DOMAIN}"
            # Compatibility with legacy acme-companion releases during an
            # in-place server migration. Current releases prefer ACME_HOST.
            LETSENCRYPT_HOST: "${DOMAIN}"
        volumes:
            - ./files:/var/lib/cms/files
        depends_on:
            repository:
                condition: service_healthy
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=256m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        expose:
            - "3000"
        networks:
            # Requires Docker Compose 2.33.1+. This must remain the default
            # gateway so outbound HTTP/SMTP never targets the internal MongoDB
            # network.
            cms_proxy:
                gw_priority: 1
            # The server process and network are shared; database credentials
            # remain instance-specific.
            cms_mongo: {}
            cms_internal: {}
        healthcheck:
            test:
                - CMD
                - bun
                - -e
                - >-
                    const response = await fetch("http://127.0.0.1:5103/ulvia/operator/instances", { headers: { authorization: "Bearer " + process.env.ULVIA_PROVIDER_OPERATOR_TOKEN } });
                    if (!response.ok) process.exit(1);
                    await response.body?.cancel();
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        stop_grace_period: 30s

    cms:
        image: ${CMS_IMAGE:?CMS_IMAGE must be an immutable version tag or digest}
        restart: unless-stopped
        init: true
        command: ["bun", "run", "packages/runtimes/cms-kernel-server/src/index.ts"]
        network_mode: "service:provider"
        environment:
            MODE:                 PROD
            NODE_ENV:             production
            KERNEL_PORT:          "3000"
            KERNEL_HOST:          0.0.0.0
            KERNEL_PUBLIC_URL:    "https://${DOMAIN:?DOMAIN must be set}"
            CMS_FILES_DIR:        /var/lib/cms/files/${ULVIA_INSTANCE_STORAGE_KEY:-unprovisioned}
            ULVIA_PROVIDER_URL:   http://127.0.0.1:5103

            CMS_SESSION_SECRET:   ${CMS_SESSION_SECRET:?CMS_SESSION_SECRET must be set (32+ chars; openssl rand -hex 32)}
            CMS_KEK_HEX:          ${CMS_KEK_HEX:?CMS_KEK_HEX must be set (32 bytes hex = 64 chars; openssl rand -hex 32)}
            ULVIA_INSTANCE_TOKEN: ${ULVIA_INSTANCE_TOKEN:-unprovisioned-instance-token-not-valid}
            MONGO_URL: ${MONGO_URL:-mongodb://unprovisioned.invalid/unprovisioned}

            CMS_AUTH_SITE_NAME:                      ${CMS_AUTH_SITE_NAME:-CMS}
            CMS_AUTH_EMAIL_COOLDOWN_SECONDS:         "${CMS_AUTH_EMAIL_COOLDOWN_SECONDS:-300}"
            CMS_COLLECTION_MIGRATION_ROLLBACK_RETENTION: "${CMS_COLLECTION_MIGRATION_ROLLBACK_RETENTION:-100}"
            CMS_AUTH_EMAIL_VERIFICATION_URL:         ${CMS_AUTH_EMAIL_VERIFICATION_URL:-https://${DOMAIN}/auth/confirm-email}
            CMS_AUTH_PASSWORD_RESET_URL:             ${CMS_AUTH_PASSWORD_RESET_URL:-https://${DOMAIN}/auth/reset-password}

            SMTP_HOST:                      ${SMTP_HOST:-}
            SMTP_PORT:                      ${SMTP_PORT:-}
            SMTP_SECURE:                    ${SMTP_SECURE:-}
            SMTP_USER:                      ${SMTP_USER:-}
            SMTP_PASSWORD:                  ${SMTP_PASSWORD:-}
            SMTP_FROM:                      ${SMTP_FROM:-}
            SMTP_REPLY_TO:                  ${SMTP_REPLY_TO:-}
        volumes:
            - ./files:/var/lib/cms/files
        depends_on:
            provider:
                condition: service_healthy
            repository:
                condition: service_healthy
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=256m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        healthcheck:
            test:
                - CMD
                - bun
                - -e
                - >-
                    const response = await fetch("http://127.0.0.1:3000/login");
                    if (response.status >= 500) process.exit(1);
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        stop_grace_period: 30s

networks:
    cms_proxy:
        external: true
    cms_mongo:
        external: true
    cms_internal:
        internal: true

volumes:
    repository_data: {}
