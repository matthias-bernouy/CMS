# Per-instance CMS deployment. Copy this file + a `.env` to a dedicated
# folder on the server (one folder per client/site), then run
# `docker compose up -d`. The shared nginx-proxy, ACME, and MongoDB
# infrastructure must already be running — see `infra/compose.yml`.
#
# MongoDB runs once per server (or as an external managed cluster). Each CMS
# instance uses its own database, selected by the path in `MONGO_URL`. Instances
# share the MongoDB server process, `cms_mongo` network, and application account,
# while their collections remain separated by database.
#
# nginx-proxy detects the CMS container via `VIRTUAL_HOST_MULTIPORTS` and
# routes:
#   - ${DOMAIN}        -> :3001 (Delivery, public site)
#   - admin.${DOMAIN}  -> :3000 (Control, admin)
#
# Required `.env` values (never commit that file):
#   DOMAIN=client.example.com
#   CMS_IMAGE=bernouy/cms:<immutable-version>
#   MONGO_URL=mongodb://cms_runtime:<shared-password>@mongo:27017/cms_client?authSource=admin
#   CMS_SESSION_SECRET=$(openssl rand -hex 32)
#   CMS_KEK_HEX=$(openssl rand -hex 32)
#   CMS_ADMIN_PASSWORD=$(openssl rand -base64 18)
#   P9R_INTEGRATION_REPOSITORY_URL=https://repository.example.com/.cms/repository
#
# `MONGO_URL` may instead target an external cluster. It remains explicit so
# local shared-Mongo and managed-cluster deployments follow the same contract.

services:
    cms:
        image: ${CMS_IMAGE:?CMS_IMAGE must be an immutable version tag or digest}
        restart: unless-stopped
        init: true
        environment:
            MODE:                 PROD
            NODE_ENV:             production
            CONTROL_PORT:         "3000"
            DELIVERY_PORT:        "3001"
            CONTROL_PUBLIC_URL:   "https://admin.${DOMAIN:?DOMAIN must be set}"
            DELIVERY_PUBLIC_URL:  "https://${DOMAIN}"
            CMS_FILES_DIR:        /var/lib/cms/files
            CMS_INTEGRATION_PACKAGE_CACHE_DIR: ${CMS_INTEGRATION_PACKAGE_CACHE_DIR:-/var/lib/cms/integration-packages}

            # Application secrets are injected from `.env`; no secret value is
            # stored in this file or included in the image.
            CMS_SESSION_SECRET:   ${CMS_SESSION_SECRET:?CMS_SESSION_SECRET must be set (32+ chars; openssl rand -hex 32)}
            CMS_KEK_HEX:          ${CMS_KEK_HEX:?CMS_KEK_HEX must be set (32 bytes hex = 64 chars; openssl rand -hex 32)}
            CMS_ADMIN_EMAIL:      ${CMS_ADMIN_EMAIL:-admin@${DOMAIN}}
            CMS_ADMIN_PASSWORD:   ${CMS_ADMIN_PASSWORD:?CMS_ADMIN_PASSWORD must be set}
            ANALYTICS_SALT_SECRET: ${ANALYTICS_SALT_SECRET:?ANALYTICS_SALT_SECRET must be set and shared by all replicas}
            ANALYTICS_TRUST_PROXY: ${ANALYTICS_TRUST_PROXY:-false}

            # Public integration-package downloads are limited by client IP.
            # nginx-proxy is the standard deployment's one trusted ingress
            # hop; include every additional CDN or proxy in this count.
            CMS_HTTP_CLIENT_ADDRESS_MODE:                    ${CMS_HTTP_CLIENT_ADDRESS_MODE:-trusted-proxy}
            CMS_HTTP_TRUSTED_PROXY_HOPS:                     "${CMS_HTTP_TRUSTED_PROXY_HOPS:-1}"
            CMS_INTEGRATION_PACKAGE_DOWNLOAD_LIMIT:          "${CMS_INTEGRATION_PACKAGE_DOWNLOAD_LIMIT:-60}"
            CMS_INTEGRATION_PACKAGE_DOWNLOAD_WINDOW_SECONDS: "${CMS_INTEGRATION_PACKAGE_DOWNLOAD_WINDOW_SECONDS:-60}"

            # Source-endpoint observability. The aggregate collector is enabled
            # by default; detailed diagnostics remain sampled separately.
            ENDPOINT_PERFORMANCE_ENABLED:          "${ENDPOINT_PERFORMANCE_ENABLED:-true}"
            SOURCE_TIMING_SAMPLE_RATE:             "${SOURCE_TIMING_SAMPLE_RATE:-0.01}"
            SOURCE_SLOW_REQUEST_THRESHOLD_MS:      "${SOURCE_SLOW_REQUEST_THRESHOLD_MS:-1000}"

            # Independent opt-out switches for bounded Source derivatives,
            # explicitly public markup, and private/unclassified markup.
            CMS_SOURCE_IMAGE_TRANSFORMS_ENABLED:           "${CMS_SOURCE_IMAGE_TRANSFORMS_ENABLED:-true}"
            CMS_RESPONSIVE_PUBLIC_SOURCE_IMAGES_ENABLED:   "${CMS_RESPONSIVE_PUBLIC_SOURCE_IMAGES_ENABLED:-true}"
            CMS_RESPONSIVE_PRIVATE_SOURCE_IMAGES_ENABLED:  "${CMS_RESPONSIVE_PRIVATE_SOURCE_IMAGES_ENABLED:-true}"

            # Required for both the server-wide MongoDB service and an external
            # cluster. The database path is dedicated to this instance; the
            # application credential may be shared, but must never be root.
            MONGO_URL: ${MONGO_URL:?MONGO_URL must be set to this instance's authenticated MongoDB database}

            # Public authentication links and throttling.
            CMS_AUTH_SITE_NAME:                      ${CMS_AUTH_SITE_NAME:-CMS}
            CMS_AUTH_EMAIL_COOLDOWN_SECONDS:         "${CMS_AUTH_EMAIL_COOLDOWN_SECONDS:-300}"
            CMS_AUTH_EMAIL_VERIFICATION_URL:         ${CMS_AUTH_EMAIL_VERIFICATION_URL:-https://${DOMAIN}/auth/confirm-email}
            CMS_AUTH_PASSWORD_RESET_URL:             ${CMS_AUTH_PASSWORD_RESET_URL:-https://${DOMAIN}/auth/reset-password}
            CMS_CONTROL_AUTH_EMAIL_VERIFICATION_URL: ${CMS_CONTROL_AUTH_EMAIL_VERIFICATION_URL:-https://admin.${DOMAIN}/auth/verify-email}
            CMS_CONTROL_AUTH_PASSWORD_RESET_URL:     ${CMS_CONTROL_AUTH_PASSWORD_RESET_URL:-https://admin.${DOMAIN}/auth/reset-password}

            # Every CMS consumes the canonical public integration repository.
            # Ordinary Delivery listeners do not mirror these repository routes.
            P9R_INTEGRATION_REPOSITORY_URL: ${P9R_INTEGRATION_REPOSITORY_URL:?P9R_INTEGRATION_REPOSITORY_URL must point to the public integration repository API}
            SMTP_HOST:                      ${SMTP_HOST:-}
            SMTP_PORT:                      ${SMTP_PORT:-}
            SMTP_SECURE:                    ${SMTP_SECURE:-}
            SMTP_USER:                      ${SMTP_USER:-}
            SMTP_PASSWORD:                  ${SMTP_PASSWORD:-}
            SMTP_FROM:                      ${SMTP_FROM:-}
            SMTP_REPLY_TO:                  ${SMTP_REPLY_TO:-}

            # nginx-proxy + acme-companion routing/cert directives.
            VIRTUAL_HOST_MULTIPORTS: |-
                ${DOMAIN}:
                  "/":
                    port: 3001
                admin.${DOMAIN}:
                  "/":
                    port: 3000
            ACME_HOST: "${DOMAIN},admin.${DOMAIN}"
            # Compatibility with legacy acme-companion releases during an
            # in-place server migration. Current releases prefer ACME_HOST.
            LETSENCRYPT_HOST: "${DOMAIN},admin.${DOMAIN}"
        volumes:
            - ./files:/var/lib/cms/files
            - type: bind
              source: ./integration-packages
              target: ${CMS_INTEGRATION_PACKAGE_CACHE_DIR:-/var/lib/cms/integration-packages}
              bind:
                  create_host_path: false
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=256m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        expose:
            - "3000"
            - "3001"
        networks:
            # Requires Docker Compose 2.33.1+. This must remain the default
            # gateway so outbound HTTP/SMTP never targets the internal MongoDB
            # network.
            cms_proxy:
                gw_priority: 1
            # The server process, network, and application credential are
            # shared; the database selected in `MONGO_URL` is instance-specific.
            cms_mongo: {}
        healthcheck:
            test:
                - CMD
                - bun
                - -e
                - >-
                    const responses = await Promise.all([
                      fetch("http://127.0.0.1:3000/login"),
                      fetch("http://127.0.0.1:3001/")
                    ]);
                    if (responses.some((response) => response.status >= 500)) process.exit(1);
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        stop_grace_period: 30s

networks:
    cms_proxy:
        external: true
    cms_mongo:
        external: true
