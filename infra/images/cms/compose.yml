# One stateless CMS Kernel deployment. Shared infrastructure owns persistence,
# the official repository, file storage and the multi-instance Ulvia Provider.
services:
    cms:
        image: ${CMS_IMAGE:?CMS_IMAGE must be an immutable version tag or digest}
        restart: unless-stopped
        init: true
        command: ["bun", "run", "packages/runtimes/cms-kernel-server/src/index.ts"]
        environment:
            MODE: PROD
            NODE_ENV: production
            KERNEL_PORT: "3000"
            KERNEL_HOST: 0.0.0.0
            KERNEL_PUBLIC_URL: "https://${DOMAIN:?DOMAIN must be set}"
            ULVIA_PROVIDER_URL: http://ulvia-provider:5103
            ULVIA_INSTANCE_TOKEN: ${ULVIA_INSTANCE_TOKEN:?ULVIA_INSTANCE_TOKEN must be set}
            VIRTUAL_HOST: ${DOMAIN}
            VIRTUAL_PORT: "3000"
            ACME_HOST: ${DOMAIN}
            LETSENCRYPT_HOST: ${DOMAIN}
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=256m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        expose:
            - "3000"
        networks:
            cms_proxy:
                gw_priority: 1
            cms_provider: {}
        healthcheck:
            test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/login'); if(r.status>=500) process.exit(1); await r.body?.cancel()"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        stop_grace_period: 30s

networks:
    cms_proxy:
        external: true
    cms_provider:
        external: true
