# Shared CMS infrastructure — run once per server. It also runs the official
# repository and the single multi-instance Ulvia Provider.
#
#   - nginx-proxy:     dynamic reverse proxy. Watches the Docker socket;
#                      every container that publishes `VIRTUAL_HOST` (and
#                      `VIRTUAL_PORT` / `VIRTUAL_HOST_MULTIPORTS`) is added
#                      to the nginx config automatically, no reload script.
#   - acme-companion:  obtains + renews certificates for every container
#                      that declares `ACME_HOST`. Runs in
#                      a background loop, hooks `nginx -s reload` on cert
#                      change. Email comes from `DEFAULT_EMAIL` (set via
#                      `.env`).
#   - mongo:           authenticated shared persistence;
#   - repository:      the central immutable official catalogue;
#   - provider:        the central multi-instance official Provider.
#
# Copy `.env.example`, fill every value, then run `docker compose up -d --wait`.
# The stable `cms_proxy`, `cms_mongo`, and `cms_provider` networks and the
# `cms_files` volume are consumed by per-instance Kernel projects.

services:
    nginx-proxy:
        image: nginxproxy/nginx-proxy:1.11.5@sha256:e06db5fb9586234e9c2bdef707c8b8d784caa4fb49fbe7285eb3730a501c3eaa
        container_name: nginx-proxy
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - /var/run/docker.sock:/tmp/docker.sock:ro
            # Raise the default 1 MB upload cap (else large media/PDF uploads
            # to the administration area get nginx 413 before reaching the app).
            # http-level directive → applies to every vhost.
            - ./nginx-conf.d/client_max_body.conf:/etc/nginx/conf.d/zzz_client_max_body.conf:ro
            - ./nginx-conf.d/capability-cache.conf:/etc/nginx/conf.d/zzz_capability_cache.conf:ro
            - ./nginx-conf.d/query-safe-access-log.conf:/etc/nginx/conf.d/zzz_query_safe_access_log.conf:ro
            - ./nginx-vhost.d/default_location:/etc/nginx/vhost.d/default_location:ro
            - nginx_cache:/var/cache/nginx
            - nginx_certs:/etc/nginx/certs
            - nginx_vhost:/etc/nginx/vhost.d
            - nginx_html:/usr/share/nginx/html
            - nginx_acme:/etc/acme.sh
        networks:
            - cms_proxy
        healthcheck:
            test: ["CMD", "nginx", "-t"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    acme-companion:
        image: nginxproxy/acme-companion:2.8.1@sha256:ccfceb9798b9f6586d47eeeadbb8e185c8897b34e011a2739a9b82d5e92a8b6c
        container_name: acme-companion
        restart: unless-stopped
        depends_on:
            nginx-proxy:
                condition: service_healthy
        volumes_from:
            - nginx-proxy
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - nginx_acme:/etc/acme.sh
        environment:
            DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL must be set (used for renewal alerts)}
        networks:
            - cms_proxy

    mongo:
        image: mongo:7.0.37@sha256:d5b3ca8c3f3cdce78d44870dc0871b76d5235e9b2ad4ea6bea5d1fbff8027703
        restart: unless-stopped
        entrypoint: ["/bin/sh", "/opt/cms-mongo/validate-env.sh"]
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be a 64-character hexadecimal secret}
            MONGO_PROVIDER_USERNAME: ${MONGO_PROVIDER_USERNAME:?MONGO_PROVIDER_USERNAME must be set}
            MONGO_PROVIDER_PASSWORD: ${MONGO_PROVIDER_PASSWORD:?MONGO_PROVIDER_PASSWORD must be set}
        volumes:
            - mongo_data:/data/db
            - ./mongo/validate-env.sh:/opt/cms-mongo/validate-env.sh:ro
            - ./mongo/01-validate-root-user.js:/docker-entrypoint-initdb.d/01-validate-root-user.js:ro
            - ./mongo/02-create-provider-user.js:/docker-entrypoint-initdb.d/02-create-provider-user.js:ro
        networks:
            cms_mongo:
                aliases:
                    - mongo
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    mongosh --quiet --host 127.0.0.1
                    --username "$${MONGO_INITDB_ROOT_USERNAME}"
                    --password "$${MONGO_INITDB_ROOT_PASSWORD}"
                    --authenticationDatabase admin
                    --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        stop_grace_period: 30s

    repository:
        image: ${CMS_IMAGE:?CMS_IMAGE must be an immutable version tag or digest}
        restart: unless-stopped
        init: true
        command: ["bun", "run", "packages/runtimes/official-repository-server/src/index.ts"]
        environment:
            NODE_ENV: production
            ULVIA_REPOSITORY_DIR: /var/lib/ulvia-repository/current
            ULVIA_REPOSITORY_SEED_DIR: /opt/ulvia-repository-seed
            ULVIA_REPOSITORY_TOKEN: ${ULVIA_REPOSITORY_TOKEN:?ULVIA_REPOSITORY_TOKEN must be set}
            REPOSITORY_HOST: 0.0.0.0
            REPOSITORY_PORT: "3100"
        volumes:
            - repository_data:/var/lib/ulvia-repository
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=64m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        networks:
            - cms_provider
        healthcheck:
            test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3100/readyz'); if(!r.ok) process.exit(1); await r.body?.cancel()"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    provider:
        image: ${CMS_IMAGE:?CMS_IMAGE must be an immutable version tag or digest}
        restart: unless-stopped
        init: true
        command: ["bun", "run", "packages/runtimes/ulvia-provider-server/src/index.ts"]
        environment:
            MODE: PROD
            NODE_ENV: production
            CMS_FILES_DIR: /var/lib/cms/files
            CMS_REPOSITORY_URL: http://repository:3100
            CMS_SESSION_SECRET: ${ULVIA_PROVIDER_SESSION_SECRET:?ULVIA_PROVIDER_SESSION_SECRET must be set}
            CMS_KEK_HEX: ${ULVIA_PROVIDER_KEK_HEX:?ULVIA_PROVIDER_KEK_HEX must be set}
            MONGO_URL: mongodb://${MONGO_PROVIDER_USERNAME}:${MONGO_PROVIDER_PASSWORD}@mongo:27017/ulvia_provider_control?authSource=admin
            ULVIA_PROVIDER_PORT: "5103"
            ULVIA_PROVIDER_HOST: 0.0.0.0
            ULVIA_PROVIDER_PUBLIC_URL: http://127.0.0.1:5103
            ULVIA_PROVIDER_OPERATOR_TOKEN: ${ULVIA_PROVIDER_OPERATOR_TOKEN:?ULVIA_PROVIDER_OPERATOR_TOKEN must be set}
        volumes:
            - cms_files:/var/lib/cms/files
        depends_on:
            mongo:
                condition: service_healthy
            repository:
                condition: service_healthy
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=256m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        networks:
            cms_proxy:
                gw_priority: 1
            cms_mongo: {}
            cms_provider:
                aliases:
                    - ulvia-provider
        healthcheck:
            test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:5103/ulvia/operator/instances',{headers:{authorization:'Bearer '+process.env.ULVIA_PROVIDER_OPERATOR_TOKEN}}); if(!r.ok) process.exit(1); await r.body?.cancel()"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        stop_grace_period: 30s

networks:
    cms_proxy:
        name: cms_proxy
    cms_mongo:
        name: cms_mongo
        internal: true
    cms_provider:
        name: cms_provider
        internal: true

volumes:
    nginx_certs:
    nginx_vhost:
    nginx_html:
    nginx_acme:
    nginx_cache:
    mongo_data:
    repository_data:
    cms_files:
        name: cms_files
