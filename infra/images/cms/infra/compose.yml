# Shared CMS infrastructure — run ONCE per server, before bringing up any
# CMS instance. Provides:
#
#   - nginx-proxy:     dynamic reverse proxy. Watches the Docker socket;
#                      every container that publishes `VIRTUAL_HOST` (and
#                      `VIRTUAL_PORT` / `VIRTUAL_HOST_MULTIPORTS`) is added
#                      to the nginx config automatically, no reload script.
#   - acme-companion:  obtains + renews certificates for every container
#                      that declares `ACME_HOST`. Runs in
#                      a background loop, hooks `nginx -s reload` on cert
#                      change. Email comes from `DEFAULT_EMAIL` (set via
#                      `.env`).
#   - mongo:           one authenticated MongoDB server shared by all CMS
#                      instances. A root administrator and one application
#                      account are created when a fresh data volume starts.
#
# Usage:
#   cd infra/images/cms/infra
#   cat > .env <<'EOF'
#   LETSENCRYPT_EMAIL=ops@yourdomain.com
#   MONGO_ROOT_USERNAME=cms_root
#   MONGO_ROOT_PASSWORD=<64-character-hex-secret>
#   MONGO_APP_USERNAME=cms_runtime
#   MONGO_APP_PASSWORD=<64-character-hex-secret>
#   EOF
#   docker compose up -d
#
# The `cms_proxy` and `cms_mongo` networks have stable names so per-instance
# compose files (see ../compose.yml) can join them with `external: true`.

services:
    nginx-proxy:
        image: nginxproxy/nginx-proxy:1.11.5@sha256:e06db5fb9586234e9c2bdef707c8b8d784caa4fb49fbe7285eb3730a501c3eaa
        container_name: nginx-proxy
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - /var/run/docker.sock:/tmp/docker.sock:ro
            # Raise the default 1 MB upload cap (else large media/PDF uploads
            # to the Control admin get nginx 413 before reaching the app).
            # http-level directive → applies to every vhost.
            - ./nginx-conf.d/client_max_body.conf:/etc/nginx/conf.d/zzz_client_max_body.conf:ro
            - nginx_certs:/etc/nginx/certs
            - nginx_vhost:/etc/nginx/vhost.d
            - nginx_html:/usr/share/nginx/html
            - nginx_acme:/etc/acme.sh
        networks:
            - cms_proxy
        healthcheck:
            test: ["CMD", "nginx", "-t"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    acme-companion:
        image: nginxproxy/acme-companion:2.8.1@sha256:ccfceb9798b9f6586d47eeeadbb8e185c8897b34e011a2739a9b82d5e92a8b6c
        container_name: acme-companion
        restart: unless-stopped
        depends_on:
            nginx-proxy:
                condition: service_healthy
        volumes_from:
            - nginx-proxy
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - nginx_acme:/etc/acme.sh
        environment:
            DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL must be set (used for renewal alerts)}
        networks:
            - cms_proxy

    mongo:
        image: mongo:7.0.37@sha256:d5b3ca8c3f3cdce78d44870dc0871b76d5235e9b2ad4ea6bea5d1fbff8027703
        restart: unless-stopped
        entrypoint: ["/bin/sh", "/opt/cms-mongo/validate-env.sh"]
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be a 64-character hexadecimal secret}
            MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME must be set}
            MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD must be a 64-character hexadecimal secret}
        volumes:
            - mongo_data:/data/db
            - ./mongo/validate-env.sh:/opt/cms-mongo/validate-env.sh:ro
            - ./mongo/01-bootstrap-shared-users.js:/docker-entrypoint-initdb.d/01-bootstrap-shared-users.js:ro
        networks:
            cms_mongo:
                aliases:
                    - mongo
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    mongosh --quiet --host 127.0.0.1
                    --username "$${MONGO_INITDB_ROOT_USERNAME}"
                    --password "$${MONGO_INITDB_ROOT_PASSWORD}"
                    --authenticationDatabase admin
                    --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        stop_grace_period: 30s

networks:
    cms_proxy:
        name: cms_proxy
    cms_mongo:
        name: cms_mongo
        internal: true

volumes:
    nginx_certs:
    nginx_vhost:
    nginx_html:
    nginx_acme:
    mongo_data:
