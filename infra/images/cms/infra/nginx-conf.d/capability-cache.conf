# Cache only generic capability routes. Provider Cache-Control headers remain
# authoritative, so private and no-store responses are never retained.
proxy_cache_path /var/cache/nginx/cms levels=1:2 keys_zone=cms_capabilities:16m max_size=1g inactive=1h use_temp_path=off;

map $uri $cms_skip_capability_cache {
    default 1;
    ~^/(?:[^/]+/)*\.cms/call/ 0;
}

map $request_method $cms_cache_method {
    default $request_method;
    HEAD GET;
}
