# Common body for any server block that serves files of a bucket (the wildcard
# *.cdn.bernouy.com server and every generated alias server). Relies on the
# `$bucket_id` and `$cache_control` maps defined in nginx.conf.

# Unknown host (nothing in the map) → drop the connection without leaking info.
if ($bucket_id = "") { return 444; }

root /var/storage/buckets/$bucket_id;

location / {
    add_header Cache-Control            $cache_control always;
    add_header Access-Control-Allow-Origin "*"          always;
    try_files  $uri =404;
}
