<form>
    <label>File <input type="file" required></label>
    <label>Name (optional) <input type="text" name="name" placeholder="auto-filled from file"></label>
    <label>publicPath (optional, e.g. <code>blog/post.html</code>) <input type="text" name="publicPath" placeholder="leave empty for id-based URL"></label>
    <button type="submit">Upload</button>
    <div class="status" role="status" aria-live="polite"></div>
</form>
