# Reference docker-compose showing how the hub runs behind nginx-proxy.
# Not used by `init-server.sh` — copy and adapt for your deployment.
#
# Expected on the host:
#   /etc/nginx-proxy/{okms/client.crt, okms/client.key, bootstrap.env}
#   /etc/hub/{okms/client.crt, okms/client.key, bootstrap.env}
#
# Each `bootstrap.env` only carries the 5 OKMS_* vars; everything else
# comes from the OKMS bundle pulled at boot.

services:

    nginx-proxy:
        image: bernouy/nginx-proxy:0.1.0
        restart: unless-stopped
        networks: [bernouy-net]
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - nginx-proxy-data:/var/lib/nginx-proxy
            - /etc/nginx-proxy/okms/client.crt:/etc/okms/client.crt:ro
            - /etc/nginx-proxy/okms/client.key:/etc/okms/client.key:ro
        env_file:
            - /etc/nginx-proxy/bootstrap.env
        dns: [1.1.1.1, 8.8.8.8]

    hub:
        image: bernouy/hub:0.1.0
        restart: unless-stopped
        networks: [bernouy-net]
        # No `ports:` — joignable only via the docker network as `hub:3000`.
        volumes:
            - hub-data:/var/lib/hub
            - /etc/hub/okms/client.crt:/etc/okms/client.crt:ro
            - /etc/hub/okms/client.key:/etc/okms/client.key:ro
        env_file:
            - /etc/hub/bootstrap.env
        dns: [1.1.1.1, 8.8.8.8]
        depends_on:
            - nginx-proxy

networks:
    bernouy-net:
        # External so other services (cms-mt, auth, …) can attach over time
        # without docker-compose recreating the network. Create once :
        #     docker network create bernouy-net
        external: true

volumes:
    nginx-proxy-data:
    hub-data:
