# Bucket-serving body for the cdn-keycloak all-in-one image.
# Blobs live under /var/lib/cdn/buckets/<bucketId>/ (single mounted volume).
# Relies on the `$bucket_id`, `$cache_control` and `$bucket_notfound` maps
# from nginx.conf.

# Unknown host (nothing in the map) → drop the connection without leaking info.
if ($bucket_id = "") { return 444; }

root /var/lib/cdn/buckets/$bucket_id;

location / {
    add_header Cache-Control                $effective_cache_control always;
    add_header Access-Control-Allow-Origin  "*"                      always;

    # Pre-compressed siblings shipped by the Delivery build pipeline.
    # Static modules pick `<file>.br` or `<file>.gz` based on the client's
    # `Accept-Encoding` and add the matching Content-Encoding header.
    brotli_static on;
    gzip_static   on;

    error_page 404 = @bucket_notfound;
    try_files  $uri $uri.html $uri/index.html =404;
}

# Internal-only fallback that serves the bucket's configured 404 page when
# set, or returns plain 404 when not.
location @bucket_notfound {
    internal;
    try_files /$bucket_notfound =404;
}
