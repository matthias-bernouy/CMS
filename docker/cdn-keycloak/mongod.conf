# MongoDB config — single-container, loopback-only.
# Only the cdn user inside the container can talk to it (127.0.0.1:27017),
# never exposed off-box, so we run without auth for simplicity.

storage:
    dbPath: /var/lib/cdn/mongo

systemLog:
    destination: file
    path: /var/lib/cdn/mongo/mongod.log
    logAppend: true

net:
    port: 27017
    bindIp: 127.0.0.1

processManagement:
    timeZoneInfo: /usr/share/zoneinfo
