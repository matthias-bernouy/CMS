# Example deployment — copy + adapt. Assumes you've already built the base
# image (`bernouy/cdn-base:0.1.0`) from this repo.

services:

    cdn:
        build:
            context: .                  # the example/ folder is the build context
            dockerfile: Dockerfile      # extends bernouy/cdn-base
        ports:
            - "80:80"
            - "443:443"
        environment:
            # ─── Required ──────────────────────────────────────────────────
            MONGODB_URI:        "mongodb://mongo:27017/cdn"
            MAIN_DOMAIN:        "cdn.example.com"
            LEGO_EMAIL:         "ops@example.com"

            # ─── First-boot wildcard provisioning (DNS-01 — wildcard requires it) ──
            LEGO_DNS_PROVIDER:  "ovh"

            # ─── DNS provider credentials (forwarded to lego, run + renew) ─
            OVH_APPLICATION_KEY:    "${OVH_APPLICATION_KEY}"
            OVH_APPLICATION_SECRET: "${OVH_APPLICATION_SECRET}"
            OVH_CONSUMER_KEY:       "${OVH_CONSUMER_KEY}"
            OVH_ENDPOINT:           "ovh-eu"
        volumes:
            - storage:/var/storage/buckets
            - lego:/etc/lego
        depends_on:
            mongo:
                condition: service_healthy
        restart: unless-stopped

    mongo:
        image: mongo:7
        # NOTE: enable auth before exposing publicly — see packages/cdn/docs/prod/getting-started.md §4.
        volumes:
            - mongo-data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
            interval: 10s
            timeout: 5s
            retries: 6
        restart: unless-stopped

volumes:
    storage:
    lego:
    mongo-data:
