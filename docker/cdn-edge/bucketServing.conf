# Bucket-serving body for cdn-edge. Identical to cdn-keycloak's version
# — the docroot lives on the volume rsynced from the origin. Relies on
# the `$bucket_id`, `$effective_cache_control`, and `$bucket_notfound`
# maps from nginx.conf.

# Unknown host (nothing in the map) → drop the connection without
# leaking info.
if ($bucket_id = "") { return 444; }

root /var/lib/cdn/buckets/$bucket_id;

location / {
    add_header Cache-Control                $effective_cache_control always;
    add_header Access-Control-Allow-Origin  "*"                      always;

    # Pre-compressed siblings shipped by the Delivery build pipeline
    # (origin uploads `<file>.gz` next to each compressible asset).
    # brotli_static dropped — `brotli_*` modules aren't bundled by
    # upstream OpenResty; re-add via lua-resty-brotli or a custom build
    # if perf demands it.
    gzip_static on;

    error_page 404 = @bucket_notfound;
    try_files  $uri $uri.html $uri/index.html =404;
}

# Internal-only fallback that serves the bucket's configured 404 page
# when set, or returns plain 404 when not.
location @bucket_notfound {
    internal;
    try_files /$bucket_notfound =404;
}
