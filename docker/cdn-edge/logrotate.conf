/var/lib/cdn/access-logs/access.log {
    hourly
    rotate 168
    compress
    missingok
    notifempty
    sharedscripts
    nocreate
    su cdn-sync cdn-sync
    postrotate
        # nginx needs SIGUSR1 to close + reopen its log fds.
        [ -s /run/nginx.pid ] && kill -USR1 "$(cat /run/nginx.pid)" 2>/dev/null || true
    endscript
}
