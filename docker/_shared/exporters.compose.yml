# node_exporter + cAdvisor side-car for any production VPS in the
# monitoring mesh. Drop this file on the VPS as
# `/etc/cms-monitoring/exporters.compose.yml`, set WG_IP in
# `/etc/cms-monitoring/.env` to that node's WireGuard address
# (10.10.0.X), then `docker compose -f exporters.compose.yml up -d`.
#
# Bind addresses lock the metrics endpoints to the WireGuard interface
# only — they MUST be unreachable from the public internet, since they
# leak host topology, kernel version, and per-process stats.
#
# `cadvisor` mounts the host's /sys, /var/lib/docker, /var/run/docker.sock
# read-only so it can inspect every running container without coupling
# the monitoring stack to the production services on the same host.

services:

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    network_mode: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=${WG_IP}:9100
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker)($$|/)
      - --collector.filesystem.fs-types-exclude=^(overlay|tmpfs|devtmpfs|squashfs)$$
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://${WG_IP}:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    network_mode: host
    privileged: true
    command:
      - --listen_ip=${WG_IP}
      - --port=8080
      - --docker_only=true
      - --store_container_labels=false
      - --disable_metrics=accelerator,cpu_topology,disk,diskIO,hugetlb,memory_numa,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://${WG_IP}:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
