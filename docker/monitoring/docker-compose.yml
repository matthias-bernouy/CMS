# Central monitoring stack — deployed on the dedicated monitoring VPS.
#
# Components:
#   - Prometheus      time-series DB, scrapes the exporters on every other
#                     VPS over the WireGuard mesh (10.10.0.0/24). 30-day
#                     retention by default, tunable via PROMETHEUS_RETENTION.
#   - Alertmanager    routes Prometheus alerts to Discord/Slack via webhook.
#                     Webhook URL injected via env, never committed.
#   - Grafana         dashboards + ad-hoc queries. Auth via Keycloak OAuth
#                     (the cms-control-mt superadmin realm) — admins land on
#                     dashboards, anyone else gets 403.
#   - Caddy           reverse proxy on :443 for `grafana.bernouy.com`. Auto-
#                     issues + renews Let's Encrypt certs (HTTP-01 / port 80).
#                     Replaces the nginx + lego stack used by other services
#                     here because the surface is tiny and Caddy has it
#                     built in — single config file, single container.
#
# Persistence:
#   - prometheus-data: time-series db (retention bound, but resizable).
#   - alertmanager-data: silence + notification dedup state.
#   - grafana-data: dashboards, users, API keys.
#   - caddy-data + caddy-config: ACME account, certs, OCSP cache.
#
# Networking:
#   - Caddy listens on :80 (ACME http-01 only) and :443 (grafana proxy).
#   - Prometheus scrapes use the host's wg0 interface — compose uses
#     `network_mode: host` for those containers so they reach 10.10.0.X
#     transparently. Same trick on the production VPS exporters.
#   - Grafana, Alertmanager, Prometheus communicate over docker network
#     `monitoring` for the Caddy proxy + the Prom→AM link.

services:

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    networks: [monitoring]
    # No host-network: docker bridge → host → wg0 works fine for scraping
    # 10.10.0.X (host has the wg0 route, container traffic NATs through it).
    # Keeps the stack self-contained on a single docker network.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.external-url=http://prometheus:9090
      - --web.enable-lifecycle                      # /-/reload via SIGHUP-equivalent
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    networks: [monitoring]
    # Alertmanager doesn't expand env vars in its config — render the
    # template at boot via sed, then exec. Keeps the secret webhook URL
    # out of the committed config file.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed "s|\${ALERT_WEBHOOK_URL}|$$ALERT_WEBHOOK_URL|g" \
            /etc/alertmanager/alertmanager.yml.template \
            > /tmp/alertmanager.yml &&
        exec /bin/alertmanager \
            --config.file=/tmp/alertmanager.yml \
            --storage.path=/alertmanager \
            --web.listen-address=:9093
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:?ALERT_WEBHOOK_URL is required (Discord/Slack webhook)}
    volumes:
      - ./alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    networks: [monitoring]
    environment:
      # Public URL — Grafana uses this for OAuth redirects.
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:?GRAFANA_DOMAIN is required}/
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: "3000"

      # First-boot admin password — change after login via the UI, this
      # only seeds the initial account. After first login, future starts
      # ignore this; admin/admin combo is disabled.
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required (used only at first boot)}
      GF_USERS_ALLOW_SIGN_UP:     "false"

      # Keycloak OAuth. Client_id + client_secret + issuer come from the
      # `grafana` client you create in the superadmin Keycloak realm.
      # Role mapping: realm role `grafana-admin` → Grafana Admin,
      # `grafana-editor` → Editor, everything else → Viewer (or denied
      # entirely if `role_attribute_strict` is on).
      GF_AUTH_GENERIC_OAUTH_ENABLED:              "true"
      GF_AUTH_GENERIC_OAUTH_NAME:                 Keycloak
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP:        "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID:            ${GRAFANA_KEYCLOAK_CLIENT_ID:?GRAFANA_KEYCLOAK_CLIENT_ID is required}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:        ${GRAFANA_KEYCLOAK_CLIENT_SECRET:?GRAFANA_KEYCLOAK_CLIENT_SECRET is required}
      GF_AUTH_GENERIC_OAUTH_SCOPES:               "openid profile email"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL:             ${GRAFANA_KEYCLOAK_ISSUER:?GRAFANA_KEYCLOAK_ISSUER is required}/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL:            ${GRAFANA_KEYCLOAK_ISSUER}/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL:              ${GRAFANA_KEYCLOAK_ISSUER}/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH:  "contains(realm_access.roles[*], 'grafana-admin') && 'Admin' || contains(realm_access.roles[*], 'grafana-editor') && 'Editor' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "false"

      # Stops Grafana from phoning home for plugin update checks etc.
      GF_ANALYTICS_REPORTING_ENABLED:    "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES:    "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.8-alpine
    container_name: caddy
    restart: unless-stopped
    networks: [monitoring]
    ports:
      - "80:80"
      - "443:443"
    environment:
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN}
      LEGO_EMAIL:     ${LEGO_EMAIL:?LEGO_EMAIL is required (used by ACME for renewal warnings)}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - grafana

networks:
  monitoring:

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  caddy-data:
  caddy-config:
