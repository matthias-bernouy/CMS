# Prometheus scrape config — pulls metrics from every production node's
# node_exporter (host metrics) and cAdvisor (per-container metrics) over
# the WireGuard mesh. The instance label uses the human node name, NOT
# the IP, so dashboards stay stable if the IPs ever change.
#
# Adding a new node:
#   1. Allocate a 10.10.0.X via the wireguard generate-mesh script.
#   2. Deploy `docker/_shared/exporters.compose.yml` on the new VPS.
#   3. Append two `- targets: [...]` entries below (one node, one cadvisor).
#   4. `docker compose exec prometheus kill -HUP 1` to hot-reload.

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: bernouy-prod

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:

  # Prometheus self — useful to know if the scraper itself is healthy.
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]
        labels: { instance: monitoring }

  # Host metrics (CPU / RAM / disk / network / etc.) per node, via
  # node_exporter on port 9100 of each peer's WireGuard IP.
  - job_name: node
    static_configs:
      - targets: [10.10.0.2:9100]
        labels: { instance: cms }
      - targets: [10.10.0.3:9100]
        labels: { instance: cdn-origin }
      - targets: [10.10.0.4:9100]
        labels: { instance: cdn-edge }

  # Per-container metrics via cAdvisor. Same host targets, different port.
  - job_name: cadvisor
    static_configs:
      - targets: [10.10.0.2:8080]
        labels: { instance: cms }
      - targets: [10.10.0.3:8080]
        labels: { instance: cdn-origin }
      - targets: [10.10.0.4:8080]
        labels: { instance: cdn-edge }

  # Public HTTP probes — answers "does the user-facing URL respond at
  # all?". Uses the blackbox_exporter pattern via a small inline relabel
  # trick: we hit each URL with prometheus' http_2xx module (requires
  # blackbox_exporter — uncomment + deploy if you want this).
  #
  # - job_name: blackbox-http
  #   metrics_path: /probe
  #   params: { module: [http_2xx] }
  #   static_configs:
  #     - targets:
  #         - https://cms.bernouy.com/
  #         - https://cdn.bernouy.com/
  #         - https://cdn-origin.bernouy.com/admin
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label:  __param_target
  #     - source_labels: [__param_target]
  #       target_label:  instance
  #     - target_label:  __address__
  #       replacement:   blackbox-exporter:9115
