# Alert rules. Kept minimal and actionable — every rule below has a
# clear "what to do" runbook line in its annotation. Add new rules only
# when you'd actually want to be paged for them at 3am.
#
# Severity convention:
#   critical → immediate page (service down, disk full, etc.)
#   warning  → fix this week (capacity trends, slow degradation)
#
# Alertmanager routes both to the same Discord/Slack webhook for now,
# but they're labelled so you can split routes later.

groups:

  - name: host
    interval: 30s
    rules:

      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is unreachable"
          description: "Prometheus has been unable to scrape node_exporter on {{ $labels.instance }} for 2+ minutes. Either the VPS is down, the WireGuard tunnel is down, or the exporter container is dead."

      - alert: HostHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} CPU sustained >90%"
          description: "5m avg CPU usage stayed over 90% for 10 minutes on {{ $labels.instance }}. Investigate runaway container or genuine traffic spike."

      - alert: HostHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} memory >90% used"
          description: "Available RAM dropped under 10% on {{ $labels.instance }}. If sustained, kernel OOM-killer will start culling containers."

      - alert: HostDiskFilling
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} root fs <15% free"
          description: "Root filesystem on {{ $labels.instance }} has under 15% free space. Common causes: docker image bloat, log rotation broken, lego cert dir leaking."

      - alert: HostDiskCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 5
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} root fs <5% free"
          description: "Critical: root fs filling on {{ $labels.instance }}. Imminent risk of write failures across all services. Prune docker images, rotate logs."

  - name: container
    interval: 30s
    rules:

      - alert: ContainerRestartLoop
        expr: |
          rate(container_last_seen{name!=""}[5m]) == 0
          and on (instance, name)
          changes(container_start_time_seconds{name!=""}[15m]) > 3
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.name }} on {{ $labels.instance }} restart-looping"
          description: "Container {{ $labels.name }} restarted more than 3 times in 15 minutes. Likely crashloop — check `docker logs {{ $labels.name }}`."

      - alert: ContainerHighMemory
        expr: |
          (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""}) * 100 > 90
          and on (name) container_spec_memory_limit_bytes{name!=""} > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.name }} on {{ $labels.instance }} >90% of memory limit"
          description: "Container {{ $labels.name }} is close to its docker memory cap. OOM-kill imminent. Either raise the limit or investigate leak."

  - name: scrape
    interval: 30s
    rules:

      - alert: PrometheusScrapeDown
        expr: up{job=~"node|cadvisor"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Prometheus can't scrape {{ $labels.job }} on {{ $labels.instance }}"
          description: "Specific exporter down on {{ $labels.instance }} ({{ $labels.job }}) — host may still be alive but losing visibility. Check the exporter container."
