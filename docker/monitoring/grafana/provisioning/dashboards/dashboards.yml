# Grafana dashboard provider. Loads every .json file in the dashboards/
# folder at boot and refreshes every 30s if files change. Set
# `allowUiUpdates: true` so operators can tweak dashboards live without
# losing the changes on container restart (Grafana saves edits back to
# the volume, file-stored dashboards stay as templates).

apiVersion: 1

providers:
  - name:                bernouy
    orgId:               1
    folder:              ""
    type:                file
    disableDeletion:     false
    allowUiUpdates:      true
    updateIntervalSeconds: 30
    options:
      path:                   /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
