# Grafana data sources, provisioned at boot. Prometheus is reachable
# from Grafana via the shared `monitoring` docker network, so we resolve
# the service by its container name.

apiVersion: 1

datasources:
  - name:      Prometheus
    type:      prometheus
    access:    proxy
    url:       http://prometheus:9090
    isDefault: true
    editable:  false
    jsonData:
      timeInterval:   15s
      httpMethod:     POST
      manageAlerts:   false
