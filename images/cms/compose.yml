# Per-instance CMS deployment. Copy this file + a `.env` to a dedicated
# folder on the server (one folder per client/site) and run
# `docker compose up -d`. The shared infrastructure (nginx-proxy,
# acme-companion, mongo) must already be running — see `infra/compose.yml`.
#
# nginx-proxy detects the container via the `VIRTUAL_HOST_MULTIPORTS`
# env var and routes:
#   - ${DOMAIN}        → :3001 (Delivery, public site)
#   - admin.${DOMAIN}  → :3000 (Control, admin)
# acme-companion obtains certs for both hostnames.
#
# Required `.env`:
#   DOMAIN=clientX.com
#   INSTANCE_ID=clientX                                 # mongo db name suffix
#   CMS_SESSION_SECRET=$(openssl rand -hex 32)
#   CMS_KEK_HEX=$(openssl rand -hex 32)
#   CMS_ADMIN_PASSWORD=$(openssl rand -base64 18)
#   ANALYTICS_SALT_SECRET=$(openssl rand -hex 32)       # optional; share across instances
#
# Override `MONGO_URL` to point at an external cluster (Atlas, …) — the
# default uses the bundled mongo from `infra/compose.yml`.
#
# DNS: both A/AAAA records for `${DOMAIN}` and `admin.${DOMAIN}` must
# resolve to the server before the first `up`, otherwise acme-companion
# will fail to obtain the cert (it retries automatically once DNS is up).

services:
    cms:
        image: bernouy/cms:basic
        restart: unless-stopped
        environment:
            CONTROL_PORT:        "3000"
            DELIVERY_PORT:       "3001"
            CONTROL_PUBLIC_URL:  "https://admin.${DOMAIN:?DOMAIN must be set}"
            DELIVERY_PUBLIC_URL: "https://${DOMAIN}"
            CMS_SESSION_SECRET:  ${CMS_SESSION_SECRET:?CMS_SESSION_SECRET must be set (32+ chars; openssl rand -hex 32)}
            CMS_KEK_HEX:         ${CMS_KEK_HEX:?CMS_KEK_HEX must be set (32 bytes hex = 64 chars; openssl rand -hex 32)}
            CMS_ADMIN_EMAIL:     ${CMS_ADMIN_EMAIL:-admin@${DOMAIN}}
            CMS_ADMIN_PASSWORD:  ${CMS_ADMIN_PASSWORD:?CMS_ADMIN_PASSWORD must be set}
            CMS_FILES_DIR:       /var/lib/cms/files
            MONGO_URL:           ${MONGO_URL:-mongodb://mongo:27017/cms_${INSTANCE_ID:?INSTANCE_ID must be set when MONGO_URL is not (used as mongo db name suffix)}}
            ANALYTICS_SALT_SECRET: ${ANALYTICS_SALT_SECRET:-}
            NODE_ENV:            production

            # nginx-proxy + acme-companion routing/cert directives. The
            # YAML block tells nginx-proxy to route Delivery on the apex
            # and Control on the admin subdomain. Both hostnames get a
            # cert from acme-companion via `LETSENCRYPT_HOST`.
            VIRTUAL_HOST_MULTIPORTS: |-
                ${DOMAIN}:
                  "/":
                    port: 3001
                admin.${DOMAIN}:
                  "/":
                    port: 3000
            LETSENCRYPT_HOST: "${DOMAIN},admin.${DOMAIN}"
        volumes:
            - ./files:/var/lib/cms/files
        expose:
            - "3000"
            - "3001"
        networks:
            - cms_net

networks:
    cms_net:
        external: true
