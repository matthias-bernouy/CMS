# Minimal reverse proxy for the basic CMS image. nginx terminates HTTP on
# :80 and forwards everything to the Bun process on `cms:3000`. The same
# upstream serves /cms/* (admin) and /* (public pages) — the Bun routing
# dispatches between Control and Delivery internally.

worker_processes  1;

events {
    worker_connections  256;
}

http {
    sendfile      on;
    server_tokens off;

    # Large enough for media uploads through the admin Files page.
    client_max_body_size 50m;

    upstream cms_upstream {
        server cms:3000;
        keepalive 16;
    }

    server {
        listen      80 default_server;
        server_name _;

        location / {
            proxy_pass         http://cms_upstream;
            proxy_http_version 1.1;
            # `$http_host` preserves the port; `$host` strips it, which breaks
            # the CSRF same-origin check inside the bun process.
            proxy_set_header   Host               $http_host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   Connection         "";
            proxy_read_timeout 60s;
        }
    }
}
