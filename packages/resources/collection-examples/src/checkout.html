<article aria-label="{{ cms.i18n.checkout.title }}">
    <header>
        <h2>{{ cms.i18n.checkout.title }}</h2>
        <p>{{ cms.i18n.checkout.greeting }}</p>
    </header>
    <p aria-live="polite">{{ cms.i18n.checkout.items }}</p>
    <label>
        <span>{{ cms.i18n.checkout.note }}</span>
        <input type="text" placeholder="{{ cms.i18n.checkout.placeholder }}" aria-label="{{ cms.i18n.checkout.note }}">
    </label>
    <p>{{ cms.i18n.checkout.delivery }}</p>
    <button type="button" disabled>{{ cms.i18n.checkout.action }}</button>
</article>
