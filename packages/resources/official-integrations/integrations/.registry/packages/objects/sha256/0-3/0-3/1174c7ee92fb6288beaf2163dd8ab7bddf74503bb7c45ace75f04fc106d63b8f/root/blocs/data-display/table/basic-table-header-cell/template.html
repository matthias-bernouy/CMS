<div class="header-wrapper" part="wrapper">

    <button
        type="button"
        class="filter-trigger"
        data-filter-toggle
        part="filter-trigger"
        aria-label="Filter column"
        aria-haspopup="dialog"
        aria-expanded="false"
        hidden
    >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
        </svg>
    </button>
    <div class="filter-popover" data-filter-popover part="filter-popover" role="dialog" hidden>
        <input type="text" part="filter-input">
    </div>
    <a data-navigation hidden></a>
</div>
