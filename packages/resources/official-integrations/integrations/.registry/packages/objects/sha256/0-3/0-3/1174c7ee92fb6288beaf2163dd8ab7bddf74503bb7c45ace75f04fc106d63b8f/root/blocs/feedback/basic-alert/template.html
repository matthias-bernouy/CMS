<div class="alert" part="alert">
    <span class="icon" part="icon" aria-hidden="true" hidden><slot name="icon"></slot></span>
    <div class="body" part="body">
        <div class="title" part="title" hidden><slot name="title"></slot></div>
        <div class="message" part="message"><slot></slot></div>
    </div>
    <button class="close" part="close" type="button" aria-label="Dismiss alert" hidden>&times;</button>
</div>
