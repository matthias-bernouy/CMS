<div part="bar">
    <div part="brand"><slot name="brand"></slot></div>
    <button
        type="button"
        part="toggle"
        data-toggle
        aria-expanded="false"
        aria-controls="basic-navbar-panel"
        aria-label="Open navigation"
    >
        <span part="toggle-icon" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <nav id="basic-navbar-panel" part="panel" aria-label="Primary navigation">
        <div part="links"><slot name="navigation"></slot></div>
        <div part="actions"><slot name="actions"></slot></div>
    </nav>
</div>
