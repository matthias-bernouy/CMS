<basic-card appearance="plain" density="regular" data-card>
    <strong slot="title" data-title>Faire une offre</strong>
    <span slot="description" data-copy>Propose un prix au vendeur. Ton offre doit rester dans la fourchette autorisée.</span>

    <basic-stack gap="md" data-loading>
        <basic-skeleton height="1.5rem" width="45%" animation="wave" label="Chargement des conditions de l’offre"></basic-skeleton>
        <basic-skeleton height="3rem" animation="wave" aria-hidden="true"></basic-skeleton>
        <basic-skeleton height="5rem" animation="wave" aria-hidden="true"></basic-skeleton>
    </basic-stack>

    <basic-stack gap="md" data-content hidden>
        <basic-grid min="sm" max="none" gap="sm">
            <basic-stack gap="xs">
                <small data-current-label>Prix actuel</small>
                <strong data-current-price>—</strong>
            </basic-stack>
            <basic-stack gap="xs">
                <small data-range-label>Proposition autorisée</small>
                <strong data-range>—</strong>
            </basic-stack>
        </basic-grid>

        <form data-form novalidate>
            <basic-stack gap="md">
                <basic-input data-amount name="amount" type="number" step="0.01" required></basic-input>
                <basic-textarea data-message name="message" rows="3" maxlength="2000"></basic-textarea>
                <basic-button data-submit type="submit">Envoyer mon offre</basic-button>
            </basic-stack>
        </form>
    </basic-stack>

    <p data-existing role="status" hidden>Vous avez déjà fait une offre pour cette annonce.</p>

    <p data-unavailable role="status" hidden>Cette annonce n’est pas disponible pour une proposition.</p>
    <div data-toast-region aria-live="polite"></div>
    <template data-toast-template>
        <basic-toast duration="5000"></basic-toast>
    </template>
</basic-card>
