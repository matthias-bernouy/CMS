<style>
    commerce-negotiation-list [data-offer-media] {
        display: grid;
        min-height: 8rem;
        overflow: hidden;
        border-radius: var(--radius-md, .75rem);
        background: var(--bg-muted, color-mix(in srgb, currentColor 7%, transparent));
        color: inherit;
        place-items: center;
    }

    commerce-negotiation-list [data-offer-image] {
        width: 100%;
        height: 9rem;
        object-fit: cover;
    }

    commerce-negotiation-list [data-offer-placeholder] {
        width: min(6rem, 45%);
        color: var(--text-muted, currentColor);
    }

    commerce-negotiation-list [data-offer-title-link] {
        color: inherit;
        text-decoration: none;
    }

    commerce-negotiation-list [data-offer-title-link]:hover {
        text-decoration: underline;
        text-underline-offset: .2em;
    }

    commerce-negotiation-list [data-status] {
        width: fit-content;
        padding: .2rem .55rem;
        border-radius: 999px;
        background: var(--bg-muted, color-mix(in srgb, currentColor 8%, transparent));
        font-size: .875rem;
        font-weight: 700;
    }

    commerce-negotiation-list [data-decision],
    commerce-negotiation-list [data-checkout-expiration] {
        color: var(--text-muted, currentColor);
    }
</style>
<basic-stack gap="lg" data-layout>
    <basic-stack gap="xs" data-header>
        <h2 data-title>Mes offres de prix</h2>
        <p data-copy>Retrouve les propositions reçues et celles que tu as envoyées.</p>
    </basic-stack>

    <basic-stack direction="row" justify-content="space-between" align-items="end" wrap="true" gap="sm" data-toolbar>
        <basic-select data-status-filter accessible-label="Filtrer par statut" value="all">
            <basic-option value="all">Toutes</basic-option>
            <basic-option value="pending">En attente</basic-option>
            <basic-option value="accepted">Acceptées</basic-option>
            <basic-option value="rejected">Refusées</basic-option>
            <basic-option value="withdrawn">Retirées</basic-option>
            <basic-option value="expired">Expirées</basic-option>
            <basic-option value="superseded">Remplacées</basic-option>
            <basic-option value="canceled">Annulées</basic-option>
        </basic-select>
        <basic-chip-group data-role-filter accessible-label="Type d’offres" value="seller">
            <basic-chip value="all" data-all-chip>Toutes</basic-chip>
            <basic-chip value="seller" selected data-received-chip>Offres reçues</basic-chip>
            <basic-chip value="buyer" data-sent-chip>Offres envoyées</basic-chip>
        </basic-chip-group>
    </basic-stack>

    <basic-grid min="md" max="xl" gap="md" data-loading>
        <basic-skeleton height="20rem" animation="wave" label="Chargement des propositions"></basic-skeleton>
        <basic-skeleton height="20rem" animation="wave" aria-hidden="true"></basic-skeleton>
        <basic-skeleton height="20rem" animation="wave" aria-hidden="true"></basic-skeleton>
    </basic-grid>

    <basic-card appearance="outlined" density="regular" data-empty-state hidden>
        <strong slot="title" data-empty-title>Aucune offre reçue pour le moment</strong>
        <span slot="description" data-empty-message>Les propositions envoyées par les acheteurs apparaîtront ici.</span>
    </basic-card>
    <basic-grid min="md" max="xl" gap="md" packing="fit" justify-items="stretch" data-items hidden></basic-grid>
    <basic-pagination data-pagination page="1" page-size="12" total="0" hidden></basic-pagination>
    <div data-toast-region aria-live="polite"></div>
    <template data-toast-template>
        <basic-toast duration="5000"></basic-toast>
    </template>

    <template data-item-template>
        <basic-card appearance="outlined" density="compact" stretch data-proposal-card>
            <a slot="media" data-offer-media>
                <img data-offer-image alt="" loading="lazy" decoding="async" hidden>
                <svg data-offer-placeholder viewBox="0 0 120 90" role="img" aria-label="Aucune photo disponible">
                    <ellipse cx="60" cy="34" rx="22" ry="29" fill="none" stroke="currentColor" stroke-width="6"></ellipse>
                    <path d="M60 62v20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="8"></path>
                    <path d="M44 34h32M60 7v54M49 10v48M71 10v48" fill="none" stroke="currentColor" stroke-width="2"></path>
                </svg>
            </a>
            <a slot="title" data-offer-title-link><span data-offer-title></span></a>
            <span slot="description" data-status></span>
            <basic-stack gap="sm">
                <basic-grid min="xs" max="none" gap="sm">
                    <basic-stack gap="xs" data-proposed-group>
                        <small data-proposed-label>Prix proposé</small>
                        <strong data-proposed-amount></strong>
                    </basic-stack>
                    <basic-stack gap="xs" data-reference-group>
                        <small data-reference-label>Prix initial</small>
                        <span data-reference-amount></span>
                    </basic-stack>
                </basic-grid>
                <small data-direction></small>
                <p data-message hidden></p>
                <small data-expiration hidden></small>
                <small data-decision hidden></small>
                <small data-checkout-expiration hidden></small>
            </basic-stack>
            <basic-button slot="actions" size="sm" appearance="filled" data-action="accept">Accepter</basic-button>
            <basic-button slot="actions" size="sm" appearance="outlined" data-action="reject">Refuser</basic-button>
            <basic-button slot="actions" size="sm" appearance="ghost" data-action="withdraw">Retirer</basic-button>
            <basic-button slot="actions" action="link" size="sm" appearance="filled" data-action-link="checkout">
                Finaliser l’achat
            </basic-button>
            <basic-button slot="actions" action="link" size="sm" appearance="outlined" data-action-link="order">
                Voir ma commande
            </basic-button>
        </basic-card>
    </template>
</basic-stack>
