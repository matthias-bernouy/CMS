<section>
    <div data-loading>
        <basic-skeleton height="16rem" animation="wave" label="Chargement de l’expédition"></basic-skeleton>
    </div>

    <basic-card data-error hidden appearance="outlined" density="spacious">
        <strong slot="title">Expédition indisponible</strong>
        <span slot="description" data-error-message></span>
    </basic-card>

    <basic-card data-content hidden appearance="outlined" density="spacious">
        <strong slot="title" data-title></strong>
        <span slot="description" data-copy></span>
        <div class="summary">
            <div><span>Commande</span><strong data-order-number></strong></div>
            <div><span>Statut</span><strong class="status" data-status></strong></div>
            <div><span>N° d’expédition</span><strong data-expedition></strong></div>
            <p data-latest></p>
        </div>
        <div slot="actions" class="actions">
            <basic-button data-create type="button"></basic-button>
            <basic-button data-handoff type="button" hidden></basic-button>
            <basic-button data-label type="button" appearance="outlined" hidden></basic-button>
            <basic-button data-tracking-link action="link" appearance="ghost" hidden></basic-button>
        </div>
        <p slot="footer" class="message" data-message aria-live="polite"></p>
    </basic-card>
</section>
