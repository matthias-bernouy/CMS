<div class="feedback" part="feedback">
    <div class="prompt" part="prompt">
        <div class="question"><slot name="question"></slot></div>
        <div class="actions">
            <button class="btn yes" type="button" part="yes"><span aria-hidden="true">&#128077;</span> Yes</button>
            <button class="btn no" type="button" part="no"><span aria-hidden="true">&#128078;</span> No</button>
        </div>
    </div>
    <div class="thanks" part="thanks">
        <slot name="thanks"></slot>
    </div>
</div>
