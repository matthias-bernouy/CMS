<cms-consent-field
    source-id="consent"
    context-key="signup"
    appearance="detailed"
    heading="Conditions requises"
    loading-label="Chargement des conditions…"
    load-error-label="Impossible de charger les conditions."
    retry-label="Réessayer"
    required-message="Accepte toutes les conditions pour continuer."
    changed-label="Les conditions n’ont pas pu être validées. Vérifie-les avant de réessayer."
    new-tab-label="(s’ouvre dans un nouvel onglet)"
    cms-source="/.cms/sources/consent/getRequirements?context=signup as consentRequirements"
    cms-reload-on="consent:reload"
>
    <div data-consent-editor-preview aria-label="Aperçu du consentement">
        <fieldset class="consent-field__requirements">
            <legend class="consent-field__legend" data-consent-preview-heading>Conditions requises</legend>
            <label class="consent-field__item">
                <input type="checkbox" disabled checked>
                <span>
                    J’accepte les
                    <a href="#" tabindex="-1">
                        conditions générales
                        <span class="consent-field__new-tab" data-consent-preview-new-tab-label>(s’ouvre dans un nouvel onglet)</span>
                    </a>.
                </span>
            </label>
        </fieldset>
    </div>

    <p class="consent-field__changed" data-consent-changed role="alert" hidden>
        Les conditions n’ont pas pu être validées. Vérifie-les avant de réessayer.
    </p>

    <p class="consent-field__status" data-consent-runtime data-consent-loading cms-condition="$source.loading" role="status">
        Chargement des conditions…
    </p>

    <div class="consent-field__error" data-consent-runtime data-consent-error cms-condition="$source.error" role="alert">
        <span data-consent-error-copy>Impossible de charger les conditions.</span>
        <button data-consent-retry type="button">Réessayer</button>
    </div>

    <fieldset class="consent-field__requirements" data-consent-runtime data-consent-ready cms-condition="$source.loaded">
        <legend class="consent-field__legend" data-consent-heading>Conditions requises</legend>
        <label class="consent-field__item" cms-repeat="consentRequirements.documents as document">
            <input data-consent-version type="checkbox" value="{{ document.versionId }}">
            <span
                data-consent-copy
                data-consent-text="{{ document.consentText }}"
                data-consent-label="{{ document.label }}"
            >
                <span data-consent-prefix>{{ document.consentPrefix }}</span><a href="{{ document.page.path }}" target="_blank" rel="noopener noreferrer"><span>{{ document.label }}</span><span class="consent-field__new-tab" data-consent-new-tab-label>(s’ouvre dans un nouvel onglet)</span></a><span data-consent-suffix>{{ document.consentSuffix }}</span>
            </span>
        </label>
        <p class="consent-field__required" data-consent-required-copy aria-live="polite" hidden>
            Accepte toutes les conditions pour continuer.
        </p>
    </fieldset>
</cms-consent-field>
