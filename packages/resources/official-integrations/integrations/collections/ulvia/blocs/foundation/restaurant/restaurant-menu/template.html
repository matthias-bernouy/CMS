<div part="backdrop" data-menu-close aria-hidden="true"></div>
<section part="panel" role="dialog" aria-modal="true" aria-hidden="true" tabindex="-1">
    <header part="header">
        <div part="brand"><slot name="brand"></slot></div>
        <button part="close" type="button" data-menu-close>
            <slot name="close">Close</slot>
            <span part="close-icon" aria-hidden="true"><i></i><i></i></span>
        </button>
    </header>
    <div part="layout">
        <div part="primary">
            <div part="eyebrow"><slot name="eyebrow"></slot></div>
            <nav part="navigation" aria-label="Menu navigation"><slot name="navigation"></slot></nav>
            <div part="secondary"><slot name="secondary"></slot></div>
        </div>
        <div part="media"><slot name="media"></slot></div>
    </div>
    <footer part="footer">
        <div part="details"><slot name="details"></slot></div>
        <div part="footer-links"><slot name="footer"></slot></div>
    </footer>
</section>
