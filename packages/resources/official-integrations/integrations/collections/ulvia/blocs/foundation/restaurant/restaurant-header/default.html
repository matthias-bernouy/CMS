<restaurant-header layout="utility" position="overlay" width="wide" appearance="transparent" menu-target="restaurant-menu" menu-style="plain" menu-icon="lines">
    <basic-badge slot="status" tone="success" appearance="outlined" size="lg" dot>Open until 11 pm</basic-badge>
    <basic-select slot="locale" name="locale" accessible-label="Language" value="en" presentation="auto">
        <basic-option value="en">🇬🇧 English</basic-option>
        <basic-option value="fr">🇫🇷 Français</basic-option>
    </basic-select>
    <button slot="menu" type="button">Menu</button>
</restaurant-header>
