<aside class="panel" part="panel">
    <header class="head" part="head">
        <button class="toggle" part="toggle" type="button" aria-expanded="true" aria-label="Collapse filters">
            <span class="title-wrap" part="title-wrap">
                <slot name="title"></slot>
            </span>
            <span class="chevron" part="chevron" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </span>
        </button>
        <button class="reset" part="reset" type="button"><slot name="reset">Reset</slot></button>
    </header>
    <div class="body" part="body">
        <slot></slot>
    </div>
</aside>
