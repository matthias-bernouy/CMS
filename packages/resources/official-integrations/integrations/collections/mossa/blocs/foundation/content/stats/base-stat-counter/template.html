<div class="stat" part="stat">
    <div class="value-row" part="value-row">
        <span class="prefix" part="prefix"><slot name="prefix"></slot></span>
        <span class="value-wrap" part="value">
            <span class="value-anim" aria-hidden="true">0</span>
            <span class="value-real"><slot name="value"></slot></span>
        </span>
        <span class="suffix" part="suffix"><slot name="suffix"></slot></span>
    </div>
    <div class="label" part="label"><slot name="label"></slot></div>
    <div class="trend" part="trend">
        <span class="trend-icon" aria-hidden="true"></span>
        <span class="trend-value"><slot name="trend"></slot></span>
        <span class="trend-unit">%</span>
    </div>
</div>
