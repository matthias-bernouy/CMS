<div class="state-host" data-state="default">
    <form class="form" part="form">
        <slot></slot>
    </form>
    <div class="state-slot state-loading"><slot name="loading"></slot></div>
    <div class="state-slot state-error"><slot name="error"></slot></div>
    <div class="state-slot state-success"><slot name="success"></slot></div>
</div>
<p class="message" part="message" aria-live="polite"></p>
