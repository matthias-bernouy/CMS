<article class="chip" part="chip">
    <a class="chip-link" part="link"></a>
    <div class="avatar" part="avatar">
        <slot name="avatar"></slot>
        <span class="initials" part="initials"><slot name="initials"></slot></span>
    </div>
    <div class="body" part="body">
        <div class="name" part="name"><slot name="name"></slot></div>
        <div class="subtitle" part="subtitle"><slot name="subtitle"></slot></div>
    </div>
</article>
