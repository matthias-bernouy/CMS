<base-article-header>
    <span slot="eyebrow">Category</span>
    <span slot="title">Article title</span>
    <p slot="lead">A short lead paragraph that introduces the article and gives context in one or two sentences.</p>
    <base-article-meta slot="meta" align="left" separator="dot" size="md">
    <base-person-chip slot="author" variant="ghost" size="sm" color="auto">
                    <span slot="name">Author Name</span>
                </base-person-chip>
        <span slot="date">Date</span>
        <div slot="badges"></div>
</base-article-meta>
</base-article-header>
