<div class="upload" part="upload">
    <div class="upload-hint" part="hint">
        <slot name="hint"></slot>
    </div>
    <div class="grid" part="grid">
        <label class="card add-card" part="add-card">
            <input type="file" class="native" part="input" />
            <span class="add-icon" part="add-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </span>
            <span class="add-label" part="add-label">
                <slot></slot>
            </span>
        </label>
    </div>
    <div class="counter" part="counter">
        <span class="counter-progress" part="counter-progress"></span>
        <span class="counter-sep" aria-hidden="true"> · </span>
        <span class="counter-cta" part="counter-cta"></span>
    </div>
</div>
<div class="sr-only" aria-hidden="true">
    <slot name="accept"></slot>
</div>
