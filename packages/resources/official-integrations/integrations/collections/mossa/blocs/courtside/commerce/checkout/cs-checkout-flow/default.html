<cs-checkout-flow>
    <basic-button slot="login-action"><a data-login-link href="/login">Se connecter</a></basic-button>
    <basic-button slot="error-action" appearance="outlined"><a href="/annonces">Retour aux annonces</a></basic-button>
    <a slot="order-navigation" data-order-link hidden aria-hidden="true" tabindex="-1"></a>
    <commerce-stripe-payment
        slot="checkout-payment"
        data-checkout-payment
        appearance="embedded"
        title="Paiement sécurisé"
    ></commerce-stripe-payment>
</cs-checkout-flow>
