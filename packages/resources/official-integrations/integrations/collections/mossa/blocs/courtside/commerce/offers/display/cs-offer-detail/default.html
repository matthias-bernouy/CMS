<cs-offer-detail balance="even" ratio="landscape">
    <svg slot="main-media" viewBox="0 0 640 480" role="img" aria-label="Aperçu de la raquette">
        <rect width="640" height="480" fill="#fdf8eb"></rect>
        <ellipse cx="320" cy="185" rx="96" ry="142" fill="none" stroke="#a85424" stroke-width="28"></ellipse>
        <line x1="320" y1="322" x2="320" y2="430" stroke="#1a1108" stroke-width="34" stroke-linecap="round"></line>
    </svg>
    <h2 slot="title">Nom de la raquette</h2>
    <p slot="meta">Année · Manche · Sport</p>
    <base-badge slot="badge">État</base-badge>
    <p slot="description">Décris l’état de la raquette.</p>
    <cs-spec-list slot="specifications">
        <cs-spec-row><span slot="label">Poids</span><span slot="value">300 g</span></cs-spec-row>
    </cs-spec-list>
    <basic-button slot="actions" appearance="filled" style="--cms-button-color: var(--ulvia-primary-foreground); --cms-button-background: var(--ulvia-primary-base); --cms-button-border-color: var(--ulvia-primary-base); --cms-focus-color: var(--ulvia-primary-contrasted);"><button type="button">Proposer un prix</button></basic-button>
</cs-offer-detail>
