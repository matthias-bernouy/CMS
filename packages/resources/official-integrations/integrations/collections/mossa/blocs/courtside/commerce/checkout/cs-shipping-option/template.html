<label class="opt" part="option">
    <span class="icon" part="icon"><slot name="icon"></slot></span>
    <div class="body" part="body">
        <span class="title" part="title"><slot name="title"></slot></span>
        <span class="subtitle" part="subtitle"><slot name="subtitle"></slot></span>
        <span class="note" part="note"><slot name="note"></slot></span>
    </div>
    <span class="price" part="price"><slot name="price"></slot></span>
    <input type="radio" class="radio" part="radio" />
</label>
