<div data-loading>
    <basic-grid min="md" packing="fit" gap="lg">
        <basic-skeleton height="34rem" animation="wave" label="Chargement de l’annonce"></basic-skeleton>
        <basic-skeleton height="34rem" animation="wave" aria-hidden="true"></basic-skeleton>
    </basic-grid>
</div>

<div data-error hidden>
    <basic-card appearance="outlined" density="spacious">
        <strong slot="title" data-error-title>Annonce introuvable</strong>
        <span slot="description" data-error-message>Cette annonce n’est plus disponible ou n’existe pas.</span>
        <slot name="back" slot="actions"></slot>
    </basic-card>
</div>

<div data-content hidden>
    <cs-offer-detail balance="even" ratio="landscape" data-detail>
        <img slot="main-media" data-main-image data-source-image-access="public" alt="" loading="eager" decoding="async">

        <h1 slot="title" data-title></h1>
        <p slot="meta" data-meta></p>
        <cs-condition-badge slot="badge" data-condition></cs-condition-badge>
        <p slot="description" data-description></p>

        <cs-spec-list slot="valuation" data-valuation>
            <cs-spec-row emphasis="price">
                <span slot="label" data-valuation-label>Cote Courtside</span>
                <span slot="value" data-valuation-value></span>
            </cs-spec-row>
        </cs-spec-list>

        <cs-spec-list slot="price">
            <cs-spec-row emphasis="price">
                <span slot="label" data-price-label>Prix vendeur</span>
                <span slot="value" data-price></span>
            </cs-spec-row>
        </cs-spec-list>

        <basic-stack slot="specifications" gap="md">
            <cs-spec-list data-specifications></cs-spec-list>
        </basic-stack>

        <cs-meta-line slot="shipping" data-shipping>
            <svg slot="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"></path>
                <path d="m3 7.5 9 4.5 9-4.5M12 12v9"></path>
            </svg>
            <span data-shipping-message>Livraison disponible en point relais</span>
        </cs-meta-line>

        <slot name="buy" slot="actions"></slot>
        <slot name="negotiate" slot="actions"></slot>
    </cs-offer-detail>

    <basic-stack gap="md" data-trust>
        <basic-grid min="sm" packing="fit" gap="sm">
            <cs-trust-badge>
                <svg slot="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
                Paiement sécurisé
            </cs-trust-badge>
            <cs-trust-badge>
                <svg slot="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 20 6v5c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6z"></path><path d="m9 12 2 2 4-4"></path></svg>
                Protection acheteur
            </cs-trust-badge>
            <cs-trust-badge>
                <svg slot="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v11H3zM14 10h4l3 3v4h-7z"></path><circle cx="7" cy="18" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>
                Livraison suivie
            </cs-trust-badge>
        </basic-grid>
    </basic-stack>

    <basic-toast data-toast role="status" aria-live="polite" position="top-right" duration="5000" hidden></basic-toast>
</div>
