<cs-detail-grid>
    <cs-offer-card slot="left" layout="summary" variant="outlined">
        <base-badge slot="badge">TOP</base-badge>
        <base-badge slot="badge">A</base-badge>
        <span slot="eyebrow">Catégorie</span>
        <span slot="title">Titre de la carte</span>
        <span slot="description">Un court texte pour présenter la carte.</span>
        <span slot="price">175 €</span>
        <basic-button slot="action" appearance="filled" style="--cms-button-color: var(--ulvia-primary-foreground); --cms-button-background: var(--ulvia-primary-base); --cms-button-border-color: var(--ulvia-primary-base); --cms-focus-color: var(--ulvia-primary-contrasted);"><button type="button">Découvrir</button></basic-button>
    </cs-offer-card>
    <cs-offer-card slot="right" layout="summary" variant="outlined">
        <base-badge slot="badge">TOP</base-badge>
        <span slot="eyebrow">Catégorie</span>
        <span slot="title">Titre de la carte</span>
        <span slot="description">Un court texte pour présenter la carte.</span>
        <span slot="price">175 €</span>
    </cs-offer-card>
</cs-detail-grid>
