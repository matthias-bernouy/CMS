<section>
    <div data-loading>
        <basic-stack gap="md">
            <basic-skeleton height="7rem" animation="wave" label="Chargement de la commande"></basic-skeleton>
            <basic-skeleton height="18rem" animation="wave" aria-hidden="true"></basic-skeleton>
            <basic-grid min="md" gap="md">
                <basic-skeleton height="15rem" animation="wave" aria-hidden="true"></basic-skeleton>
                <basic-skeleton height="15rem" animation="wave" aria-hidden="true"></basic-skeleton>
            </basic-grid>
        </basic-stack>
    </div>

    <basic-card data-error hidden appearance="outlined" density="spacious">
        <strong slot="title">Commande introuvable</strong>
        <span slot="description" data-error-message></span>
        <slot name="error-action" slot="actions"></slot>
    </basic-card>

    <div data-content hidden class="content">
        <header class="order-header">
            <div class="order-identity">
                <span class="eyebrow">COMMANDE</span>
                <h1 data-order-number></h1>
                <p data-order-date></p>
            </div>
            <span class="status-badge" data-order-status></span>
        </header>

        <div class="layout">
            <main>
                <basic-card class="tracking-card" appearance="outlined" density="regular" text-color="var(--order-text)" background-color="var(--order-background)" border-color="var(--order-border)">
                    <strong slot="title" data-delivery-title>Suivi de livraison</strong>
                    <span slot="description" data-delivery-description></span>

                    <ol class="progress" aria-label="Étapes de livraison">
                        <li data-progress-step><span class="dot">1</span><span>Confirmée</span></li>
                        <li data-progress-step><span class="dot">2</span><span>Préparée</span></li>
                        <li data-progress-step><span class="dot">3</span><span>Expédiée</span></li>
                        <li data-progress-step><span class="dot">4</span><span>Au point relais</span></li>
                    </ol>

                    <div class="shipment-meta">
                        <div class="estimate">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
                            <span data-delivery-estimate></span>
                        </div>
                        <div class="latest-event" data-latest-event hidden>
                            <strong data-latest-event-label></strong>
                            <span data-latest-event-date></span>
                        </div>
                        <span class="tracking-number" data-tracking-number hidden></span>
                    </div>

                    <slot name="tracking-action" slot="actions"></slot>
                </basic-card>

                <basic-card appearance="outlined" density="compact" text-color="var(--order-text)" background-color="var(--order-background)" border-color="var(--order-border)">
                    <strong slot="title">Article commandé</strong>
                    <div class="line">
                        <img data-image data-source-image-access="public" alt="" hidden>
                        <div class="line-copy">
                            <strong data-line-title></strong>
                            <span data-line-variant></span>
                            <span data-line-condition></span>
                        </div>
                        <strong class="line-price" data-line-price></strong>
                    </div>
                </basic-card>
            </main>

            <aside>
                <basic-card appearance="outlined" density="compact" text-color="var(--order-text)" background-color="var(--order-background)" border-color="var(--order-border)">
                    <strong slot="title">Récapitulatif</strong>
                    <div class="row"><span>Article</span><strong data-subtotal></strong></div>
                    <div class="row"><span>Livraison</span><strong data-shipping></strong></div>
                    <div class="row"><span>Protection acheteur</span><strong data-protection></strong></div>
                    <div class="row total"><span>Total</span><strong data-total></strong></div>
                    <div class="payment-confirmation" data-payment-confirmation></div>
                    <slot name="resume-action"></slot>
                </basic-card>

                <basic-card appearance="outlined" density="compact" text-color="var(--order-text)" background-color="var(--order-background)" border-color="var(--order-border)">
                    <strong slot="title">Point relais choisi</strong>
                    <div class="relay">
                        <span class="provider">Mondial Relay</span>
                        <strong data-relay-name></strong>
                        <span data-relay-address></span>
                        <span class="relay-confirmation" data-relay-confirmation></span>
                    </div>
                </basic-card>
            </aside>
        </div>
    </div>
</section>
