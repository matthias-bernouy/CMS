<section>
    <div data-loading>
        <basic-stack gap="sm">
            <basic-skeleton height="6.5rem" animation="wave" label="Chargement des achats"></basic-skeleton>
            <basic-skeleton height="6.5rem" animation="wave" aria-hidden="true"></basic-skeleton>
            <basic-skeleton height="6.5rem" animation="wave" aria-hidden="true"></basic-skeleton>
        </basic-stack>
    </div>

    <basic-card data-empty hidden appearance="outlined" density="spacious" text-color="var(--purchase-text)" background-color="var(--purchase-background)" border-color="var(--purchase-border)">
        <strong slot="title">Aucun achat pour le moment</strong>
        <span slot="description">Tes commandes apparaîtront ici dès ton premier achat.</span>
        <slot name="empty-action" slot="actions"></slot>
    </basic-card>

    <basic-card data-login hidden appearance="outlined" density="spacious" text-color="var(--purchase-text)" background-color="var(--purchase-background)" border-color="var(--purchase-border)">
        <strong slot="title">Connecte-toi pour voir tes achats</strong>
        <span slot="description">L’historique des commandes est uniquement accessible depuis ton compte.</span>
        <slot name="login-action" slot="actions"></slot>
    </basic-card>

    <basic-card data-error hidden appearance="outlined" density="spacious" text-color="var(--purchase-text)" background-color="var(--purchase-background)" border-color="var(--purchase-border)">
        <strong slot="title">Impossible de charger tes achats</strong>
        <span slot="description" data-error-message></span>
    </basic-card>

    <div data-content hidden>
        <div class="orders" data-list></div>
        <nav class="pagination" data-pagination aria-label="Pagination des achats">
            <basic-button appearance="outlined" style="--cms-button-color: var(--purchase-button-background); --cms-button-background: transparent; --cms-button-border-color: var(--purchase-button-border); --cms-focus-color: var(--purchase-accent);"><button data-previous type="button">Précédent</button></basic-button>
            <span data-page-label aria-live="polite"></span>
            <basic-button appearance="outlined" style="--cms-button-color: var(--purchase-button-background); --cms-button-background: transparent; --cms-button-border-color: var(--purchase-button-border); --cms-focus-color: var(--purchase-accent);"><button data-next type="button">Suivant</button></basic-button>
        </nav>
    </div>
</section>
