<mossa-offer-details balance="even" ratio="landscape">
    <svg slot="main-media" viewBox="0 0 640 480" role="img" aria-label="Product preview">
        <rect width="640" height="480" fill="var(--ulvia-subtle-background)"></rect>
        <ellipse cx="320" cy="185" rx="96" ry="142" fill="none" stroke="var(--ulvia-primary-base)" stroke-width="28"></ellipse>
        <line x1="320" y1="322" x2="320" y2="430" stroke="var(--ulvia-surface-text)" stroke-width="34" stroke-linecap="round"></line>
    </svg>
    <h2 slot="title">Product name</h2>
    <p slot="meta">Year · Variant · Category</p>
    <mossa-badge slot="badge">Condition</mossa-badge>
    <p slot="description">Describe the product condition.</p>
    <mossa-specifications slot="specifications">
        <mossa-specification><span slot="label">Weight</span><span slot="value">300 g</span></mossa-specification>
    </mossa-specifications>
    <mossa-button slot="actions" appearance="filled"><button type="button">Propose a price</button></mossa-button>
</mossa-offer-details>
