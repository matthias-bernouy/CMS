<mossa-commerce-negotiation-list-controller data-p9r-composition-controller>
<style>
    mossa-commerce-negotiation-list-controller [data-offer-media] {
        display: grid;
        min-height: 8rem;
        overflow: hidden;
        border-radius: var(--ulvia-radius-card);
        background: var(--ulvia-subtle-background);
        color: inherit;
        place-items: center;
    }

    mossa-commerce-negotiation-list-controller [data-offer-image] {
        width: 100%;
        height: 9rem;
        object-fit: cover;
    }

    mossa-commerce-negotiation-list-controller [data-offer-placeholder] {
        width: min(6rem, 45%);
        color: var(--ulvia-surface-muted-text);
    }

    mossa-commerce-negotiation-list-controller [data-offer-title-link] {
        color: inherit;
        text-decoration: none;
    }

    mossa-commerce-negotiation-list-controller [data-offer-title-link]:hover {
        text-decoration: underline;
        text-underline-offset: .2em;
    }

    mossa-commerce-negotiation-list-controller [data-status] {
        width: fit-content;
        padding: .2rem .55rem;
        border-radius: 999px;
        background: var(--ulvia-subtle-background);
        font-size: .875rem;
        font-weight: 700;
    }

    mossa-commerce-negotiation-list-controller [data-decision],
    mossa-commerce-negotiation-list-controller [data-checkout-expiration] {
        color: var(--ulvia-surface-muted-text);
    }
</style>
<mossa-stack gap="lg" data-layout>
    <mossa-stack gap="xs" data-header>
        <h2 data-title>My proposals</h2>
        <p data-copy>Review received and sent proposals.</p>
    </mossa-stack>

    <mossa-stack direction="row" justify-content="space-between" align-items="end" wrap="true" gap="sm" data-toolbar>
        <mossa-select data-status-filter accessible-label="Filter by status" value="all">
            <mossa-option value="all">All</mossa-option>
            <mossa-option value="pending">Pending</mossa-option>
            <mossa-option value="accepted">Accepted</mossa-option>
            <mossa-option value="rejected">Rejected</mossa-option>
            <mossa-option value="withdrawn">Withdrawn</mossa-option>
            <mossa-option value="expired">Expired</mossa-option>
            <mossa-option value="superseded">Superseded</mossa-option>
            <mossa-option value="canceled">Cancelled</mossa-option>
        </mossa-select>
        <mossa-chip-group data-role-filter accessible-label="Proposal type" value="seller">
            <mossa-chip value="all" data-all-chip>All</mossa-chip>
            <mossa-chip value="seller" selected data-received-chip>Received proposals</mossa-chip>
            <mossa-chip value="buyer" data-sent-chip>Sent proposals</mossa-chip>
        </mossa-chip-group>
    </mossa-stack>

    <mossa-responsive-grid min="md" max="xl" gap="md" data-loading>
        <mossa-skeleton height="20rem" animation="wave" label="Loading proposals"></mossa-skeleton>
        <mossa-skeleton height="20rem" animation="wave" aria-hidden="true"></mossa-skeleton>
        <mossa-skeleton height="20rem" animation="wave" aria-hidden="true"></mossa-skeleton>
    </mossa-responsive-grid>

    <mossa-surface-card appearance="outlined" density="regular" data-empty-state hidden>
        <strong slot="title" data-empty-title>No received proposals yet</strong>
        <span slot="description" data-empty-message>Buyer proposals will appear here.</span>
    </mossa-surface-card>
    <mossa-responsive-grid min="md" max="xl" gap="md" packing="fit" justify-items="stretch" data-items hidden></mossa-responsive-grid>
    <mossa-pagination data-pagination page="1" page-size="12" total="0" hidden></mossa-pagination>
    <div data-toast-region aria-live="polite"></div>
    <template data-toast-template>
        <mossa-toast duration="5000"></mossa-toast>
    </template>

    <template data-item-template>
        <mossa-surface-card appearance="outlined" density="compact" stretch data-proposal-card>
            <a slot="media" data-offer-media>
                <img data-offer-image alt="" loading="lazy" decoding="async" hidden>
                <svg data-offer-placeholder viewBox="0 0 120 90" role="img" aria-label="No photo available">
                    <ellipse cx="60" cy="34" rx="22" ry="29" fill="none" stroke="currentColor" stroke-width="6"></ellipse>
                    <path d="M60 62v20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="8"></path>
                    <path d="M44 34h32M60 7v54M49 10v48M71 10v48" fill="none" stroke="currentColor" stroke-width="2"></path>
                </svg>
            </a>
            <a slot="title" data-offer-title-link><span data-offer-title></span></a>
            <span slot="description" data-status></span>
            <mossa-stack gap="sm">
                <mossa-responsive-grid min="xs" max="none" gap="sm">
                    <mossa-stack gap="xs" data-proposed-group>
                        <small data-proposed-label>Proposed price</small>
                        <strong data-proposed-amount></strong>
                    </mossa-stack>
                    <mossa-stack gap="xs" data-reference-group>
                        <small data-reference-label>Initial price</small>
                        <span data-reference-amount></span>
                    </mossa-stack>
                </mossa-responsive-grid>
                <small data-direction></small>
                <p data-message hidden></p>
                <small data-expiration hidden></small>
                <small data-decision hidden></small>
                <small data-checkout-expiration hidden></small>
            </mossa-stack>
            <mossa-button slot="actions" size="sm" appearance="filled">
                <button type="button" data-action="accept">Accept</button>
            </mossa-button>
            <mossa-button slot="actions" size="sm" appearance="outlined">
                <button type="button" data-action="reject">Reject</button>
            </mossa-button>
            <mossa-button slot="actions" size="sm" appearance="ghost">
                <button type="button" data-action="withdraw">Withdraw</button>
            </mossa-button>
            <mossa-button slot="actions" size="sm" appearance="filled">
                <a data-action-link="checkout">Complete purchase</a>
            </mossa-button>
            <mossa-button slot="actions" size="sm" appearance="outlined">
                <a data-action-link="order">View my order</a>
            </mossa-button>
        </mossa-surface-card>
    </template>
</mossa-stack>
</mossa-commerce-negotiation-list-controller>
