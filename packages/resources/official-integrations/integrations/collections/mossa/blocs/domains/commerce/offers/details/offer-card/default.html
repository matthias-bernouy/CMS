<mossa-offer-card layout="listing" variant="outlined" interactive>
    <a slot="navigation" href="#" aria-label="View offer"></a>
    <svg slot="media" viewBox="0 0 640 480" role="img" aria-label="Product preview">
        <rect width="640" height="480" fill="var(--ulvia-subtle-background)"></rect>
        <ellipse cx="320" cy="185" rx="96" ry="142" fill="none" stroke="var(--ulvia-primary-base)" stroke-width="28"></ellipse>
        <line x1="320" y1="322" x2="320" y2="430" stroke="var(--ulvia-surface-text)" stroke-width="34" stroke-linecap="round"></line>
    </svg>
    <mossa-badge slot="badge" tone="success" variant="filled">Condition</mossa-badge>
    <span slot="eyebrow">Brand · Year · Location</span>
    <span slot="title">Product name</span>
    <span slot="description">Category · Variant · Condition</span>
    <span slot="price">189 USD</span>
    <mossa-button slot="action" appearance="filled"><a href="#">View offer</a></mossa-button>
</mossa-offer-card>
