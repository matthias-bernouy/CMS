<mossa-valuation-controller data-p9r-composition-controller>
    <mossa-stack gap="xl">
        <mossa-section-header>
            <slot name="heading-eyebrow" slot="eyebrow"></slot>
            <slot name="heading-title" slot="title"></slot>
            <slot name="heading-subtitle" slot="subtitle"></slot>
        </mossa-section-header>

        <mossa-panel>
            <slot name="choose-model-label" slot="title"></slot>
            <mossa-stack gap="sm">
                <mossa-search-input cms-page-state="mossaValuationQuery" size="lg">
                    <slot name="search-accessible-label" slot="accessible-label"></slot>
                    <slot name="search-placeholder" slot="placeholder"></slot>
                    <slot name="clear-search-label" slot="clear-label"></slot>
                </mossa-search-input>
                <input cms-page-state="mossaValuationProduct" type="hidden">

                <section
                    cms-source-id="products"
                    cms-source="/.cms/sources/commerce/products?q=@{mossaValuationQuery}&amp;limit=20"
                >
                    <mossa-skeleton height="4rem" animation="wave" label="Searching the catalogue" cms-condition="$source.loading"></mossa-skeleton>
                    <p role="alert" cms-condition="$source.error"><slot name="unavailable-message"></slot></p>
                    <p role="status" cms-condition="$source.empty"><slot name="no-model-message"></slot></p>
                    <p role="status" cms-condition="$source.loaded &amp;&amp; total == 1">{{ total }} <slot name="model-count-one-message"></slot></p>
                    <p role="status" cms-condition="$source.loaded &amp;&amp; total &gt; 1">{{ total }} <slot name="model-count-many-message"></slot></p>

                    <mossa-stack gap="xs" role="listbox" cms-condition="$source.loaded &amp;&amp; total &gt; 0">
                        <mossa-button appearance="ghost" width="full" cms-repeat="items as product">
                            <button type="button" role="option" value="{{ product.id }}">
                                <strong>{{ product.title }}</strong>
                                <small>{{ product.description }}</small>
                            </button>
                        </mossa-button>
                    </mossa-stack>

                    <section cms-condition="selectedProduct" aria-labelledby="valuation-title">
                        <mossa-stack gap="lg">
                            <mossa-section-header size="sm">
                                <slot name="result-eyebrow" slot="eyebrow"></slot>
                                <h2 slot="title" id="valuation-title">{{ selectedProduct.title }}</h2>
                                <p slot="subtitle">{{ selectedProduct.description }}</p>
                            </mossa-section-header>
                            <mossa-surface-card appearance="outlined" density="spacious">
                                <span slot="title"><slot name="reference-range-label"></slot></span>
                                <strong cms-condition="selectedProduct.hasValuation">
                                    {{ selectedProduct.minimumMinor | minorCurrency(selectedProduct.currency) }} –
                                    {{ selectedProduct.maximumMinor | minorCurrency(selectedProduct.currency) }}
                                </strong>
                                <strong cms-condition="!selectedProduct.hasValuation"><slot name="range-pending-label"></slot></strong>
                                <p cms-condition="selectedProduct.hasValuation"><slot name="range-description"></slot></p>
                                <p cms-condition="!selectedProduct.hasValuation"><slot name="range-pending-description"></slot></p>
                            </mossa-surface-card>
                            <mossa-info-row>
                                <span slot="icon" aria-hidden="true">i</span>
                                <slot name="model-reference-label" slot="label"></slot>
                                <slot name="model-reference-description"></slot>
                            </mossa-info-row>
                        </mossa-stack>
                    </section>

                    <mossa-empty-state variant="card" cms-condition="$source.loaded &amp;&amp; !selectedProduct">
                        <span slot="icon" aria-hidden="true">⌕</span>
                        <slot name="initial-title" slot="title"></slot>
                        <slot name="initial-description" slot="description"></slot>
                    </mossa-empty-state>
                </section>
            </mossa-stack>
        </mossa-panel>
    </mossa-stack>
</mossa-valuation-controller>
