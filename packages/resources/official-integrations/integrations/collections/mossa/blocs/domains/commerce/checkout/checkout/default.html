<mossa-checkout>
    <input cms-param-sync="agreementId" type="hidden">
    <input cms-param-sync="offerId" type="hidden">
    <input cms-param-sync="orderId" type="hidden">
    <mossa-button slot="login-action"><a>Sign in</a></mossa-button>
    <mossa-button slot="error-action" appearance="outlined"><a href="#">Back to offers</a></mossa-button>
    <a slot="order-navigation" hidden aria-hidden="true" tabindex="-1"></a>
    <mossa-commerce-stripe-payment
        slot="checkout-payment"
        appearance="embedded"
        title="Secure payment"
    >
        <input cms-param-sync="payment_intent" type="hidden">
        <input cms-param-sync="payment_intent_client_secret" type="hidden">
        <input cms-param-sync="redirect_status" type="hidden">
        <form hidden cms-source-id="payment-legal" cms-source="/.cms/sources/system-functions/getPaymentLegalRequirements" cms-source-trigger="submit" cms-source-method="GET" cms-source-inherit-query="false" cms-source-success-reset="false"></form>
        <form hidden cms-source-id="payment-create" cms-source="/.cms/sources/system-functions/createPaymentForOrder" cms-source-trigger="submit" cms-source-method="POST" cms-source-inherit-query="false" cms-source-success-reset="false" cms-source-serialization="typed-json"></form>
        <form hidden cms-source-id="payment-config" cms-source="/.cms/sources/system-functions/getStripePaymentClientConfig" cms-source-trigger="submit" cms-source-method="GET" cms-source-inherit-query="false" cms-source-success-reset="false"></form>
        <form hidden cms-source-id="payment-refresh" cms-source="/.cms/sources/system-functions/refreshPaymentForOrder" cms-source-trigger="submit" cms-source-method="POST" cms-source-inherit-query="false" cms-source-success-reset="false" cms-source-serialization="typed-json"></form>
    </mossa-commerce-stripe-payment>
    <form hidden cms-source-id="checkout-account" cms-source="/.cms/sources/user-account/getAccount" cms-source-trigger="submit" cms-source-method="GET" cms-source-inherit-query="false" cms-source-success-reset="false"></form>
    <form hidden cms-source-id="checkout-identity" cms-source="/.cms/sources/system-auth/me" cms-source-trigger="submit" cms-source-method="GET" cms-source-inherit-query="false" cms-source-success-reset="false"></form>
    <form hidden cms-source-id="checkout-account-update" cms-source="/.cms/sources/user-account/updateAccount" cms-source-trigger="submit" cms-source-method="POST" cms-source-inherit-query="false" cms-source-success-reset="false" cms-source-serialization="typed-json"></form>
    <form hidden cms-source-id="checkout-agreement" cms-source="/.cms/sources/commerce/getMyPriceAgreementCheckout" cms-source-trigger="submit" cms-source-method="GET" cms-source-inherit-query="false" cms-source-success-reset="false"></form>
    <form hidden cms-source-id="checkout-offer" cms-source="/.cms/sources/commerce/offer" cms-source-trigger="submit" cms-source-method="GET" cms-source-inherit-query="false" cms-source-success-reset="false"></form>
    <form hidden cms-source-id="checkout-order" cms-source="/.cms/sources/commerce/myOrder" cms-source-trigger="submit" cms-source-method="GET" cms-source-inherit-query="false" cms-source-success-reset="false"></form>
    <form hidden cms-source-id="checkout-order-fields" cms-source="/.cms/sources/commerce/entityCustomFields" cms-source-trigger="submit" cms-source-method="GET" cms-source-inherit-query="false" cms-source-success-reset="false"></form>
    <form hidden cms-source-id="checkout-order-create" cms-source="/.cms/sources/system-functions/createProtectedOrder" cms-source-trigger="submit" cms-source-method="POST" cms-source-inherit-query="false" cms-source-success-reset="false" cms-source-serialization="typed-json"></form>
    <form hidden cms-source-id="checkout-relay-save" cms-source="/.cms/sources/system-functions/setRelayPointForOrder" cms-source-trigger="submit" cms-source-method="POST" cms-source-inherit-query="false" cms-source-success-reset="false" cms-source-serialization="typed-json"></form>
    <form hidden cms-source-id="relay-search" cms-source="/.cms/sources/delivery/relayPoints" cms-source-trigger="submit" cms-source-method="GET" cms-source-inherit-query="false" cms-source-success-reset="false"></form>
    <form hidden cms-source-id="relay-restore" cms-source="/.cms/sources/system-functions/getRelayPointForOrder" cms-source-trigger="submit" cms-source-method="GET" cms-source-inherit-query="false" cms-source-success-reset="false"></form>
    <form hidden cms-source-id="relay-save" cms-source="/.cms/sources/system-functions/setRelayPointForOrder" cms-source-trigger="submit" cms-source-method="POST" cms-source-inherit-query="false" cms-source-success-reset="false" cms-source-serialization="typed-json"></form>
</mossa-checkout>
