<mossa-commerce-account-offers-controller data-p9r-composition-controller>
    <input name="commerceOfferOffset" cms-param-sync="commerceOfferOffset" type="hidden">
    <mossa-stack gap="lg">
        <mossa-stack direction="row" justify-content="space-between" align-items="end" wrap="true" gap="sm">
            <slot name="status-filter"></slot>
            <slot name="create-action"></slot>
        </mossa-stack>

        <section
            cms-source-id="offers"
            cms-source="/.cms/sources/commerce/listMyOffers?status=#{commerceOfferStatus}&amp;limit=12&amp;offset=#{commerceOfferOffset}"
        >
            <mossa-responsive-grid min="md" max="xl" gap="md" cms-condition="$source.loading">
                <mossa-skeleton height="20rem" animation="wave" label="Loading your offers"></mossa-skeleton>
                <mossa-skeleton height="20rem" animation="wave" aria-hidden="true"></mossa-skeleton>
                <mossa-skeleton height="20rem" animation="wave" aria-hidden="true"></mossa-skeleton>
            </mossa-responsive-grid>

            <mossa-toast tone="danger" appearance="filled" role="alert" aria-live="assertive" aria-atomic="true" position="top-right" duration="6000" cms-condition="$source.error">{{ presentation.errorMessage }}</mossa-toast>

            <mossa-stack gap="lg" cms-condition="$source.loaded">
                <mossa-surface-card appearance="outlined" density="regular" cms-condition="presentation.total == 0">
                    <strong slot="title">{{ presentation.emptyTitle }}</strong>
                    <span slot="description">{{ presentation.emptyMessage }}</span>
                </mossa-surface-card>

                <mossa-responsive-grid
                    min="{{ presentation.gridMin }}"
                    max="{{ presentation.gridMax }}"
                    gap="{{ presentation.gridGap }}"
                    packing="{{ presentation.gridPacking }}"
                    cms-condition="presentation.total &gt; 0"
                >
                    <mossa-commerce-offer-preview appearance="outlined" density="compact" layout="{{ presentation.cardLayout }}" stretch cms-repeat="presentation.items as offer">
                        <img
                            slot="media"
                            data-cms-src="{{ offer.imageUrl }}"
                            data-source-width="{{ offer.mainImageWidth }}"
                            data-source-height="{{ offer.mainImageHeight }}"
                            alt="{{ offer.title }}"
                            loading="lazy"
                            decoding="async"
                            cms-condition="presentation.showImage &amp;&amp; offer.imageUrl"
                        >
                        <mossa-badge slot="badge" tone="{{ offer.statusTone }}" variant="soft" cms-condition="presentation.showStatus">{{ offer.statusLabel }}</mossa-badge>
                        <strong slot="title">{{ offer.title }}</strong>
                        <small slot="metadata" cms-condition="presentation.showUpdatedAt &amp;&amp; offer.updatedLabel">{{ offer.updatedLabel }}</small>
                        <strong slot="price" cms-condition="presentation.showPrice &amp;&amp; offer.hasPrice">{{ offer.sellerDisplayPriceAmount | minorCurrency(offer.currency) }}</strong>
                        <strong slot="price" cms-condition="presentation.showPrice &amp;&amp; offer.showPendingPrice">{{ offer.pendingPriceLabel }}</strong>
                        <mossa-button slot="action" appearance="outlined" tone="neutral" size="sm" cms-condition="offer.actionUrl">
                            <a href="{{ offer.actionUrl }}">{{ offer.actionLabel }}</a>
                        </mossa-button>
                    </mossa-commerce-offer-preview>
                </mossa-responsive-grid>

                <mossa-pagination
                    page="{{ presentation.page }}"
                    page-size="12"
                    total="{{ presentation.total }}"
                    cms-condition="presentation.total &gt; 12"
                ></mossa-pagination>
            </mossa-stack>
        </section>
    </mossa-stack>
</mossa-commerce-account-offers-controller>
