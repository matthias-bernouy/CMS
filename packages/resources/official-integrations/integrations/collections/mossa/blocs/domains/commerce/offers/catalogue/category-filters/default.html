<mossa-category-filters>
    <input name="mossaCategoryValue" cms-param-sync="category" type="hidden">
    <mossa-button slot="selector" width="full"><button name="mossaCategory" value="category-a" type="button">Category A</button></mossa-button>
    <mossa-button slot="selector" width="full"><button name="mossaCategory" value="category-b" type="button">Category B</button></mossa-button>
    <mossa-stack slot="common" gap="md">
        <mossa-range-filter cms-param-sync="priceMax" mode="max" min="0" max="200" step="25" value-min="0" value-max="200" label="Maximum price" unit=" USD"></mossa-range-filter>
    </mossa-stack>
    <mossa-stack slot="first-category" gap="md"></mossa-stack>
    <mossa-stack slot="second-category" gap="md"></mossa-stack>
</mossa-category-filters>
