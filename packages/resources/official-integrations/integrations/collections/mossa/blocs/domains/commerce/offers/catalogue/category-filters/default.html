<mossa-category-filters>
    <mossa-button slot="selector" data-category-value="category-a" width="full"><button type="button">Category A</button></mossa-button>
    <mossa-button slot="selector" data-category-value="category-b" width="full"><button type="button">Category B</button></mossa-button>
    <mossa-stack slot="common" gap="md">
        <mossa-range-filter data-price-filter data-filter-reset mode="max" min="0" max="200" step="25" value-min="0" value-max="200" label="Maximum price" unit=" USD"></mossa-range-filter>
    </mossa-stack>
    <mossa-stack slot="first-category" gap="md"></mossa-stack>
    <mossa-stack slot="second-category" gap="md"></mossa-stack>
</mossa-category-filters>
