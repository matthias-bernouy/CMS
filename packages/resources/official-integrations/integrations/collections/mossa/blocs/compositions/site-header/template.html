<base-horizontal-navbar
    navbar-breakpoint="848px"
    cms-source="/.cms/sources/system-auth/me as auth"
>
    <a slot="brand" href="/" aria-label="Accueil Courtside">
        <cs-logo aria-hidden="true"></cs-logo>
    </a>

    <a slot="navigation" href="/annonces">Annonces</a>
    <a slot="navigation" href="/comment-ca-marche">Comment ça marche</a>

    <basic-button slot="actions" align="center" style="--cms-button-color: var(--ulvia-primary-foreground); --cms-button-background: var(--ulvia-primary-base); --cms-button-border-color: var(--ulvia-primary-base); --cms-focus-color: var(--ulvia-primary-base);"><a href="/vendre">Vendre ma raquette</a></basic-button>
    <basic-button slot="actions" appearance="ghost" align="center" cms-condition="!auth.subject" style="--cms-button-color: var(--ulvia-primary-contrasted); --cms-focus-color: var(--ulvia-primary-contrasted);"><a href="/login">Se connecter</a></basic-button>
    <base-user-menu slot="actions" has-role="" cms-condition="auth.subject">
        <span slot="initials" aria-hidden="true">CS</span>
        <span slot="name">Mon compte</span>
        <span slot="caption">Courtside</span>
        <span slot="display-name">Mon compte</span>
        <base-badge slot="role" variant="filled" color="secondary" size="md" shape="pill">Joueur</base-badge>
        <base-menu-item slot="items">
            <a href="/mon-espace/profil"><cs-account-icon name="profile"></cs-account-icon>Mon profil</a>
        </base-menu-item>
        <base-menu-item slot="items">
            <a href="/mon-espace/portefeuille"><cs-account-icon name="wallet"></cs-account-icon>Compte vendeur</a>
        </base-menu-item>
        <base-menu-item slot="items">
            <a href="/mon-espace/mes-achats"><cs-account-icon name="purchases"></cs-account-icon>Mes achats</a>
        </base-menu-item>
        <base-menu-item slot="items">
            <a href="/mon-espace/mes-ventes"><cs-account-icon name="sales"></cs-account-icon>Mes ventes</a>
        </base-menu-item>
        <base-menu-item slot="items">
            <a href="/mon-espace/mes-annonces"><cs-account-icon name="listings"></cs-account-icon>Mes annonces</a>
        </base-menu-item>
        <base-menu-item slot="items">
            <a href="/mon-espace/mes-offres"><cs-account-icon name="offers"></cs-account-icon>Mes offres</a>
        </base-menu-item>
        <form
            slot="logout"
            cms-source="/.cms/sources/system-auth/logout as headerLogout"
            cms-source-trigger="submit"
            cms-source-method="POST"
            cms-source-success-redirect="/login"
        >
            <basic-button appearance="ghost" size="sm" width="full" align="left" style="--cms-button-color: var(--ulvia-danger-base); --cms-focus-color: var(--ulvia-danger-base);"><button type="submit">
                <cs-account-icon slot="icon-left" name="logout"></cs-account-icon>
                Se déconnecter
            </button></basic-button>
        </form>
    </base-user-menu>
</base-horizontal-navbar>
