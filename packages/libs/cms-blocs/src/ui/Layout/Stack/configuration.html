<p9r-attr-sync>
    <p9r-section data-title="Content zone">
        <p9r-select name="size" label="Width">
            <option selected value="full">Full width</option>
            <option value="sm">Small (640px)</option>
            <option value="md">Medium (768px)</option>
            <option value="lg">Large (1024px)</option>
            <option value="xl">XL (1280px)</option>
        </p9r-select>
        <p9r-segmented-switch name="align-self" label="Align self" value="start">
            <option selected value="start">Start</option>
            <option value="center">Center</option>
            <option value="end">End</option>
        </p9r-segmented-switch>
    </p9r-section>
    <p9r-section data-title="Layout">
        <p9r-segmented-switch name="direction" label="Direction" value="column">
            <option selected value="column">Column</option>
            <option value="row">Row</option>
        </p9r-segmented-switch>
        <p9r-sizes-select name="gap" label="Gap"></p9r-sizes-select>
        <p9r-segmented-switch name="wrap" label="Wrap">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
    </p9r-section>
    <p9r-section data-title="Alignment" data-collapsed>
        <p9r-select name="align-items" label="Align items (cross-axis)">
            <option value="start">Start</option>
            <option value="center">Center</option>
            <option value="end">End</option>
            <option selected value="stretch">Stretch</option>
        </p9r-select>
        <p9r-select name="justify" label="Justify (main-axis)">
            <option selected value="start">Start</option>
            <option value="center">Center</option>
            <option value="end">End</option>
            <option value="between">Space between</option>
            <option value="around">Space around</option>
            <option value="evenly">Space evenly</option>
        </p9r-select>
        <p9r-segmented-switch name="divider" label="Divider">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Items">
    <p9r-comp-sync allow-multiple>
        <base-card></base-card>
    </p9r-comp-sync>
</p9r-section>
