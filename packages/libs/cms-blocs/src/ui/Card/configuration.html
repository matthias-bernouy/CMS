<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="variant" label="Variant">
            <option selected value="default">Default</option>
            <option value="outlined">Outlined</option>
            <option value="elevated">Elevated</option>
            <option value="filled">Filled</option>
        </p9r-select>
        <p9r-select name="padding" label="Padding">
            <option value="none">None</option>
            <option value="sm">Small</option>
            <option selected value="md">Medium</option>
            <option value="lg">Large</option>
        </p9r-select>
        <p9r-segmented-switch name="interactive" label="Interactive">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Header" data-collapsed>
    <p9r-comp-sync optionnal>
        <span slot="header">Header</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Body">
    <p9r-comp-sync allow-multiple optionnal>
        <p>Card content…</p>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Footer" data-collapsed>
    <p9r-comp-sync optionnal>
        <span slot="footer">Footer</span>
    </p9r-comp-sync>
</p9r-section>
