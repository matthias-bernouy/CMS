<p9r-stack gap="m" style="padding: 1.5rem 2rem;">

    <p9r-stack direction="row" justify="space-between" align="center">
        <h1>Buckets</h1>
        <p9r-open-modal modal-target="create-bucket-modal">
            <p9r-button color="primary">+ New bucket</p9r-button>
        </p9r-open-modal>
    </p9r-stack>

    <p9r-table>
        <p9r-row slot="header">
            <p9r-header-cell>id</p9r-header-cell>
            <p9r-header-cell>cacheControl</p9r-header-cell>
            <p9r-header-cell>maxFileSize</p9r-header-cell>
            <p9r-header-cell>maxTotalSize</p9r-header-cell>
            <p9r-header-cell>maxFileCount</p9r-header-cell>
            <p9r-header-cell>MIME</p9r-header-cell>
            <p9r-header-cell></p9r-header-cell>
        </p9r-row>

        <w13c-fetch url="{{BASE_PATH}}/api/buckets/list" reload-on="bucket:created bucket:deleted">
            <template for="data">
                <p9r-row>
                    <p9r-cell><code>{{ id }}</code></p9r-cell>
                    <p9r-cell><code>{{ cacheControl }}</code></p9r-cell>
                    <p9r-cell>{{ limits.maxFileSize }}</p9r-cell>
                    <p9r-cell>{{ quotas.maxTotalSize }}</p9r-cell>
                    <p9r-cell>{{ quotas.maxFileCount }}</p9r-cell>
                    <p9r-cell><code>{{ limits.acceptedMimeTypes }}</code></p9r-cell>
                    <p9r-cell>
                        <p9r-stack direction="row" gap="s">
                            <a href="{{BASE_PATH}}/bucket-detail?bucketId={{id}}"><p9r-button variant="ghost">View</p9r-button></a>
                            <w13c-form target="{{BASE_PATH}}/api/buckets?bucketId={{id}}" method="DELETE" emit="bucket:deleted">
                                <p9r-button variant="ghost" color="danger" type="submit">Delete</p9r-button>
                            </w13c-form>
                        </p9r-stack>
                    </p9r-cell>
                </p9r-row>
            </template>
            <template slot="empty">
                <p9r-row>
                    <p9r-cell colspan="7"><em>No buckets yet.</em></p9r-cell>
                </p9r-row>
            </template>
            <template slot="error">
                <p9r-row>
                    <p9r-cell colspan="7">
                        <p9r-alert type="error">Failed to load buckets.</p9r-alert>
                    </p9r-cell>
                </p9r-row>
            </template>
        </w13c-fetch>
    </p9r-table>
</p9r-stack>

<p9r-modal id="create-bucket-modal" aria-label="Create bucket">
    <span slot="title">New bucket</span>
    <w13c-form target="{{BASE_PATH}}/api/buckets" emit="bucket:created">
        <p9r-stack gap="m">
            <p9r-input name="id" label="id" placeholder="my-bucket" required></p9r-input>
            <p9r-input name="cacheControl" label="cacheControl" value="public, max-age=31536000, immutable" required></p9r-input>
            <p9r-input name="maxTotalSize" type="number" label="maxTotalSize (bytes)" value="10737418240" required></p9r-input>
            <p9r-input name="maxFileCount" type="number" label="maxFileCount" value="10000" required></p9r-input>
            <p9r-input name="maxFileSize" type="number" label="maxFileSize (bytes)" value="104857600" required></p9r-input>
            <p9r-input name="acceptedMimeTypes" label="acceptedMimeTypes (comma-separated, or *)" value="*"></p9r-input>
            <p9r-input name="allowedUploadOrigins" label="allowedUploadOrigins (comma-separated browser origins, or *)" placeholder="https://app.example.com"></p9r-input>
            <p9r-button color="primary" type="submit" fullWidth>Create</p9r-button>
        </p9r-stack>
    </w13c-form>
</p9r-modal>
