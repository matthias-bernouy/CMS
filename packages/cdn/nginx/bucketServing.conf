# Common body for any server block that serves files of a bucket (the wildcard
# *.cdn.bernouy.com server and every generated alias server). Relies on these
# maps defined in nginx.conf:
#   $bucket_id        — host → bucketId
#   $cache_control    — bucketId → Cache-Control header value
#   $bucket_notfound  — bucketId → 404 fallback file path within the bucket

# Unknown host (nothing in the map) → drop the connection without leaking info.
if ($bucket_id = "") { return 444; }

root /var/storage/buckets/$bucket_id;

location / {
    add_header Cache-Control                $cache_control always;
    add_header Access-Control-Allow-Origin  "*"            always;
    error_page 404 = @bucket_notfound;
    try_files  $uri $uri.html $uri/index.html =404;
}

# Internal-only fallback that serves the bucket's configured 404 page when
# set, or returns plain 404 when not. The empty-default trick: if the map
# has no entry, `$bucket_notfound` is empty and `try_files` falls through
# to `=404` cleanly.
location @bucket_notfound {
    internal;
    try_files /$bucket_notfound =404;
}
