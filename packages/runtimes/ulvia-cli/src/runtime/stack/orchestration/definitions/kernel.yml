services:
    kernel:
        image: ${KERNEL_IMAGE}
        restart: unless-stopped
        init: true
        user: "${ULVIA_UID}:${ULVIA_GID}"
        environment:
            MODE: PROD
            NODE_ENV: production
            KERNEL_HOST: 0.0.0.0
            KERNEL_PORT: "3000"
            KERNEL_PUBLIC_URL: ${ULVIA_INSTANCE_URL}
            CMS_INSTALLATIONS_PROVIDER_URL: http://ulvia-provider:5103
            CMS_INSTALLATIONS_PROVIDER_TOKEN: ${CMS_INSTALLATIONS_PROVIDER_TOKEN}
            VIRTUAL_HOST: ${ULVIA_INSTANCE_HOSTNAME}
            VIRTUAL_PORT: "3000"
        networks:
            - instances
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=256m
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        healthcheck:
            test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/readyz'); if(!r.ok) process.exit(1); await r.body?.cancel()"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        stop_grace_period: 30s

networks:
    instances:
        external: true
        name: ${ULVIA_INSTANCE_NETWORK}
