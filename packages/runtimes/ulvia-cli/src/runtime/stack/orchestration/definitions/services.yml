services:
    proxy:
        image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
        restart: unless-stopped
        user: "${ULVIA_UID}:${ULVIA_GID}"
        command: ["caddy", "run", "--config", "/etc/caddy/ulvia.json"]
        ports:
            - "${ULVIA_BIND_ADDRESS}:${ULVIA_HTTP_PORT}:80"
        volumes:
            - ${ULVIA_CADDY_CONFIG}:/etc/caddy/ulvia.json:ro
            - ${ULVIA_PROXY_CERTIFICATES_DIR}:/data
        environment:
            ULVIA_CONFIG_DIGEST: ${ULVIA_CADDY_CONFIG_DIGEST}
            XDG_DATA_HOME: /data
            XDG_CONFIG_HOME: /tmp/config
        networks:
            - instances
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=32m
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        stop_grace_period: 30s

    mongo:
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        image: mongo:7.0.37@sha256:d5b3ca8c3f3cdce78d44870dc0871b76d5235e9b2ad4ea6bea5d1fbff8027703
        restart: unless-stopped
        user: "${ULVIA_UID}:${ULVIA_GID}"
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${ULVIA_MONGO_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${ULVIA_MONGO_PASSWORD}
        volumes:
            - type: bind
              source: ${ULVIA_MONGO_DIR}
              target: /data/db
        networks:
            - private
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        stop_grace_period: 30s

    mongo-provision:
        image: mongo:7.0.37@sha256:d5b3ca8c3f3cdce78d44870dc0871b76d5235e9b2ad4ea6bea5d1fbff8027703
        restart: "no"
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${ULVIA_MONGO_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${ULVIA_MONGO_PASSWORD}
            MONGO_PROVIDER_USERNAME: ${ULVIA_MONGO_PROVIDER_USERNAME}
            MONGO_PROVIDER_PASSWORD: ${ULVIA_MONGO_PROVIDER_PASSWORD}
        entrypoint: ["/bin/sh", "-c"]
        command:
            - >-
                exec mongosh --quiet --host mongo
                --username "$$MONGO_INITDB_ROOT_USERNAME"
                --password "$$MONGO_INITDB_ROOT_PASSWORD"
                --authenticationDatabase admin
                /opt/ulvia-mongo/provision-provider.js
        volumes:
            - ./mongo/provision-provider.js:/opt/ulvia-mongo/provision-provider.js:ro
        networks:
            - private
        depends_on:
            mongo:
                condition: service_healthy
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=32m
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]

    provider:
        image: ${PROVIDER_IMAGE}
        restart: unless-stopped
        init: true
        user: "${ULVIA_UID}:${ULVIA_GID}"
        environment:
            MODE: PROD
            NODE_ENV: production
            CMS_FILES_DIR: /var/lib/cms/files
            CMS_SESSION_SECRET: ${ULVIA_PROVIDER_SESSION_SECRET}
            CMS_KEK_ACTIVE_ID: ${ULVIA_PROVIDER_KEK_ACTIVE_ID}
            CMS_KEK_RING_JSON: ${ULVIA_PROVIDER_KEK_RING_JSON}
            MONGO_URL: mongodb://${ULVIA_MONGO_PROVIDER_USERNAME}:${ULVIA_MONGO_PROVIDER_PASSWORD}@mongo:27017/ulvia_provider_control?authSource=admin&retryWrites=false
            ULVIA_PROVIDER_HOST: 0.0.0.0
            ULVIA_PROVIDER_PORT: "5103"
            ULVIA_PROVIDER_PUBLIC_URL: http://ulvia-provider:5103
            ULVIA_PROVIDER_OPERATOR_TOKEN: ${ULVIA_PROVIDER_OPERATOR_TOKEN}
            ULVIA_CONTROL_ORIGIN: ${ULVIA_CONTROL_ORIGIN}
            ULVIA_HOSTING_PROXY_URL: http://proxy:8080
            ULVIA_CONTROL_BOOTSTRAP_FILE: /run/ulvia/control-administrator.json
            ULVIA_EDGE_ROUTING_SECRET: ${ULVIA_EDGE_ROUTING_SECRET}
            ULVIA_HOSTING_MANAGED_SUFFIXES: ${ULVIA_HOSTING_MANAGED_SUFFIXES}
            ULVIA_TLS_ENTRYPOINTS: ${ULVIA_TLS_ENTRYPOINTS}
            ULVIA_TLS_PUBLIC_ADDRESSES: ${ULVIA_TLS_PUBLIC_ADDRESSES}
        volumes:
            - ${ULVIA_CONTROL_CREDENTIALS_DIR}:/run/ulvia:ro
            - type: bind
              source: ${ULVIA_FILES_DIR}
              target: /var/lib/cms/files
        ports:
            - "127.0.0.1:${ULVIA_PROVIDER_PORT}:5103"
        networks:
            private: {}
            instances:
                aliases:
                    - ulvia-provider
        depends_on:
            mongo-provision:
                condition: service_completed_successfully
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=256m
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        healthcheck:
            test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:5103/readyz'); if(r.status!==204) process.exit(1); await r.body?.cancel()"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        stop_grace_period: 30s

networks:
    private:
        name: ${ULVIA_PRIVATE_NETWORK}
        internal: true
    instances:
        name: ${ULVIA_INSTANCE_NETWORK}
