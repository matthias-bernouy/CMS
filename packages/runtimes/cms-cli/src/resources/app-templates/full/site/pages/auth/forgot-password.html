---
title: Forgot password
description: Static password recovery page ready for auth wiring
visible: true
tags: []
---
<w13c-snippet identifier="navbar"></w13c-snippet>
<base-container size="sm" align="center" padding-block="xl" background="muted" min-height="half">
    <base-card padding="lg" variant="elevated">
        <h1 slot="header">Forgot password</h1>
        <p>Enter your email address to receive a password reset link.</p>
        <base-form endpoint="/.cms/auth/password/reset/request" method="POST" redirect="/auth/login">
            <input type="email" name="email" placeholder="Email" required>
            <input type="submit" value="Send reset link">
        </base-form>
        <a slot="footer" href="/auth/login">Back to login</a>
    </base-card>
</base-container>
<w13c-snippet identifier="footer"></w13c-snippet>
