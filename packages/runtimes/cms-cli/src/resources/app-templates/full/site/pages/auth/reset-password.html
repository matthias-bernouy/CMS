---
title: Reset password
description: Static password reset page ready for auth wiring
visible: true
tags: []
---
<w13c-snippet identifier="navbar"></w13c-snippet>
<base-container size="sm" align="center" padding-block="xl" background="muted" min-height="half">
    <base-card padding="lg" variant="elevated">
        <h1 slot="header">Reset password</h1>
        <p>Choose a new password after opening a valid reset link.</p>
        <base-form endpoint="/.cms/auth/password/reset/confirm" method="POST" redirect="/auth/login">
            <input type="text" name="token" placeholder="Reset token" required>
            <input type="password" name="password" placeholder="New password" required>
            <input type="password" name="password-confirmation" placeholder="Confirm password" required>
            <input type="submit" value="Update password">
        </base-form>
        <a slot="footer" href="/auth/login">Back to login</a>
    </base-card>
</base-container>
<w13c-snippet identifier="footer"></w13c-snippet>
