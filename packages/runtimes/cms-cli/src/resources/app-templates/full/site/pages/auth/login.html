title: Login
description: Static login page ready for auth wiring
visible: true
tags: []
---
<w13c-snippet identifier="navbar"></w13c-snippet>
<base-container size="sm" align="center" padding-block="xl" background="muted" min-height="half">
    <base-card padding="lg" variant="elevated">
        <h1 slot="header">Login</h1>
        <p>Access your account with your email and password.</p>
        <form cms-source="/.cms/auth/login as result" cms-source-trigger="submit" cms-source-method="POST" cms-source-success-redirect="/">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="submit" value="Login">
        </form>
        <a slot="footer" href="/auth/forgot-password">Forgot password?</a>
        <a slot="footer" href="/auth/register">Create an account</a>
    </base-card>
</base-container>
<w13c-snippet identifier="footer"></w13c-snippet>
