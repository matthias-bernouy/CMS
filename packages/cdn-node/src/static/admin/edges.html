<style>
.flag-pill {
    display: inline-block;
    padding: 0.125rem 0.5rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: #9ca3af;
    color: white;
    min-width: 2.5rem;
    text-align: center;
}
.flag-pill[data-flag="yes"] { background: #16a34a; }
.flag-pill[data-flag="no"]  { background: #dc2626; }
.muted { opacity: 0.6; font-size: 0.85em; }
</style>

<p9r-stack gap="m" style="padding: 1.5rem 2rem;">

    <p9r-stack direction="row" justify="space-between" align="center">
        <h1 style="margin: 0;">Edges</h1>
        <p9r-stack direction="row" gap="s">
            <w13c-form target="{{BASE_PATH}}/api/edges/probe" method="POST" emit="edge:probed">
                <p9r-button variant="outlined" color="primary" type="submit">Probe all</p9r-button>
            </w13c-form>
            <w13c-form target="{{BASE_PATH}}/api/edges/sync" method="POST" emit="cluster:kicked">
                <p9r-button variant="outlined" color="primary" type="submit">Kick lsyncd</p9r-button>
            </w13c-form>
            <p9r-open-modal modal-target="add-edge-modal">
                <p9r-button color="primary">+ Add edge</p9r-button>
            </p9r-open-modal>
        </p9r-stack>
    </p9r-stack>

    <p9r-table>
        <p9r-row slot="header">
            <p9r-header-cell>id</p9r-header-cell>
            <p9r-header-cell>label</p9r-header-cell>
            <p9r-header-cell>SSH</p9r-header-cell>
            <p9r-header-cell>HTTPS</p9r-header-cell>
            <p9r-header-cell>disk used</p9r-header-cell>
            <p9r-header-cell>files</p9r-header-cell>
            <p9r-header-cell>last seen</p9r-header-cell>
            <p9r-header-cell></p9r-header-cell>
        </p9r-row>

        <w13c-fetch url="{{BASE_PATH}}/api/edges/list" reload-on="edge:added edge:removed edge:probed">
            <template for="data">
                <p9r-row>
                    <p9r-cell><code>{{ id }}</code></p9r-cell>
                    <p9r-cell>
                        {{ label }}
                        <div class="muted"><code>{{ sshUser }}@{{ hostname }}:{{ sshPort }}</code></div>
                    </p9r-cell>
                    <p9r-cell><span class="flag-pill" data-flag="{{ lastProbeOk | bool }}">{{ lastProbeOk | bool }}</span></p9r-cell>
                    <p9r-cell>
                        <span class="flag-pill" data-flag="{{ lastProbeHttpOk | bool }}">{{ lastProbeHttpStatus }}</span>
                    </p9r-cell>
                    <p9r-cell>{{ lastProbeUsedBytes | bytes }}</p9r-cell>
                    <p9r-cell>{{ lastProbeFileCount | number }}</p9r-cell>
                    <p9r-cell>{{ lastSeenAt | ago }}</p9r-cell>
                    <p9r-cell>
                        <p9r-stack direction="row" gap="s">
                            <w13c-form target="{{BASE_PATH}}/api/edges/probe?id={{id}}" method="POST" emit="edge:probed">
                                <p9r-button variant="ghost" type="submit">Probe</p9r-button>
                            </w13c-form>
                            <w13c-form target="{{BASE_PATH}}/api/edges?id={{id}}" method="DELETE" emit="edge:removed">
                                <p9r-button variant="ghost" color="danger" type="submit">Remove</p9r-button>
                            </w13c-form>
                        </p9r-stack>
                    </p9r-cell>
                </p9r-row>
            </template>
            <template slot="error">
                <p9r-row>
                    <p9r-cell colspan="8"><p9r-alert type="error">Failed to load edges.</p9r-alert></p9r-cell>
                </p9r-row>
            </template>
        </w13c-fetch>
    </p9r-table>

</p9r-stack>

<p9r-modal id="add-edge-modal" aria-label="Add edge">
    <span slot="title">New edge</span>
    <w13c-form target="{{BASE_PATH}}/api/edges" emit="edge:added">
        <p9r-stack gap="m">
            <p9r-input name="id"       label="id"       placeholder="edge-eu-1"             required></p9r-input>
            <p9r-input name="label"    label="label"    placeholder="Frankfurt edge node"></p9r-input>
            <p9r-input name="hostname" label="hostname" placeholder="edge-eu-1.example.com" required></p9r-input>
            <p9r-input name="sshUser"  label="sshUser"  value="cdn-sync"                    required></p9r-input>
            <p9r-input name="sshPort"  type="number"    label="sshPort" value="22"          required></p9r-input>
            <p9r-input name="dataPath" label="dataPath" value="/var/lib/cdn"                required></p9r-input>
            <p9r-input name="notes"    label="notes (optional)"></p9r-input>
            <p9r-button color="primary" type="submit" fullWidth>Add</p9r-button>
        </p9r-stack>
    </w13c-form>
</p9r-modal>

<bso-edge-token-result listen-on="edge:added"></bso-edge-token-result>
