<style>
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem; }
.kpi-grid p9r-card { padding: 1rem; }
.kpi-grid .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.7; }
.kpi-grid .value { font-size: 1.6rem; font-weight: 700; line-height: 1.2; margin-top: 0.25rem; }
.kpi-grid .sub   { font-size: 0.8rem; opacity: 0.6; margin-top: 0.25rem; }
.muted-cell { opacity: 0.5; font-style: italic; }
</style>

<p9r-stack gap="m" style="padding: 1.5rem 2rem;">

    <p9r-stack direction="row" justify="space-between" align="center">
        <h1 style="margin: 0;">Access logs</h1>
    </p9r-stack>
    <p style="margin: 0; opacity: 0.75;">
        Aggregated from each edge's nginx access logs (pulled via SSH every 15&nbsp;min). One row per
        <code>(edge, bucket, day)</code>. Last 7 UTC days.
    </p>

    <w13c-fetch url="{{BASE_PATH}}/api/metrics/bandwidth" reload-on="edge:probed cluster:kicked">
        <template>
            <p9r-stack gap="m">
                <p style="margin: 0; opacity: 0.6; font-size: 0.85em;">
                    Range: <code>{{ data.range.from }}</code> → <code>{{ data.range.to }}</code>
                </p>

                <h2 style="margin-bottom: 0;">By edge</h2>
                <p9r-table>
                    <p9r-row slot="header">
                        <p9r-header-cell>edge</p9r-header-cell>
                        <p9r-header-cell>requests</p9r-header-cell>
                        <p9r-header-cell>bandwidth</p9r-header-cell>
                    </p9r-row>
                    <template for="data.byEdge">
                        <p9r-row>
                            <p9r-cell><code>{{ edgeId }}</code></p9r-cell>
                            <p9r-cell>{{ requests | number }}</p9r-cell>
                            <p9r-cell>{{ bytes | bytes }}</p9r-cell>
                        </p9r-row>
                    </template>
                </p9r-table>

                <h2 style="margin-bottom: 0;">Top buckets</h2>
                <p9r-table>
                    <p9r-row slot="header">
                        <p9r-header-cell>bucket</p9r-header-cell>
                        <p9r-header-cell>requests</p9r-header-cell>
                        <p9r-header-cell>bandwidth</p9r-header-cell>
                    </p9r-row>
                    <template for="data.topBuckets">
                        <p9r-row>
                            <p9r-cell>
                                <code>{{ bucketId }}</code>
                            </p9r-cell>
                            <p9r-cell>{{ requests | number }}</p9r-cell>
                            <p9r-cell>{{ bytes | bytes }}</p9r-cell>
                        </p9r-row>
                    </template>
                </p9r-table>
            </p9r-stack>
        </template>
        <template slot="error">
            <p9r-alert type="error">Failed to load access metrics.</p9r-alert>
        </template>
    </w13c-fetch>

</p9r-stack>
