<dialog>
    <h2>Edge added</h2>
    <p class="warn"><strong>This is the only time</strong> you will see this token. Copy it now and pass it as <code>EDGE_TOKEN</code> to the cdn-edge container — it cannot be recovered. Lost token = delete + recreate the edge.</p>
    <input type="text" class="token" readonly aria-label="Plaintext bearer token">
    <div class="actions">
        <button class="copy" type="button">Copy</button>
        <button class="close" type="button">Done</button>
    </div>
</dialog>
