<cms-event-toast event="mockup:saved"     message="Mockup saved."     type="success"></cms-event-toast>
<cms-event-toast event="mockup:created"   message="Mockup created."   type="success"></cms-event-toast>
<cms-event-toast event="mockup:deleted"   message="Mockup deleted."   type="success"></cms-event-toast>
<cms-event-toast event="mockup:activated" message="Active mockup updated." type="success"></cms-event-toast>
<cms-event-toast event="form:failed"      message="Action failed — check the form and try again." type="error"></cms-event-toast>

<w13c-fixed-admin-layout>
    <span slot="title">
        <cms-fetch url="{{BASE_PATH}}/api/data/provider">
            <template><span>{{ id }}</span></template>
            <template slot="error"><span>Provider</span></template>
        </cms-fetch>
    </span>
    <a href="{{BASE_PATH}}/admin/data" slot="action">
        <p9r-button variant="ghost" color="secondary">← Back</p9r-button>
    </a>

    <div style="display: grid; grid-template-columns: 320px 1fr; gap: 1rem; align-items: start;">

        <aside style="background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 8px; padding: 0.5rem;">
            <cms-fetch url="{{BASE_PATH}}/api/data/provider/endpoints" reload-on="provider:saved">
                <template for=".">
                    <a class="endpoint-row" href="?id={{ providerId }}&method={{ method }}&path={{ path }}">
                        <p9r-stack direction="row" gap="sm" align="center">
                            <p9r-tag color="{{ methodColor }}">{{ method }}</p9r-tag>
                            <code style="font-size: 0.85em;">{{ path }}</code>
                        </p9r-stack>
                        <small style="color: var(--text-muted);">{{ summary }}</small>
                    </a>
                </template>
                <template slot="empty">
                    <cms-empty-state>
                        <p slot="title">No endpoints</p>
                        <p slot="hint">Sync the provider to discover its endpoints.</p>
                    </cms-empty-state>
                </template>
                <template slot="error">
                    <cms-empty-state>
                        <p slot="title">Could not load endpoints</p>
                        <p slot="hint">Check the provider id in the URL.</p>
                    </cms-empty-state>
                </template>
            </cms-fetch>
        </aside>

        <main>
            <cms-fetch url="{{BASE_PATH}}/api/data/provider/endpoint"
                reload-on="mockup:created mockup:saved mockup:deleted mockup:activated">

                <template>
                    <p9r-stack gap="md">
                        <p9r-stack direction="row" gap="sm" align="center">
                            <p9r-tag color="{{ methodColor }}">{{ method }}</p9r-tag>
                            <code style="font-size: 1.1em;">{{ path }}</code>
                        </p9r-stack>
                        <p style="color: var(--text-body);">{{ summary }}</p>
                        <p style="color: var(--text-muted); white-space: pre-wrap;">{{ description }}</p>
                    </p9r-stack>

                    <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid var(--border-default);">

                    <p9r-stack direction="row" gap="md" justify="between" align="center">
                        <h3 style="margin: 0;">Mockups</h3>
                        <p9r-open-modal modal-target="create-mockup-modal">
                            <p9r-button color="primary">+ Create mockup</p9r-button>
                        </p9r-open-modal>
                    </p9r-stack>

                    <p style="color: var(--text-muted); margin-top: 0.5rem;">{{ mockupsEmptyLabel }}</p>

                    <template for="mockups">
                        <p9r-stack direction="row" gap="md" align="center"
                            style="padding: 0.75rem; border: 1px solid var(--border-default); border-radius: 8px; margin-top: 0.5rem;">
                            <p9r-tag>{{ status }}</p9r-tag>
                            <strong style="flex: 1;">{{ name }}</strong>
                            <span style="color: var(--success-base); font-size: 0.85em;">{{ activeLabel }}</span>
                            <cms-form target="{{BASE_PATH}}/api/data/provider/mockup/active?id={{ providerId }}&method={{ method }}&path={{ path }}&name={{ name }}"
                                method="POST" emit="mockup:activated">
                                <p9r-button type="submit" variant="ghost" color="secondary"
                                    aria-label="Set active">Set active</p9r-button>
                            </cms-form>
                            <p9r-open-modal modal-target="edit-mockup-{{ name }}">
                                <p9r-button variant="ghost" color="secondary" aria-label="Edit {{ name }}">Edit</p9r-button>
                            </p9r-open-modal>
                            <cms-confirm-form
                                target="{{BASE_PATH}}/api/data/provider/mockup?id={{ providerId }}&method={{ method }}&path={{ path }}&name={{ name }}"
                                method="DELETE" emit="mockup:deleted"
                                message="Delete mockup &quot;{{ name }}&quot;?">
                                <p9r-button color="danger" aria-label="Delete {{ name }}">×</p9r-button>
                            </cms-confirm-form>
                        </p9r-stack>

                        <p9r-modal id="edit-mockup-{{ name }}" aria-label="Edit mockup {{ name }}">
                            <span slot="title">Edit "{{ name }}"</span>
                            <cms-form target="{{BASE_PATH}}/api/data/provider/mockup?id={{ providerId }}&method={{ method }}&path={{ path }}&name={{ name }}"
                                method="PUT" emit="mockup:saved">
                                <p9r-stack gap="md">
                                    <p9r-input name="name" label="Name" value="{{ name }}"
                                        hint="Renaming keeps the mockup unique within this endpoint."></p9r-input>
                                    <p9r-input name="status" type="number" label="HTTP status" value="{{ status }}"></p9r-input>
                                    <label class="json-label" style="display: block;">Body</label>
                                    <cms-json-editor name="body" schema="{{ bodySchema }}" value="{{ body }}"></cms-json-editor>
                                    <p9r-button color="primary" fullWidth type="submit">Save</p9r-button>
                                </p9r-stack>
                            </cms-form>
                        </p9r-modal>
                    </template>

                    <p9r-modal id="create-mockup-modal" aria-label="Create a mockup">
                        <span slot="title">Create a mockup for {{ method }} {{ path }}</span>
                        <cms-mockup-create></cms-mockup-create>
                    </p9r-modal>
                </template>

                <template slot="error">
                    <p9r-stack gap="sm" align="center" style="padding: 3rem 1rem; text-align: center; color: var(--text-muted);">
                        <strong style="color: var(--text-main); font-size: 1.1em;">Select an endpoint</strong>
                        <span>Pick one from the list to view its schema and manage mockups.</span>
                    </p9r-stack>
                </template>
            </cms-fetch>
        </main>
    </div>
</w13c-fixed-admin-layout>
