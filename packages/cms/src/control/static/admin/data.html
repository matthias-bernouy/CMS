<w13c-fixed-admin-layout>
    <span slot="title">Data</span>
    <p9r-open-modal modal-target="add-provider-modal" slot="action">
        <p9r-button color="primary">+ Add provider</p9r-button>
    </p9r-open-modal>

    <p9r-table>
        <p9r-row slot="header">
            <p9r-cell><strong>Provider</strong></p9r-cell>
            <p9r-cell><strong>Source</strong></p9r-cell>
            <p9r-cell><strong>Endpoints</strong></p9r-cell>
            <p9r-cell><strong>Last sync</strong></p9r-cell>
            <p9r-cell></p9r-cell>
        </p9r-row>

        <cms-fetch url="{{BASE_PATH}}/api/data/providers" reload-on="new:provider">
            <template for=".">
                <p9r-row>
                    <p9r-cell><strong>{{ name }}</strong></p9r-cell>
                    <p9r-cell><p9r-tag>{{ source }}</p9r-tag></p9r-cell>
                    <p9r-cell>{{ endpointCount }}</p9r-cell>
                    <p9r-cell>{{ lastSyncAt }}</p9r-cell>
                    <p9r-cell></p9r-cell>
                </p9r-row>
            </template>
            <template slot="empty">
                <cms-empty-state>
                    <svg slot="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <ellipse cx="12" cy="5" rx="9" ry="3" />
                        <path d="M3 5v6c0 1.66 4.03 3 9 3s9-1.34 9-3V5" />
                        <path d="M3 11v6c0 1.66 4.03 3 9 3s9-1.34 9-3v-6" />
                    </svg>
                    <p slot="title">No data providers yet</p>
                    <p slot="hint">Connect an OpenAPI source to start consuming external data in your blocks.</p>
                </cms-empty-state>
            </template>
        </cms-fetch>
    </p9r-table>
</w13c-fixed-admin-layout>

<p9r-modal id="add-provider-modal" aria-label="Add a data provider">
    <span slot="title">Add a data provider</span>

    <p9r-tabs active="official">

        <p9r-tab-panel id="official" label="Official">
            <p9r-stack gap="sm">
                <p9r-button disabled fullWidth>
                    <svg slot="icon-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
                    </svg>
                    Supabase
                </p9r-button>
                <small>More providers coming soon (Stripe, GitHub, Hub API, ...).</small>
            </p9r-stack>
        </p9r-tab-panel>

        <p9r-tab-panel id="url" label="From URL">
            <p9r-stack gap="md">
                <p9r-input name="id" label="ID" placeholder="hub-api"
                    hint="Lowercase letters, numbers and dashes. Used as binding key. Immutable after creation."
                    disabled></p9r-input>
                <p9r-input name="name" label="Name" placeholder="Hub API" disabled></p9r-input>
                <p9r-input name="url" label="OpenAPI URL"
                    placeholder="https://api.example.com/openapi.json" disabled></p9r-input>

                <details>
                    <summary>Advanced settings</summary>
                    <p9r-stack gap="sm">
                        <p9r-input name="auth.bearer" label="Bearer token"
                            placeholder="eyJhbG... or ${HUB_API_TOKEN}" disabled></p9r-input>

                        <p9r-stack direction="row" gap="sm">
                            <p9r-input name="auth.headers.0.name" placeholder="Header name" disabled></p9r-input>
                            <p9r-input name="auth.headers.0.value" placeholder="Header value" disabled></p9r-input>
                        </p9r-stack>

                        <p9r-button disabled>+</p9r-button>
                    </p9r-stack>
                </details>

                <p9r-button color="primary" fullWidth disabled>Add provider</p9r-button>
            </p9r-stack>
        </p9r-tab-panel>

        <p9r-tab-panel id="upload" label="Upload file">
            <p9r-stack gap="md">
                <p9r-input name="id" label="ID" placeholder="hub-api"
                    hint="Lowercase letters, numbers and dashes. Used as binding key. Immutable after creation."
                    disabled></p9r-input>
                <p9r-input name="name" label="Name" placeholder="Hub API" disabled></p9r-input>
                <p9r-input type="file" name="spec" label="OpenAPI file"
                    hint="JSON or YAML. Snapshot only - no auto-refresh." disabled></p9r-input>
                <p9r-button color="primary" fullWidth disabled>Add provider</p9r-button>
            </p9r-stack>
        </p9r-tab-panel>

        <p9r-tab-panel id="paste" label="Paste content">
            <p9r-stack gap="md">
                <p9r-input name="id" label="ID" placeholder="hub-api"
                    hint="Lowercase letters, numbers and dashes. Used as binding key. Immutable after creation."
                    disabled></p9r-input>
                <p9r-input name="name" label="Name" placeholder="Hub API" disabled></p9r-input>
                <p9r-textarea name="spec" rows="12" autosize
                    placeholder='{ "openapi": "3.0.0", ... }' disabled></p9r-textarea>
                <p9r-button color="primary" fullWidth disabled>Add provider</p9r-button>
            </p9r-stack>
        </p9r-tab-panel>

    </p9r-tabs>
</p9r-modal>
