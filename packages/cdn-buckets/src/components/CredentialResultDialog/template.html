<dialog>
    <h2>Credential created</h2>
    <p class="warn"><strong>This is the only time</strong> you will see this token. Copy it now and store it somewhere safe — it cannot be recovered.</p>
    <input type="text" class="token" readonly aria-label="Cleartext token">
    <div class="actions">
        <button class="copy" type="button">Copy</button>
        <button class="close" type="button">Done</button>
    </div>
</dialog>
