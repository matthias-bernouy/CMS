<form>
    <div class="field">
        <label>providerId</label>
        <input name="providerId" required pattern="[A-Za-z0-9_-]+" placeholder="stripe">
        <small>Slug used as path segment: <code>/.cms/data/&lt;providerId&gt;/…</code></small>
    </div>
    <div class="field">
        <label>server (upstream URL)</label>
        <input name="server" type="url" required placeholder="https://api.example.com">
    </div>
    <div class="field">
        <label>auth type</label>
        <select name="authType">
            <option value="none">None</option>
            <option value="bearer" selected>Bearer token</option>
            <option value="headers">Custom headers</option>
        </select>
    </div>
    <div class="field show-bearer">
        <label>bearer token</label>
        <input name="authToken" type="password" placeholder="upstream API token">
    </div>
    <div class="field show-headers">
        <label>headers (JSON array)</label>
        <textarea name="authHeaders" rows="4" placeholder='[{"name":"X-API-Key","value":"abc"}]'></textarea>
    </div>
    <p class="error" hidden></p>
    <div class="actions">
        <button type="submit">Create</button>
    </div>
</form>
