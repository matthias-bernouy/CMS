# BasicStorageProvider — Nginx config skeleton.
# The `generated/` directory is rewritten by the app on bucket / alias / cache-policy
# changes, then `nginx -s reload` is invoked. Everything else is static.

# ─── Maps ──────────────────────────────────────────────────────────────────────

# Host → bucket_id. Wildcard sub-domains of cdn.bernouy.com are stripped to give
# the bucket id directly; custom aliases come from the generated map.
map $host $bucket_id {
    hostnames;
    default "";
    ~^(?<sub>[^.]+)\.cdn\.bernouy\.com$ $sub;
    include /etc/nginx/conf.d/basic-storage/generated/aliases.conf;
}

# bucket_id → Cache-Control header. Empty default means Nginx omits the header.
map $bucket_id $cache_control {
    default "";
    include /etc/nginx/conf.d/basic-storage/generated/cacheControls.conf;
}

# ─── Upstream (the Bun app) ────────────────────────────────────────────────────

upstream basic_storage_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ─── 1. Admin + upload on cdn.bernouy.com ──────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name cdn.bernouy.com;

    ssl_certificate     /etc/letsencrypt/live/cdn.bernouy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.bernouy.com/privkey.pem;

    # Upload streams to the app: no Nginx-side buffering, per-bucket limits enforced
    # in the app while streaming. 5g is a backstop against runaway clients.
    location = /upload {
        client_max_body_size    5g;
        proxy_request_buffering off;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_pass              http://basic_storage_app;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass         http://basic_storage_app;
    }
}

# ─── 2. Public buckets on *.cdn.bernouy.com ───────────────────────────────────

server {
    listen 443 ssl http2;
    server_name ~^(?<sub>[^.]+)\.cdn\.bernouy\.com$;

    ssl_certificate     /etc/letsencrypt/live/cdn.bernouy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.bernouy.com/privkey.pem;

    include /etc/nginx/conf.d/basic-storage/bucketServing.conf;
}

# ─── 3. Custom aliases (one server block per alias, with its own cert) ────────

include /etc/nginx/conf.d/basic-storage/generated/aliasesServers.conf;

# ─── 4. HTTP → HTTPS redirect + ACME http-01 challenge for lego ───────────────

server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/lib/lego/.well-known;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
