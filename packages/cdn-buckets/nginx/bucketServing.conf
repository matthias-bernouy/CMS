# Common body for any server block that serves files of a bucket (the wildcard
# *.cdn.bernouy.com server and every generated alias server). Relies on these
# maps defined in nginx.conf:
#   $bucket_id        — host → bucketId
#   $cache_control    — bucketId → Cache-Control header value
#   $bucket_notfound  — bucketId → 404 fallback file path within the bucket

# Unknown host (nothing in the map) → drop the connection without leaking info.
if ($bucket_id = "") { return 444; }

root /var/storage/buckets/$bucket_id;

location / {
    add_header Cache-Control                $cache_control always;
    add_header Access-Control-Allow-Origin  "*"            always;

    # Static cross-bucket security headers. Mirrors `SECURITY_HEADERS` in
    # @bernouy/cms/socle/server/compression.ts so a page served from a
    # bucket gets the same baseline as one served from the Bun runtime.
    #
    # CSP is NOT here — it travels with the HTML as a `<meta http-equiv>`
    # tag (see `delivery/core/head/buildMetaCsp.ts`), which lets it be
    # per-page-dynamic without nginx ever knowing the data providers /
    # settings extras.
    #
    # `Cross-Origin-Resource-Policy: same-origin` is intentionally OMITTED:
    # the wide-open `Access-Control-Allow-Origin: *` above advertises that
    # any origin may read these bytes — adding CORP same-origin would
    # contradict that and silently break hotlinking. Lock both down
    # together if/when image hotlinking is no longer wanted.
    add_header X-Content-Type-Options       "nosniff"                                                          always;
    add_header X-Frame-Options              "DENY"                                                             always;
    add_header Strict-Transport-Security    "max-age=31536000"                                                 always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin"                                  always;
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=(), payment=(), usb=()"     always;
    add_header Cross-Origin-Opener-Policy   "same-origin"                                                      always;

    error_page 404 = @bucket_notfound;
    try_files  $uri $uri.html $uri/index.html =404;
}

# Internal-only fallback that serves the bucket's configured 404 page when
# set, or returns plain 404 when not. The empty-default trick: if the map
# has no entry, `$bucket_notfound` is empty and `try_files` falls through
# to `=404` cleanly.
location @bucket_notfound {
    internal;
    try_files /$bucket_notfound =404;
}
