<p9r-attr-sync>
    <p9r-section data-title="Submission">
        <p9r-select name="method" label="Method">
            <option selected value="post">POST</option>
            <option value="get">GET</option>
            <option value="dialog">Dialog</option>
        </p9r-select>
        <p9r-select name="enctype" label="Encoding">
            <option selected value="application/x-www-form-urlencoded">URL-encoded</option>
            <option value="multipart/form-data">Multipart (files)</option>
            <option value="text/plain">Plain text</option>
        </p9r-select>
        <p9r-segmented-switch name="novalidate" label="Disable native validation">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
    </p9r-section>

    <p9r-section data-title="Layout" data-collapsed>
        <p9r-select name="layout" label="Layout">
            <option selected value="stack">Stacked</option>
            <option value="inline">Inline</option>
            <option value="grid">Grid</option>
        </p9r-select>
        <p9r-sizes-select name="gap" label="Gap"></p9r-sizes-select>
        <p9r-select name="width" label="Max width">
            <option value="sm">Small (420px)</option>
            <option selected value="md">Medium (640px)</option>
            <option value="lg">Large (860px)</option>
            <option value="full">Full</option>
        </p9r-select>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Fields">
    <p9r-comp-sync allow-multiple optionnal>
        <hub-form-field></hub-form-field>
    </p9r-comp-sync>
</p9r-section>
