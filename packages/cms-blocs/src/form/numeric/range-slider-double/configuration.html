<p9r-attr-sync>
    <p9r-section data-title="Range">
        <p9r-range name="min" label="Min value" min="0" max="10000" value="0"></p9r-range>
        <p9r-range name="max" label="Max value" min="0" max="10000" value="300"></p9r-range>
        <p9r-range name="step" label="Step" min="1" max="100" value="1"></p9r-range>
    </p9r-section>

    <p9r-section data-title="Default values">
        <p9r-range name="value-min" label="Default min" min="0" max="10000" value="0"></p9r-range>
        <p9r-range name="value-max" label="Default max" min="0" max="10000" value="300"></p9r-range>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Label">
    <p9r-comp-sync optionnal disable-others-components>
        <span data-attr-target-name="label">Price</span>
    </p9r-comp-sync>
    <p9r-comp-sync optionnal disable-others-components>
        <span data-attr-target-name="unit">€</span>
    </p9r-comp-sync>
</p9r-section>
