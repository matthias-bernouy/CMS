<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="layout" label="Layout">
            <option selected value="vertical">Vertical</option>
            <option value="horizontal">Horizontal</option>
        </p9r-select>
        <p9r-segmented-switch name="required" label="Required">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Label">
    <p9r-comp-sync>
        <span slot="label">Field label</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Control">
    <p9r-comp-sync>
        <base-input-text slot="control"></base-input-text>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Help text" data-collapsed>
    <p9r-comp-sync optionnal>
        <span slot="help">Help text shown below the field.</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Error message" data-collapsed>
    <p9r-comp-sync optionnal>
        <span slot="error">This field is required.</span>
    </p9r-comp-sync>
</p9r-section>
