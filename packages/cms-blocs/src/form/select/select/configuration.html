<p9r-attr-sync>
    <p9r-section data-title="State">
        <p9r-segmented-switch name="required" label="Required">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="disabled" label="Disabled">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="multiple" label="Multiple">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
    </p9r-section>

    <p9r-section data-title="Style">
        <p9r-select name="variant" label="Variant">
            <option selected value="">Default</option>
            <option value="ghost">Ghost</option>
        </p9r-select>
        <p9r-select name="size" label="Size">
            <option value="sm">Small</option>
            <option selected value="">Medium</option>
            <option value="lg">Large</option>
        </p9r-select>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Name">
    <p9r-comp-sync>
        <span slot="field-name">choice</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Options">
    <p9r-comp-sync allow-multiple>
        <base-select-option value="one">Option one</base-select-option>
        <base-select-option value="two">Option two</base-select-option>
        <base-select-option value="three">Option three</base-select-option>
    </p9r-comp-sync>
</p9r-section>
