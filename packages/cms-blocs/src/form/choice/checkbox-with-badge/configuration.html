<p9r-attr-sync>
    <p9r-section data-title="State">
        <p9r-segmented-switch name="checked" label="Checked by default">
            <option selected value="">Off</option>
            <option value="true">On</option>
        </p9r-segmented-switch>
    </p9r-section>

    <p9r-section data-title="Badge">
        <p9r-segmented-switch name="grade" label="Badge color" value="ace">
            <option value="ace">Ace (green)</option>
            <option value="break">Break (orange)</option>
            <option value="coup-droit">Coup droit (brown)</option>
        </p9r-segmented-switch>
    </p9r-section>

    <p9r-section data-title="Value">
        <p9r-comp-sync optionnal disable-others-components>
            <span data-attr-target-name="value">value</span>
        </p9r-comp-sync>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Label">
    <p9r-comp-sync disable-others-components>
        <span slot="label">Option</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Badge label">
    <p9r-comp-sync optionnal disable-others-components>
        <span slot="badge">Ace</span>
    </p9r-comp-sync>
</p9r-section>
