<p9r-attr-sync>
    <p9r-section data-title="State">
        <p9r-segmented-switch name="checked" label="On by default">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="required" label="Required">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="disabled" label="Disabled">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
    </p9r-section>

    <p9r-section data-title="Style">
        <p9r-select name="size" label="Size">
            <option value="sm">Small</option>
            <option selected value="">Medium</option>
            <option value="lg">Large</option>
        </p9r-select>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Label">
    <p9r-comp-sync>
        <span>Enable notifications</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Name">
    <p9r-comp-sync>
        <span slot="field-name">notifications</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Submitted value" data-collapsed>
    <p9r-comp-sync optionnal>
        <span slot="field-value">on</span>
    </p9r-comp-sync>
</p9r-section>
