<p9r-attr-sync>
    <p9r-section data-title="State">
        <p9r-segmented-switch name="required" label="Required">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="disabled" label="Disabled">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="readonly" label="Read only">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>

    </p9r-section>

    <p9r-section data-title="Style">
        <p9r-select name="variant" label="Variant">
            <option selected value="default">Default</option>
            <option value="ghost">Ghost</option>
        </p9r-select>
        <p9r-select name="size" label="Size">
            <option value="sm">Small</option>
            <option selected value="md">Medium</option>
            <option value="lg">Large</option>
        </p9r-select>
    </p9r-section>
    <p9r-section data-title="Range" data-collapsed>
        <p9r-range name="step" label="Step" min="0" max="100" step="1" value="1"></p9r-range>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Name">
    <p9r-comp-sync>
        <span slot="field-name">field-number</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Placeholder">
    <p9r-comp-sync optionnal>
        <span slot="placeholder">Type here...</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Default value" data-collapsed>
    <p9r-comp-sync optionnal>
        <span slot="default-value"></span>
    </p9r-comp-sync>
</p9r-section>
