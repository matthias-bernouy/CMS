<p9r-attr-sync>
    <p9r-section data-title="State">
        <p9r-segmented-switch name="required" label="Required">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="disabled" label="Disabled">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="multiple" label="Multiple files">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
    </p9r-section>

    <p9r-section data-title="Style">
        <p9r-select name="size" label="Size">
            <option value="sm">Small</option>
            <option selected value="">Medium</option>
            <option value="lg">Large</option>
        </p9r-select>
    </p9r-section>

    <p9r-section data-title="Capture" data-collapsed>
        <p9r-select name="capture" label="Camera capture">
            <option selected value="">Off</option>
            <option value="user">Front camera</option>
            <option value="environment">Back camera</option>
        </p9r-select>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Prompt">
    <p9r-comp-sync>
        <span>Click or drop files here</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Hint" data-collapsed>
    <p9r-comp-sync optionnal>
        <span slot="hint">Any file up to 10 MB</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Name">
    <p9r-comp-sync>
        <span slot="field-name">file</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Accepted types" data-collapsed>
    <p9r-comp-sync optionnal>
        <span slot="accept">image/*</span>
    </p9r-comp-sync>
</p9r-section>
