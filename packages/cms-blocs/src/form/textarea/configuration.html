<p9r-attr-sync>
    <p9r-section data-title="State">
        <p9r-segmented-switch name="required" label="Required">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="disabled" label="Disabled">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="readonly" label="Read only">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
    </p9r-section>

    <p9r-section data-title="Style">
        <p9r-range name="rows" label="Rows" min="2" max="20" step="1" value="4"></p9r-range>
        <p9r-select name="resize" label="Resize">
            <option selected value="vertical">Vertical</option>
            <option value="none">None</option>
            <option value="horizontal">Horizontal</option>
            <option value="both">Both</option>
        </p9r-select>
        <p9r-segmented-switch name="autogrow" label="Autogrow">
            <option selected value="">Off</option>
            <option value="true">On</option>
        </p9r-segmented-switch>
        <p9r-select name="size" label="Size">
            <option value="sm">Small</option>
            <option selected value="md">Medium</option>
            <option value="lg">Large</option>
        </p9r-select>
    </p9r-section>

    <p9r-section data-title="Validation" data-collapsed>
        <p9r-range name="minlength" label="Min length" min="0" max="500" step="1" value="0"></p9r-range>
        <p9r-range name="maxlength" label="Max length" min="0" max="5000" step="10" value="0"></p9r-range>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Name">
    <p9r-comp-sync>
        <span slot="field-name">message</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Placeholder">
    <p9r-comp-sync optionnal>
        <span slot="placeholder">Write your message...</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Default value" data-collapsed>
    <p9r-comp-sync optionnal>
        <span slot="default-value"></span>
    </p9r-comp-sync>
</p9r-section>
