<p9r-attr-sync>
    <p9r-section data-title="State">
        <p9r-segmented-switch name="required" label="Required">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="disabled" label="Disabled">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
    </p9r-section>

    <p9r-section data-title="Layout">
        <p9r-segmented-switch name="layout" label="Direction">
            <option selected value="">Stack</option>
            <option value="inline">Inline</option>
        </p9r-segmented-switch>
        <p9r-select name="gap" label="Spacing">
            <option value="sm">Small</option>
            <option selected value="">Medium</option>
            <option value="lg">Large</option>
        </p9r-select>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Name">
    <p9r-comp-sync>
        <span slot="field-name">choice</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Options">
    <p9r-comp-sync allow-multiple>
        <hub-radio value="one">Option one</hub-radio>
        <hub-radio value="two">Option two</hub-radio>
        <hub-radio value="three">Option three</hub-radio>
    </p9r-comp-sync>
</p9r-section>
