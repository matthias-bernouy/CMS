<p9r-attr-sync>
    <p9r-section data-title="State">
        <p9r-segmented-switch name="checked" label="Selected by default">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="disabled" label="Disabled">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Label">
    <p9r-comp-sync>
        <span>Option</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Submitted value">
    <p9r-comp-sync>
        <span slot="field-value">option</span>
    </p9r-comp-sync>
</p9r-section>
