<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-segmented-switch name="tone" label="Tone" value="default">
            <option value="default">Default</option>
            <option value="muted">Muted</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Title">
    <p9r-comp-sync disable-others-components>
        <span slot="title">Filters</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Body">
    <p9r-comp-sync allow-multiple inline-adding></p9r-comp-sync>
</p9r-section>
