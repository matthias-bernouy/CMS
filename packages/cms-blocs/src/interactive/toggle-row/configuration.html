<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-segmented-switch name="divider" label="Top divider">
            <option selected value="">Off</option>
            <option value="true">On</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Label">
    <p9r-comp-sync disable-others-components>
        <span slot="label">Toggle label</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Description">
    <p9r-comp-sync optionnal disable-others-components>
        <span slot="description">Small helper text below the label.</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Control">
    <p9r-comp-sync>
        <base-switch slot="control"></base-switch>
    </p9r-comp-sync>
</p9r-section>
