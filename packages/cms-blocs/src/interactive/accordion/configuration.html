<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="variant" label="Variant">
            <option selected value="default">Default</option>
            <option value="bordered">Bordered</option>
            <option value="separated">Separated</option>
            <option value="ghost">Ghost</option>
        </p9r-select>
        <p9r-select name="size" label="Size">
            <option value="sm">Small</option>
            <option selected value="md">Medium</option>
            <option value="lg">Large</option>
        </p9r-select>
        <p9r-select name="icon" label="Toggle icon">
            <option selected value="chevron">Chevron</option>
            <option value="plus">Plus / minus</option>
            <option value="caret">Caret</option>
            <option value="none">None</option>
        </p9r-select>
        <p9r-segmented-switch name="icon-position" label="Icon position" value="right">
            <option value="left">Left</option>
            <option selected value="right">Right</option>
        </p9r-segmented-switch>
    </p9r-section>
    <p9r-section data-title="Behavior">
        <p9r-segmented-switch name="mode" label="Open mode" value="single">
            <option selected value="single">Single (close others)</option>
            <option value="multi">Multiple</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Items">
    <p9r-comp-sync allow-multiple>
        <base-accordion-item>
            <span slot="title">Question title</span>
            <p slot="content">Answer content goes here.</p>
        </base-accordion-item>
    </p9r-comp-sync>
</p9r-section>
