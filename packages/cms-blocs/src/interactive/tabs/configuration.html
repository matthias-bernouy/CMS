<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="variant" label="Variant">
            <option selected value="underline">Underline</option>
            <option value="pill">Pill</option>
            <option value="segmented">Segmented</option>
        </p9r-select>
        <p9r-select name="size" label="Size">
            <option value="sm">Small</option>
            <option selected value="md">Medium</option>
            <option value="lg">Large</option>
        </p9r-select>
        <p9r-segmented-switch name="align" label="Alignement" value="left">
            <option selected value="left">Left</option>
            <option value="center">Center</option>
            <option value="stretch">Stretch</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Tabs">
    <p9r-comp-sync allow-multiple>
        <base-tab>
            <span slot="label">Tab</span>
            <p>Panel content.</p>
        </base-tab>
    </p9r-comp-sync>
</p9r-section>
