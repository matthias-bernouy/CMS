<p9r-attr-sync>
    <p9r-section data-title="Tab">
        <p9r-segmented-switch name="active" label="Active by default">
            <option selected value="">False</option>
            <option value="true">True</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Label">
    <p9r-comp-sync disable-others-components>
        <span slot="label">Tab</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Content">
    <p9r-comp-sync allow-multiple>
        <p>Panel content.</p>
    </p9r-comp-sync>
</p9r-section>
