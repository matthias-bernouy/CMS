<p9r-attr-sync>
    <p9r-section data-title="Link">
        <p9r-link name="href" label="Edit URL"></p9r-link>
        <p9r-select name="provider" label="Provider">
            <option selected value="github">GitHub</option>
            <option value="gitlab">GitLab</option>
            <option value="bitbucket">Bitbucket</option>
            <option value="generic">Generic</option>
        </p9r-select>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Label">
    <p9r-comp-sync disable-others-components optionnal>
        <span slot="label">Edit this page</span>
    </p9r-comp-sync>
</p9r-section>
