<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-segmented-switch name="variant" label="Variant" value="default">
            <option selected value="default">Default</option>
            <option value="compact">Compact</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Question">
    <p9r-comp-sync disable-others-components optionnal>
        <span slot="question">Was this page helpful?</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Thank you message">
    <p9r-comp-sync disable-others-components optionnal>
        <span slot="thanks">Thanks for your feedback!</span>
    </p9r-comp-sync>
</p9r-section>
