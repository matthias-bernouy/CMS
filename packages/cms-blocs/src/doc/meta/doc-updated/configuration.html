<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="format" label="Format">
            <option selected value="relative">Relative (3 days ago)</option>
            <option value="absolute">Absolute (April 16, 2026)</option>
            <option value="both">Both</option>
        </p9r-select>
        <p9r-select name="locale" label="Locale">
            <option selected value="en">English</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="es">Spanish</option>
        </p9r-select>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Label">
    <p9r-comp-sync disable-others-components optionnal>
        <span slot="label">Last updated</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Date">
    <p9r-comp-sync disable-others-components>
        <span slot="date">2026-04-16</span>
    </p9r-comp-sync>
</p9r-section>
