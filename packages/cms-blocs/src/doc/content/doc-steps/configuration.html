<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="variant" label="Variant">
            <option selected value="numbered">Numbered</option>
            <option value="checked">Checked</option>
            <option value="bulleted">Bulleted</option>
        </p9r-select>
        <p9r-segmented-switch name="spacing" label="Spacing" value="regular">
            <option value="compact">Compact</option>
            <option selected value="regular">Regular</option>
            <option value="spacious">Spacious</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Steps">
    <p9r-comp-sync allow-multiple>
        <doc-step></doc-step>
    </p9r-comp-sync>
</p9r-section>
