<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="theme" label="Theme">
            <option selected value="default">Default</option>
            <option value="dark">Dark</option>
            <option value="forest">Forest</option>
            <option value="neutral">Neutral</option>
        </p9r-select>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Diagram source">
    <p9r-comp-sync disable-others-components allow-multiple>
        <span>graph TD; A[Start] --> B[Process]; B --> C[End];</span>
    </p9r-comp-sync>
</p9r-section>
