<p9r-attr-sync>
    <p9r-section data-title="Endpoint">
        <p9r-select name="method" label="HTTP method">
            <option selected value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="PATCH">PATCH</option>
            <option value="DELETE">DELETE</option>
            <option value="OPTIONS">OPTIONS</option>
            <option value="HEAD">HEAD</option>
        </p9r-select>
        <p9r-segmented-switch name="deprecated" label="Deprecated">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Path">
    <p9r-comp-sync disable-others-components>
        <span slot="path">/users/:id</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Description">
    <p9r-comp-sync allow-multiple optionnal>
        <p slot="description">Retrieve a single user by their unique identifier.</p>
    </p9r-comp-sync>
</p9r-section>
