<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-segmented-switch name="required" label="Required">
            <option selected value="false">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="deprecated" label="Deprecated">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Name">
    <p9r-comp-sync disable-others-components>
        <span slot="name">id</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Type">
    <p9r-comp-sync disable-others-components>
        <span slot="type">string</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Description">
    <p9r-comp-sync allow-multiple>
        <p slot="description">Unique identifier for the resource.</p>
    </p9r-comp-sync>
</p9r-section>
