<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="kind" label="Kind">
            <option selected value="query">Query</option>
            <option value="path">Path</option>
            <option value="body">Body</option>
            <option value="header">Header</option>
            <option value="response">Response</option>
        </p9r-select>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Title">
    <p9r-comp-sync disable-others-components optionnal>
        <span slot="title">Query parameters</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Properties">
    <p9r-comp-sync allow-multiple>
        <doc-api-property></doc-api-property>
    </p9r-comp-sync>
</p9r-section>
