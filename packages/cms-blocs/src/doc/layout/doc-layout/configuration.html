<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-segmented-switch name="variant" label="Theme" value="light">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Brand">
    <p9r-comp-sync>
        <span slot="brand">Documentation</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Top navigation">
    <p9r-comp-sync allow-multiple optionnal>
        <a slot="top" href="#">Guides</a>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Top actions">
    <p9r-comp-sync allow-multiple optionnal>
        <hub-button slot="actions" variant="primary" size="sm"></hub-button>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Sidebar">
    <p9r-comp-sync allow-multiple>
        <doc-sidebar-section slot="sidebar"></doc-sidebar-section>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Content">
    <p9r-comp-sync allow-multiple>
        <p>Page content.</p>
    </p9r-comp-sync>
</p9r-section>
