<figure class="wrapper" part="wrapper">
    <header class="header" part="header">
        <span class="filename" part="filename"><slot name="filename"></slot></span>
        <span class="lang" part="lang"></span>
        <button class="copy" type="button" part="copy">
            <span class="copy-label">Copy</span>
            <span class="copy-done">Copied</span>
        </button>
    </header>
    <pre class="code" part="code"><code><slot></slot></code></pre>
</figure>
