<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="language" label="Language">
            <option selected value="plain">Plain</option>
            <option value="ts">TypeScript</option>
            <option value="js">JavaScript</option>
            <option value="tsx">TSX</option>
            <option value="jsx">JSX</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="json">JSON</option>
            <option value="bash">Bash</option>
            <option value="python">Python</option>
            <option value="go">Go</option>
            <option value="rust">Rust</option>
            <option value="sql">SQL</option>
        </p9r-select>
        <p9r-segmented-switch name="theme" label="Theme" value="dark">
            <option selected value="dark">Dark</option>
            <option value="light">Light</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="line-numbers" label="Line numbers">
            <option selected value="false">Off</option>
            <option value="true">On</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="wrap" label="Wrap lines">
            <option selected value="false">Off</option>
            <option value="true">On</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Filename">
    <p9r-comp-sync disable-others-components optionnal>
        <span slot="filename">example.ts</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Code">
    <p9r-comp-sync disable-others-components allow-multiple>
        <span>const greeting = "Hello, world!";</span>
    </p9r-comp-sync>
</p9r-section>
