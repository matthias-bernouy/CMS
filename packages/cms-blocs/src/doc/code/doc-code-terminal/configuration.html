<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="prompt" label="Prompt">
            <option selected value="dollar">Dollar ($)</option>
            <option value="hash">Hash (#)</option>
            <option value="arrow">Arrow (&gt;)</option>
            <option value="none">None</option>
        </p9r-select>
        <p9r-select name="os" label="Window style">
            <option selected value="macos">macOS</option>
            <option value="linux">Linux</option>
            <option value="windows">Windows</option>
        </p9r-select>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Title">
    <p9r-comp-sync disable-others-components optionnal>
        <span slot="title">bash</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Commands">
    <p9r-comp-sync disable-others-components allow-multiple>
        <span>npm install</span>
    </p9r-comp-sync>
</p9r-section>
