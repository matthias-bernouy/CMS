<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-segmented-switch name="variant" label="Variant" value="default">
            <option selected value="default">Default</option>
            <option value="outlined">Outlined</option>
            <option value="filled">Filled</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="size" label="Size" value="md">
            <option value="sm">S</option>
            <option selected value="md">M</option>
            <option value="lg">L</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Keys">
    <p9r-comp-sync disable-others-components allow-multiple>
        <span>Ctrl</span>
    </p9r-comp-sync>
</p9r-section>
