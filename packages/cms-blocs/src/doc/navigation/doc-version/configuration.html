<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-segmented-switch name="variant" label="Variant" value="dropdown">
            <option selected value="dropdown">Dropdown</option>
            <option value="inline">Inline</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Current version">
    <p9r-comp-sync disable-others-components>
        <span slot="current">v2.0</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Versions">
    <p9r-comp-sync allow-multiple>
        <a href="#">v2.0 (latest)</a>
    </p9r-comp-sync>
</p9r-section>
