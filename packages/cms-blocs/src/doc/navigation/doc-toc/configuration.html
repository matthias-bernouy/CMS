<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="levels" label="Heading levels">
            <option value="h2">H2 only</option>
            <option selected value="h2-h3">H2 and H3</option>
            <option value="h2-h4">H2, H3 and H4</option>
        </p9r-select>
        <p9r-segmented-switch name="sticky" label="Sticky">
            <option selected value="false">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Title">
    <p9r-comp-sync disable-others-components optionnal>
        <span slot="title">On this page</span>
    </p9r-comp-sync>
</p9r-section>
