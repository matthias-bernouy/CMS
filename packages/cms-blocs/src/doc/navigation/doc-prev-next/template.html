<nav class="wrap" part="wrap">
    <button class="pn prev" type="button" part="prev">
        <span class="arrow">&larr;</span>
        <span class="col">
            <span class="label">Previous</span>
            <span class="title"><slot name="prev-title"></slot></span>
        </span>
    </button>
    <button class="pn next" type="button" part="next">
        <span class="col end">
            <span class="label">Next</span>
            <span class="title"><slot name="next-title"></slot></span>
        </span>
        <span class="arrow">&rarr;</span>
    </button>
</nav>
