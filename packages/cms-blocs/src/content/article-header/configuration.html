<p9r-attr-sync>
    <p9r-section data-title="Layout">
        <p9r-select name="layout" label="Layout">
            <option selected value="hero">Hero (image on top)</option>
            <option value="side">Side (image right)</option>
            <option value="side-reverse">Side (image left)</option>
            <option value="cover">Cover (text over image)</option>
            <option value="minimal">Minimal (no image)</option>
        </p9r-select>
        <p9r-segmented-switch name="align" label="Text align" value="left">
            <option selected value="left">Left</option>
            <option value="center">Center</option>
        </p9r-segmented-switch>
        <p9r-select name="width" label="Max width">
            <option value="sm">Small (680)</option>
            <option selected value="md">Medium (900)</option>
            <option value="lg">Large (1100)</option>
            <option value="full">Full</option>
        </p9r-select>
        <p9r-select name="theme" label="Theme">
            <option selected value="light">Light</option>
            <option value="dark">Dark</option>
        </p9r-select>
    </p9r-section>
    <p9r-section data-title="Image">
        <p9r-select name="ratio" label="Image ratio">
            <option selected value="16/9">16 / 9</option>
            <option value="3/2">3 / 2</option>
            <option value="4/3">4 / 3</option>
            <option value="21/9">21 / 9</option>
            <option value="1/1">1 / 1</option>
        </p9r-select>
        <p9r-select name="overlay" label="Overlay">
            <option selected value="none">None</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
        </p9r-select>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Hero image">
    <p9r-image-sync slotTarget="image" label="Hero image" optionnal></p9r-image-sync>
</p9r-section>

<p9r-section data-title="Eyebrow">
    <p9r-comp-sync disable-others-components optionnal>
        <span slot="eyebrow">Category</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Title">
    <p9r-comp-sync disable-others-components>
        <span slot="title">Article title</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Lead">
    <p9r-comp-sync disable-others-components optionnal>
        <p slot="lead">A short lead paragraph that introduces the article and gives context in one or two sentences.</p>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Meta">
    <p9r-comp-sync disable-others-components optionnal>
        <hub-article-meta slot="meta" align="left" separator="dot" size="md"></hub-article-meta>
    </p9r-comp-sync>
</p9r-section>
