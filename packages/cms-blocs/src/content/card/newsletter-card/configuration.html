<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-segmented-switch name="tone" label="Tone" value="default">
            <option value="default">Cream</option>
            <option value="dark">Dark</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Icon">
    <p9r-comp-sync optionnal disable-others-components>
        <span slot="icon">✉️</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Title">
    <p9r-comp-sync disable-others-components>
        <p slot="title">Stay in the loop</p>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Description">
    <p9r-comp-sync optionnal disable-others-components>
        <p slot="description">Get the best new offers each week.</p>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Form">
    <p9r-comp-sync allow-multiple inline-adding>
        <base-input-email slot="form"></base-input-email>
    </p9r-comp-sync>
</p9r-section>
