<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-segmented-switch name="tone" label="Tone" value="default">
            <option value="default">Default</option>
            <option value="muted">Muted (cream)</option>
            <option value="dark">Dark</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="density" label="Density" value="regular">
            <option value="dense">Dense</option>
            <option value="regular">Regular</option>
            <option value="spacious">Spacious</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Title">
    <p9r-comp-sync optionnal disable-others-components>
        <h3 slot="title">Section title</h3>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Description">
    <p9r-comp-sync optionnal allow-multiple disable-others-components>
        <p slot="description">A short helper text describing the form section.</p>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Body">
    <p9r-comp-sync allow-multiple inline-adding></p9r-comp-sync>
</p9r-section>
