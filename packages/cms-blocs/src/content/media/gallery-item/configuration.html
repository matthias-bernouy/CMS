<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="ratio" label="Ratio">
            <option selected value="1/1">1 / 1</option>
            <option value="4/3">4 / 3</option>
            <option value="3/2">3 / 2</option>
            <option value="16/9">16 / 9</option>
            <option value="3/4">3 / 4</option>
            <option value="auto">Auto</option>
        </p9r-select>
        <p9r-segmented-switch name="shape" label="Shape" value="rounded">
            <option value="square">Square</option>
            <option selected value="rounded">Rounded</option>
            <option value="pill">Pill</option>
        </p9r-segmented-switch>
    </p9r-section>
    <p9r-section data-title="Label">
        <p9r-select name="label-position" label="Position">
            <option selected value="bottom">Overlay bottom</option>
            <option value="top">Overlay top</option>
            <option value="below">Below image</option>
        </p9r-select>
        <p9r-segmented-switch name="label-visibility" label="Visibility" value="always">
            <option selected value="always">Always</option>
            <option value="hover">On hover</option>
            <option value="off">Off</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Image">
    <p9r-image-sync slotTarget="image" label="Image"></p9r-image-sync>
</p9r-section>

<p9r-section data-title="Label">
    <p9r-comp-sync disable-others-components optionnal>
        <span slot="label">Caption</span>
    </p9r-comp-sync>
</p9r-section>
