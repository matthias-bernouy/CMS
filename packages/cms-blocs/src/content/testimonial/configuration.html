<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="variant" label="Variant">
            <option selected value="card">Card</option>
            <option value="quote">Quote</option>
            <option value="minimal">Minimal</option>
        </p9r-select>
        <p9r-select name="rating" label="Rating">
            <option value="0">None</option>
            <option value="1">1 / 5</option>
            <option value="2">2 / 5</option>
            <option value="3">3 / 5</option>
            <option value="4">4 / 5</option>
            <option selected value="5">5 / 5</option>
        </p9r-select>
        <p9r-segmented-switch name="align" label="Alignment" value="left">
            <option selected value="left">Left</option>
            <option value="center">Center</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="show-mark" label="Show quote mark" value="true">
            <option selected value="true">True</option>
            <option value="false">False</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Quote">
    <p9r-comp-sync allow-multiple>
        <p slot="quote">This product changed the way we work. Truly indispensable.</p>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Avatar">
    <p9r-image-sync slotTarget="avatar" label="Avatar" optionnal></p9r-image-sync>
</p9r-section>

<p9r-section data-title="Person">
    <p9r-comp-sync disable-others-components>
        <span slot="name">Jane Doe</span>
    </p9r-comp-sync>
    <p9r-comp-sync disable-others-components optionnal>
        <span slot="role">Product Manager, Acme</span>
    </p9r-comp-sync>
</p9r-section>
