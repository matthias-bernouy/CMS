<p9r-attr-sync>
    <p9r-section data-title="Behavior">
        <p9r-select name="decimals" label="Decimals">
            <option selected value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
        </p9r-select>
        <p9r-select name="duration" label="Animation speed">
            <option value="800">Fast</option>
            <option selected value="1600">Normal</option>
            <option value="2400">Slow</option>
            <option value="0">None</option>
        </p9r-select>
    </p9r-section>
    <p9r-section data-title="Style">
        <p9r-select name="variant" label="Variant">
            <option selected value="default">Default</option>
            <option value="card">Card</option>
            <option value="accent">Accent</option>
        </p9r-select>
        <p9r-select name="size" label="Size">
            <option value="sm">Small</option>
            <option selected value="md">Medium</option>
            <option value="lg">Large</option>
            <option value="xl">Extra large</option>
        </p9r-select>
        <p9r-segmented-switch name="align" label="Alignment" value="left">
            <option selected value="left">Left</option>
            <option value="center">Center</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Value">
    <p9r-comp-sync disable-others-components>
        <span slot="value">1250</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Prefix" data-collapsed>
    <p9r-comp-sync disable-others-components optionnal>
        <span slot="prefix">$</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Suffix" data-collapsed>
    <p9r-comp-sync disable-others-components optionnal>
        <span slot="suffix">+</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Label">
    <p9r-comp-sync disable-others-components>
        <span slot="label">Active users</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Trend" data-collapsed>
    <p9r-comp-sync disable-others-components optionnal>
        <span slot="trend">+12</span>
    </p9r-comp-sync>
</p9r-section>
