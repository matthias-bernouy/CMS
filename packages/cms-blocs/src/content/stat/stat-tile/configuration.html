<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-segmented-switch name="tone" label="Tone" value="default">
            <option value="default">Default (light)</option>
            <option value="inverted">Inverted (on dark)</option>
            <option value="accent">Accent (lime)</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="size" label="Size" value="md">
            <option value="sm">Small</option>
            <option value="md">Medium</option>
            <option value="lg">Large</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="align" label="Alignment" value="center">
            <option value="left">Left</option>
            <option value="center">Center</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Value">
    <p9r-comp-sync disable-others-components>
        <span slot="value">0</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Label">
    <p9r-comp-sync disable-others-components>
        <span slot="label">label</span>
    </p9r-comp-sync>
</p9r-section>
