<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="variant" label="Variant">
            <option selected value="default">Default</option>
            <option value="outlined">Outlined</option>
            <option value="filled">Filled</option>
            <option value="ghost">Ghost</option>
        </p9r-select>
        <p9r-select name="theme" label="Theme">
            <option selected value="light">Light</option>
            <option value="dark">Dark</option>
        </p9r-select>
        <p9r-select name="size" label="Size">
            <option value="sm">Small</option>
            <option selected value="md">Medium</option>
            <option value="lg">Large</option>
        </p9r-select>
        <p9r-segmented-switch name="layout" label="Layout" value="row">
            <option selected value="row">Row</option>
            <option value="stacked">Stacked</option>
        </p9r-segmented-switch>
    </p9r-section>
    <p9r-section data-title="Avatar">
        <p9r-select name="color" label="Color">
            <option selected value="auto">Auto (from name)</option>
            <option value="indigo">Indigo</option>
            <option value="sky">Sky</option>
            <option value="emerald">Emerald</option>
            <option value="amber">Amber</option>
            <option value="rose">Rose</option>
            <option value="violet">Violet</option>
            <option value="pink">Pink</option>
            <option value="teal">Teal</option>
            <option value="slate">Slate</option>
        </p9r-select>
        <p9r-segmented-switch name="avatar-shape" label="Shape" value="pill">
            <option selected value="pill">Pill</option>
            <option value="square">Square</option>
        </p9r-segmented-switch>
    </p9r-section>
    <p9r-section data-title="Link">
        <p9r-link name="href" label="Target page"></p9r-link>
        <p9r-select name="target" label="Open in">
            <option selected value="_self">Same tab</option>
            <option value="_blank">New tab</option>
        </p9r-select>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Avatar image">
    <p9r-image-sync slotTarget="avatar" label="Avatar image (overrides initials)" optionnal></p9r-image-sync>
</p9r-section>

<p9r-section data-title="Name">
    <p9r-comp-sync disable-others-components>
        <span slot="name">Person name</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Subtitle">
    <p9r-comp-sync disable-others-components optionnal>
        <span slot="subtitle">Role or description</span>
    </p9r-comp-sync>
</p9r-section>
