<p9r-state-sync>
    <p9r-state name="open" label="Pin open">
        <option selected value="">Closed</option>
        <option value="true">Open</option>
    </p9r-state>
</p9r-state-sync>

<p9r-section data-title="Trigger initials">
    <p9r-comp-sync disable-others-components>
        <span slot="initials">MA</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Trigger name">
    <p9r-comp-sync disable-others-components>
        <span slot="name">user.name</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Header caption">
    <p9r-comp-sync disable-others-components>
        <span slot="caption">Logged in as</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Display name">
    <p9r-comp-sync disable-others-components>
        <span slot="display-name">user.name</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Role badge">
    <p9r-comp-sync optionnal disable-others-components>
        <span slot="role">Player</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Menu items">
    <p9r-comp-sync allow-multiple inline-adding>
        <a slot="items" href="#">Item</a>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Logout link">
    <p9r-comp-sync>
        <a slot="logout" href="#logout">Sign out</a>
    </p9r-comp-sync>
</p9r-section>
