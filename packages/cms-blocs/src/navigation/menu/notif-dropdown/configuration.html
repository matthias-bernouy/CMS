<p9r-state-sync>
    <p9r-state name="open" label="Pin open">
        <option selected value="">Closed</option>
        <option value="true">Open</option>
    </p9r-state>
</p9r-state-sync>

<p9r-section data-title="Title">
    <p9r-comp-sync disable-others-components>
        <span slot="title">Notifications</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Empty state text">
    <p9r-comp-sync disable-others-components>
        <span slot="empty">No notification</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Unread count badge">
    <p9r-comp-sync optionnal disable-others-components>
        <span slot="count">3</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Notifications">
    <p9r-comp-sync optionnal allow-multiple inline-adding></p9r-comp-sync>
</p9r-section>
