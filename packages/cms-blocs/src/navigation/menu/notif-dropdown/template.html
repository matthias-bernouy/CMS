<div class="wrap" part="wrap">
    <button class="trigger" part="trigger" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="badge" part="badge"><slot name="count"></slot></span>
    </button>

    <div class="panel" part="panel" role="dialog">
        <header class="head" part="head">
            <slot name="title">Notifications</slot>
        </header>
        <div class="body" part="body">
            <slot name="empty">No notification</slot>
            <slot></slot>
        </div>
    </div>
</div>
