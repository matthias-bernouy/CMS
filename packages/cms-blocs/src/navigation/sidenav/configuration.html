<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="variant" label="Theme">
            <option selected value="light">Light</option>
            <option value="dark">Dark</option>
        </p9r-select>
        <p9r-segmented-switch name="position" label="Side" value="left">
            <option selected value="left">Left</option>
            <option value="right">Right</option>
        </p9r-segmented-switch>
    </p9r-section>
    <p9r-section data-title="Behavior">
        <p9r-segmented-switch name="sticky" label="Sticky on scroll">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="collapsible" label="Desktop collapse button">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="collapsed" label="Start collapsed">
            <option selected value="">No</option>
            <option value="true">Yes</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Brand">
    <p9r-image-sync slotTarget="brand" label="Logo" accept="image/*" default="https://placehold.co/180x60" optionnal></p9r-image-sync>
</p9r-section>

<p9r-section data-title="Body">
    <p9r-comp-sync allow-multiple>
        <hub-sidenav-section></hub-sidenav-section>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Footer" data-collapsed>
    <p9r-comp-sync allow-multiple optionnal>
        <hub-sidenav-item slot="footer"></hub-sidenav-item>
    </p9r-comp-sync>
</p9r-section>
