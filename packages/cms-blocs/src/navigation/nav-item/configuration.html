<p9r-state-sync target=".item" attr="class" value="is-open" label="Dropdown open"></p9r-state-sync>

<p9r-attr-sync>
    <p9r-section data-title="Link" data-collapsed>
        <p9r-link name="href" label="Target page"></p9r-link>
        <p9r-select name="target" label="Open in">
            <option selected value="_self">Same tab</option>
            <option value="_blank">New tab</option>
        </p9r-select>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Label">
    <p9r-comp-sync disable-others-components>
        <span slot="label">Menu</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Dropdown items">
    <p9r-comp-sync allow-multiple optionnal>
        <hub-button slot="items" variant="ghost" size="sm" width="full" align="left"></hub-button>
    </p9r-comp-sync>
</p9r-section>
