<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="variant" label="Theme">
            <option selected value="light">Light</option>
            <option value="dark">Dark</option>
        </p9r-select>
        <p9r-select name="sticky" label="Sticky">
            <option selected value="no">No</option>
            <option value="yes">Yes</option>
        </p9r-select>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Brand">
    <p9r-image-sync default="https://placehold.co/180x90" slotTarget="logo"></p9r-image-sync>
</p9r-section>

<p9r-section data-title="Links">
    <p9r-comp-sync allow-multiple optionnal>
        <base-nav-item></base-nav-item>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Call to action">
    <p9r-comp-sync optionnal allow-multiple>
        <base-button slot="cta"></base-button>
    </p9r-comp-sync>
</p9r-section>
