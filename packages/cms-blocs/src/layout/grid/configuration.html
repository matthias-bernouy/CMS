<p9r-attr-sync>
    <p9r-section data-title="Layout">
        <p9r-select name="min" label="Min item width">
            <option value="xs">Extra small (160px)</option>
            <option value="sm">Small (200px)</option>
            <option selected value="md">Medium (260px)</option>
            <option value="lg">Large (340px)</option>
            <option value="xl">Extra large (420px)</option>
        </p9r-select>
        <p9r-select name="max" label="Max item width">
            <option selected value="">None</option>
            <option value="sm">Small (240px)</option>
            <option value="md">Medium (320px)</option>
            <option value="lg">Large (400px)</option>
            <option value="xl">Extra large (500px)</option>
        </p9r-select>
        <p9r-select name="gap" label="Gap">
            <option value="xs">Extra small</option>
            <option value="sm">Small</option>
            <option selected value="md">Medium</option>
            <option value="lg">Large</option>
            <option value="xl">Extra large</option>
        </p9r-select>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Content">
    <p9r-comp-sync allow-multiple>
        <hub-card></hub-card>
        <hub-card></hub-card>
        <hub-card></hub-card>
    </p9r-comp-sync>
</p9r-section>
