<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-segmented-switch name="tone" label="Tone" value="default">
            <option value="default">Default (orange)</option>
            <option value="cream">Cream</option>
            <option value="white">White</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="align" label="Alignment" value="center">
            <option value="center">Center</option>
            <option value="left">Left</option>
        </p9r-segmented-switch>
        <p9r-segmented-switch name="density" label="Padding" value="default">
            <option value="compact">Compact</option>
            <option value="default">Default</option>
            <option value="spacious">Spacious</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Eyebrow">
    <p9r-comp-sync optionnal disable-others-components>
        <span slot="eyebrow">EYEBROW</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Title">
    <p9r-comp-sync disable-others-components>
        <h1 slot="title">Hero title</h1>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Subtitle">
    <p9r-comp-sync optionnal allow-multiple disable-others-components>
        <p slot="subtitle">A short paragraph that introduces the page.</p>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Bottom (CTAs / search / etc.)">
    <p9r-comp-sync optionnal allow-multiple inline-adding>
        <base-button slot="bottom"></base-button>
    </p9r-comp-sync>
</p9r-section>
