<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="color" label="Color">
            <option selected value="primary">Primary</option>
            <option value="success">Success</option>
            <option value="warning">Warning</option>
            <option value="danger">Danger</option>
            <option value="info">Info</option>
            <option value="neutral">Neutral</option>
            <option value="dark">Dark</option>
        </p9r-select>
        <p9r-select name="variant" label="Variant">
            <option selected value="primary">Primary</option>
            <option value="secondary">Secondary</option>
            <option value="ghost">Ghost</option>
        </p9r-select>
        <p9r-select name="size" label="Size">
            <option value="xs">Extra small</option>
            <option value="sm">Small</option>
            <option selected value="md">Medium</option>
            <option value="lg">Large</option>
            <option value="xl">Extra large</option>
        </p9r-select>
        <p9r-select name="width" label="Width">
            <option selected value="auto">Auto</option>
            <option value="full">Full (fill parent)</option>
        </p9r-select>
        <p9r-segmented-switch name="align" label="Alignment" value="center">
            <option value="left">Left</option>
            <option value="center">Center</option>
            <option value="right">Right</option>
        </p9r-segmented-switch>
    </p9r-section>
    <p9r-section data-title="Link">
        <p9r-link name="href" label="Target page"></p9r-link>
        <p9r-select name="target" label="Open in">
            <option selected value="_self">Same tab</option>
            <option value="_blank">New tab</option>
        </p9r-select>
        <p9r-segmented-switch name="disabled" label="Disabled">
            <option selected value="">False</option>
            <option value="true">True</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Label">
    <p9r-comp-sync disable-others-components>
        <span>Click me</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Icons" data-collapsed>
    <p9r-image-sync slotTarget="icon-left" label="Left Icon"></p9r-image-sync>
    <p9r-image-sync slotTarget="icon-right" label="Right Icon"></p9r-image-sync>
</p9r-section>
