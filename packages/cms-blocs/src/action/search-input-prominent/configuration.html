<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-segmented-switch name="size" label="Size" value="md">
            <option value="md">Medium</option>
            <option value="lg">Large</option>
        </p9r-segmented-switch>
    </p9r-section>

    <p9r-section data-title="Behavior">
        <p9r-comp-sync optionnal disable-others-components>
            <span data-attr-target-name="placeholder">Search a racket by brand or model…</span>
        </p9r-comp-sync>
    </p9r-section>
</p9r-attr-sync>
