<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-segmented-switch name="tone" label="Tone" value="default">
            <option value="default">Orange</option>
            <option value="dark">Dark</option>
            <option value="lime">Lime</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Title">
    <p9r-comp-sync disable-others-components>
        <h2 slot="title">Search title</h2>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Description">
    <p9r-comp-sync optionnal allow-multiple disable-others-components>
        <p slot="description">A short helper text below the title.</p>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Search input">
    <p9r-comp-sync>
        <base-search-input-prominent slot="search"></base-search-input-prominent>
    </p9r-comp-sync>
</p9r-section>
