<p9r-attr-sync>
    <p9r-section data-title="Layout">
        <p9r-segmented-switch name="align" label="Alignment" value="left">
            <option selected value="left">Left</option>
            <option value="center">Center</option>
            <option value="right">Right</option>
            <option value="between">Spread</option>
        </p9r-segmented-switch>
        <p9r-select name="separator" label="Separator">
            <option selected value="none">None</option>
            <option value="dot">Dot</option>
            <option value="pipe">Pipe</option>
        </p9r-select>
        <p9r-segmented-switch name="size" label="Size" value="md">
            <option value="sm">S</option>
            <option selected value="md">M</option>
            <option value="lg">L</option>
        </p9r-segmented-switch>
        <p9r-select name="theme" label="Theme">
            <option selected value="light">Light</option>
            <option value="dark">Dark</option>
        </p9r-select>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Author">
    <p9r-comp-sync disable-others-components optionnal>
        <base-person-chip slot="author" variant="ghost" size="sm" color="auto">
            <span slot="name">Author Name</span>
        </base-person-chip>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Date">
    <p9r-comp-sync disable-others-components optionnal>
        <span slot="date">Date</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Badges">
    <p9r-comp-sync allow-multiple>
        <div slot="badges"></div>
    </p9r-comp-sync>
</p9r-section>
