<p9r-attr-sync>
    <p9r-section data-title="Layout">
        <p9r-segmented-switch name="align" label="Alignment" value="left">
            <option value="left">Left</option>
            <option value="center">Center</option>
            <option value="right">Right</option>
        </p9r-segmented-switch>
        <p9r-select name="size" label="Size">
            <option value="sm">Small</option>
            <option selected value="md">Medium</option>
            <option value="lg">Large</option>
        </p9r-select>
        <p9r-segmented-switch name="tone" label="Tone" value="default">
            <option value="default">Default</option>
            <option value="inverted">Inverted (on dark)</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-section data-title="Eyebrow">
    <p9r-comp-sync optionnal disable-others-components>
        <span slot="eyebrow">CATEGORY</span>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Title">
    <p9r-comp-sync disable-others-components>
        <h2 slot="title">Section title</h2>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Subtitle">
    <p9r-comp-sync optionnal allow-multiple disable-others-components>
        <p slot="subtitle">A short paragraph that introduces the section.</p>
    </p9r-comp-sync>
</p9r-section>
