<p9r-section data-title="Title">
    <p9r-comp-sync disable-others-components>
        <h1 slot="title">Page title</h1>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Meta">
    <p9r-comp-sync optionnal disable-others-components>
        <p slot="meta">Inline metadata</p>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Controls">
    <p9r-comp-sync optionnal allow-multiple inline-adding>
        <base-select slot="controls"></base-select>
    </p9r-comp-sync>
</p9r-section>
