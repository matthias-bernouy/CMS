<p9r-section data-title="Title">
    <p9r-comp-sync disable-others-components>
        <h1 slot="title">Page title</h1>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Subtitle">
    <p9r-comp-sync optionnal allow-multiple disable-others-components>
        <p slot="subtitle">A short helper text below the title.</p>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Actions">
    <p9r-comp-sync optionnal allow-multiple inline-adding>
        <base-button slot="actions"></base-button>
    </p9r-comp-sync>
</p9r-section>
