<header class="topbar">
    <div class="start">
        <a class="back" href="#">
            <span class="chevron">‹</span>
            <span>Pages</span>
        </a>
        <div class="divider"></div>
        <div class="title">
            <span class="name">Pricing</span>
            <span class="path">/pricing</span>
        </div>
    </div>
    <div class="center">
        <div class="segmented" aria-label="Viewport">
            <button class="active" type="button" data-viewport="desktop" aria-pressed="true">Desktop</button>
            <button type="button" data-viewport="tablet" aria-pressed="false">Tablet</button>
            <button type="button" data-viewport="mobile" aria-pressed="false">Mobile</button>
        </div>
        <div class="segmented mode-switch" aria-label="Editor mode">
            <button class="active" type="button" data-editor-mode="edit" aria-pressed="true">Edit</button>
            <button type="button" data-editor-mode="view" aria-pressed="false">View</button>
        </div>
    </div>
    <div class="end">
        <span class="save-state"><span class="dot"></span>Saved</span>
        <button type="button">Preview</button>
        <button class="primary" type="button">Publish</button>
    </div>
</header>
