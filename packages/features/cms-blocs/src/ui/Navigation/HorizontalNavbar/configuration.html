<p9r-attr-sync>
    <p9r-section data-title="Style">
        <p9r-select name="variant" label="Variant">
            <option selected value="background">Background</option>
            <option value="surface">Surface</option>
            <option value="primary">Primary</option>
            <option value="secondary">Secondary</option>
        </p9r-select>
        <p9r-segmented-switch name="sticky" label="Sticky">
            <option selected value="">No</option>
            <option value="yes">Yes</option>
        </p9r-segmented-switch>
    </p9r-section>
</p9r-attr-sync>

<p9r-state-sync target=".navbar" attr="class" value="is-open" label="Preview mobile menu"></p9r-state-sync>

<p9r-section data-title="Logo">
    <p9r-image-sync slotTarget="logo" label="Logo" optionnal default="https://placehold.co/160x48"></p9r-image-sync>
</p9r-section>

<p9r-section data-title="Links">
    <p9r-comp-sync allow-multiple optionnal>
        <base-nav-item></base-nav-item>
    </p9r-comp-sync>
</p9r-section>

<p9r-section data-title="Actions" data-collapsed>
    <p9r-comp-sync allow-multiple optionnal>
        <base-button slot="actions">Action</base-button>
    </p9r-comp-sync>
</p9r-section>
