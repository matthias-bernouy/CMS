<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>No access</title>
    <link rel="stylesheet" href="{{BASE_PATH}}/assets/control-styles.css">
    <script src="{{BASE_PATH}}/assets/control-components.js"></script>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
               background: var(--bg-base, #f6f6f6); font-family: var(--font-body, system-ui, sans-serif); }
        .shell { width: 380px; max-width: 100%; }
        .title { margin: 0; font-size: 1.25rem; font-weight: 600; color: var(--text-main, #1e293b); }
        .hint { margin: 0; color: var(--text-muted, #64748b); font-size: .9rem; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="shell">
        <p9r-card>
            <p9r-stack gap="md" align="center">
                <h1 class="title">No access</h1>
                <p class="hint">You're signed in, but your account doesn't have admin access to this space.</p>
                <a href="{{LOGOUT_URL}}">
                    <p9r-button color="primary">Sign out</p9r-button>
                </a>
            </p9r-stack>
        </p9r-card>
    </div>
</body>
</html>
