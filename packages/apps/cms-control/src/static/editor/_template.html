<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS — Editor</title>

    <meta name="basePath" content="{{BASE_PATH}}">

    <!-- The site's own theme.css. Loaded at document scope so the user's
         design tokens cascade into the slotted preview content. The editor
         chrome (cms-bloc-actions, cms-bloc-library, cms-floating-toolbar,
         …) carries its own admin tokens inside the EditorRoot shadow, so
         no admin stylesheet leaks into the page being edited. -->
    <link rel="stylesheet" href="{{BASE_PATH}}/.cms/style">

    <script src="{{BASE_PATH}}/assets/control-components.js"></script>
</head>
<body>
    {{CONTENT}}
</body>
</html>
