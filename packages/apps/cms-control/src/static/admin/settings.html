<w13c-fixed-admin-layout>
    <span slot="title">Settings</span>

    <p9r-container size="md">
        <p9r-tabs active="general">

            <p9r-tab-panel id="general" label="General">
                <div cms-source="{{BASE_PATH}}/api/system/settings" cms-reload-on="settings:saved">
                    <template>
                        <cms-form id="settings-form" target="{{BASE_PATH}}/api/system/settings" emit="settings:saved">
                            <p9r-stack gap="lg">
                                <p9r-card>
                                    <span slot="header">Site</span>
                                    <p9r-stack gap="md">
                                        <p9r-input name="site.name"    label="Site name"   value="{{ site.name }}"    placeholder="My Website"></p9r-input>
                                        <p9r-input name="site.host"    label="Host"        value="{{ site.host }}"    placeholder="https://example.com"></p9r-input>
                                        <cms-media-input name="site.favicon" label="Favicon" value="{{ site.favicon }}" types="image" size="128"></cms-media-input>
                                        <p9r-select name="site.language" label="Language" value="{{ site.language }}">
                                            <option value="">— Default —</option>
                                            <option value="en">English</option>
                                            <option value="fr">Français</option>
                                            <option value="de">Deutsch</option>
                                            <option value="es">Español</option>
                                            <option value="pt">Português</option>
                                            <option value="it">Italiano</option>
                                            <option value="nl">Nederlands</option>
                                            <option value="pl">Polski</option>
                                            <option value="ja">日本語</option>
                                            <option value="zh">中文</option>
                                        </p9r-select>
                                        <p9r-select name="site.notFound" label="404 page" value="{{ site.notFound.path }}">
                                            <option value="">— None —</option>
                                            <option cms-repeat="pages" value="{{ path }}">{{ title }}</option>
                                        </p9r-select>
                                        <p9r-select name="site.serverError" label="500 page" value="{{ site.serverError.path }}">
                                            <option value="">— None —</option>
                                            <option cms-repeat="pages" value="{{ path }}">{{ title }}</option>
                                        </p9r-select>
                                    </p9r-stack>
                                </p9r-card>

                                <p9r-card>
                                    <span slot="header">Editor</span>
                                    <p9r-select name="editor.layoutCategory" label="Layout category" value="{{ editor.layoutCategory }}">
                                        <option value="">— None —</option>
                                        <option cms-repeat="layoutCategories" value="{{value}}">{{value}}</option>
                                    </p9r-select>
                                </p9r-card>

                                <p9r-card>
                                    <span slot="header">Theme CSS</span>
                                    <p9r-textarea name="site.theme" rows="16" autosize value="{{ site.theme }}" placeholder="/* your CSS */"></p9r-textarea>
                                </p9r-card>

                                <p9r-stack direction="row" justify="end">
                                    <p9r-button type="submit" color="primary">Save</p9r-button>
                                </p9r-stack>
                            </p9r-stack>
                        </cms-form>
                    </template>
                </div>
            </p9r-tab-panel>

            <p9r-tab-panel id="secrets" label="Secrets">
                <cms-secrets api="{{BASE_PATH}}/api/secrets"></cms-secrets>
            </p9r-tab-panel>

            <p9r-tab-panel id="identity" label="Identity">
                <p9r-stack gap="lg">
                    <p9r-stack direction="row" justify="end">
                        <p9r-open-modal modal-target="add-idp-modal">
                            <p9r-button color="primary">+ Add provider</p9r-button>
                        </p9r-open-modal>
                    </p9r-stack>

                    <p9r-table cms-source="{{BASE_PATH}}/api/identity/providers" cms-reload-on="idp:changed">
                        <p9r-row slot="header">
                            <p9r-cell><strong>Provider</strong></p9r-cell>
                            <p9r-cell><strong>Kind</strong></p9r-cell>
                            <p9r-cell><strong>Manage</strong></p9r-cell>
                        </p9r-row>

                        <p9r-row cms-repeat=".">
                            <p9r-cell><strong>{{ displayName }}</strong></p9r-cell>
                            <p9r-cell><p9r-tag>{{ kind }}</p9r-tag></p9r-cell>
                            <p9r-cell>
                                <cms-provider-actions provider-id="{{ id }}" kind="{{ kind }}" enabled="{{ enabled }}" base-url="{{BASE_PATH}}/api/identity/provider" emit="idp:changed"></cms-provider-actions>
                                <p9r-modal id="edit-{{ id }}" aria-label="Edit provider">
                                    <span slot="title">Edit provider</span>
                                    <cms-form target="{{BASE_PATH}}/api/identity/provider" method="PATCH" emit="idp:changed">
                                        <p9r-stack gap="md">
                                            <input type="hidden" name="id" value="{{ id }}">
                                            <p9r-input name="displayName" label="Name" value="{{ displayName }}"></p9r-input>
                                            <p9r-input name="issuer" label="Issuer URL" value="{{ issuer }}"></p9r-input>
                                            <p9r-input name="clientId" label="Client ID" value="{{ clientId }}"></p9r-input>
                                            <cms-credential-select name="clientSecretRef" label="Client secret" value="{{ clientSecretRef }}" api="{{BASE_PATH}}/api/secrets"></cms-credential-select>
                                            <p9r-input name="scopes" label="Scopes" value="{{ scopes }}"></p9r-input>
                                            <p9r-button type="submit" color="primary" fullWidth>Save</p9r-button>
                                        </p9r-stack>
                                    </cms-form>
                                </p9r-modal>
                            </p9r-cell>
                        </p9r-row>

                        <cms-empty-state cms-slot="empty">
                            <p slot="title">No providers</p>
                            <p slot="hint">The local email/password provider is seeded at provisioning; add Google/OIDC for more.</p>
                        </cms-empty-state>
                    </p9r-table>
                </p9r-stack>
            </p9r-tab-panel>

        </p9r-tabs>
    </p9r-container>
</w13c-fixed-admin-layout>

<p9r-modal id="add-idp-modal" aria-label="Add identity provider">
    <span slot="title">Add identity provider</span>
    <cms-form target="{{BASE_PATH}}/api/identity/provider" emit="idp:changed">
        <p9r-stack gap="md">
            <input type="hidden" name="kind" value="oidc">
            <p9r-input name="displayName" label="Name" placeholder="Google"></p9r-input>
            <p9r-input name="issuer" label="Issuer URL" placeholder="https://accounts.google.com"></p9r-input>
            <p9r-input name="clientId" label="Client ID" placeholder="xxxx.apps.googleusercontent.com"></p9r-input>
            <cms-credential-select name="clientSecretRef" label="Client secret" api="{{BASE_PATH}}/api/secrets"></cms-credential-select>
            <p9r-input name="scopes" label="Scopes" value="openid email profile"></p9r-input>
            <p9r-button color="primary" fullWidth type="submit">Add provider</p9r-button>
        </p9r-stack>
    </cms-form>
</p9r-modal>
