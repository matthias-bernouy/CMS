<w13c-fixed-admin-layout>
    <span slot="title">Gateway</span>
    <p9r-open-modal modal-target="create-provider-modal" slot="action">
        <p9r-button color="primary">+ New provider</p9r-button>
    </p9r-open-modal>

    <p9r-table>
        <p9r-row slot="header">
            <p9r-cell><strong>Name</strong></p9r-cell>
            <p9r-cell><strong>URN</strong></p9r-cell>
            <p9r-cell><strong>Endpoints</strong></p9r-cell>
            <p9r-cell></p9r-cell>
        </p9r-row>

        <cms-fetch url="{{BASE_PATH}}/api/gateway-provider/list" reload-on="provider:updated">
            <template for=".">
                <p9r-row>
                    <p9r-cell><strong>{{ name }}</strong></p9r-cell>
                    <p9r-cell><code>{{ urn }}</code></p9r-cell>
                    <p9r-cell>{{ endpointCount }}</p9r-cell>
                    <p9r-cell>
                        <cms-confirm-form target="{{BASE_PATH}}/api/gateway-provider?urn={{ urn }}" method="DELETE" emit="provider:updated" message="Delete this provider? Its endpoints are removed. This cannot be undone.">
                            <p9r-button color="danger" variant="ghost">Delete</p9r-button>
                        </cms-confirm-form>
                    </p9r-cell>
                </p9r-row>
            </template>
            <template slot="empty">
                <cms-empty-state>
                    <svg slot="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 22v-5" />
                        <path d="M9 8V2" />
                        <path d="M15 8V2" />
                        <path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z" />
                    </svg>
                    <p slot="title">No gateway providers yet</p>
                    <p slot="hint">Register an external API as a provider to proxy it through Delivery.</p>
                </cms-empty-state>
            </template>
        </cms-fetch>
    </p9r-table>
</w13c-fixed-admin-layout>

<p9r-modal id="create-provider-modal" aria-label="Create a new gateway provider" style="--p9r-modal-width: 720px;">
    <span slot="title">New provider</span>
    <cms-form target="{{BASE_PATH}}/api/gateway-provider" method="POST" emit="provider:updated">
        <p9r-stack gap="m">
            <p9r-input name="id" label="Identifier" placeholder="shop"
                hint="Lowercase letters, numbers and dashes. Immutable after creation."></p9r-input>
            <p9r-input name="meta.name" label="Name" placeholder="Shop API"></p9r-input>
            <p9r-textarea name="meta.description" label="Description" placeholder="What this provider exposes…"></p9r-textarea>

            <p9r-divider></p9r-divider>
            <strong>Endpoints</strong>
            <cms-endpoints-input></cms-endpoints-input>

            <p9r-button color="primary" fullWidth type="submit">Create provider</p9r-button>
        </p9r-stack>
    </cms-form>
</p9r-modal>
