<hub-page>
    <h1 slot="title">Dashboard</h1>
    <p slot="title">Registry of the platform's namespaces and tenant-provisioners.</p>

    <hub-grid>
        <w13c-fetch url="/api/namespaces">
            <template>
                <hub-stat href="{{BASE_PATH}}/namespaces/" label="Namespaces" sub="→ Manage">{{ data.namespaces.length }}</hub-stat>
            </template>
        </w13c-fetch>
        <w13c-fetch url="/api/providers">
            <template>
                <hub-stat href="{{BASE_PATH}}/providers/" label="Tenant-provisioners" sub="→ Manage">{{ data.providers.length }}</hub-stat>
            </template>
        </w13c-fetch>
    </hub-grid>

    <hub-section label="Hub-issuer">
        <w13c-fetch url="/api/issuer">
            <template>
                <p9r-card>
                    <p9r-stack gap="s">
                        <div><strong>iss:</strong> <hub-code>{{ data.iss }}</hub-code></div>
                        <div><strong>JWKS:</strong> <hub-code>{{ data.jwksUrl }}</hub-code></div>
                        <p9r-alert type="info">
                            Before importing a tenant-provisioner, configure its
                            <hub-code>allowlist</hub-code> so it trusts this hub as control-plane:
                            <hub-code>{ "iss": "{{ data.iss }}", "role": "control-plane" }</hub-code>.
                        </p9r-alert>
                    </p9r-stack>
                </p9r-card>
            </template>
        </w13c-fetch>
    </hub-section>
</hub-page>
