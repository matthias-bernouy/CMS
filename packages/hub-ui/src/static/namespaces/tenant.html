<hub-route-param param="namespaceId" target=".hub-ns-id"></hub-route-param>
<hub-route-param param="tenantId" target=".hub-tenant-id"></hub-route-param>

<hub-page>
    <p9r-breadcrumb slot="title">
        <a href="{{BASE_PATH}}/namespaces/">Namespaces</a>
        <a href="{{BASE_PATH}}/namespaces/namespace?namespaceId=__NAMESPACEID__" class="hub-ns-id"></a>
        <span class="hub-tenant-id"></span>
    </p9r-breadcrumb>
    <h1 slot="title">Tenant — <span class="hub-tenant-id"></span></h1>

    <w13c-form slot="actions" target="/api/namespaces/tenants?force=true" method="DELETE" emit="tenant:removed" redirect="{{BASE_PATH}}/namespaces/namespace?namespaceId=__NAMESPACEID__">
        <p9r-button color="danger" variant="ghost" type="submit">Remove tenant</p9r-button>
    </w13c-form>

    <p9r-tabs active="config">
        <p9r-tab-panel id="config" label="Config">
            <hub-hint>Per-tenant configuration validated against the data-provider's schema.</hub-hint>
            <hub-tenant-config-form></hub-tenant-config-form>
        </p9r-tab-panel>

        <p9r-tab-panel id="issuers" label="Issuers">
            <hub-hint>Trusted issuers granted tenant access on the data-provider. The list may be empty.</hub-hint>
            <hub-tenant-issuers></hub-tenant-issuers>
        </p9r-tab-panel>

        <p9r-tab-panel id="infos" label="Infos">
            <w13c-fetch url="/api/namespaces/tenants" reload-on="tenant:updated">
                <template>
                    <p9r-card>
                        <p9r-stack gap="s">
                            <div><strong>tenantId:</strong> <hub-code>{{ data.tenantId }}</hub-code></div>
                            <div><strong>namespace:</strong> {{ data.namespaceId }}</div>
                            <div><strong>data-provider:</strong> {{ data.providerId }}</div>
                            <div><strong>display name:</strong> {{ data.displayName }}</div>
                            <div><strong>status:</strong> {{ data.status }}</div>
                            <div><strong>activated:</strong> {{ data.activatedAt }}</div>
                        </p9r-stack>
                    </p9r-card>
                </template>
                <template slot="error"><p9r-alert type="error">Tenant not found.</p9r-alert></template>
            </w13c-fetch>
        </p9r-tab-panel>

        <p9r-tab-panel id="logs" label="Logs">
            <hub-hint>Logs emitted by the data-provider for this tenant.</hub-hint>
            <hub-logs src="/api/namespaces/tenants/logs"></hub-logs>
        </p9r-tab-panel>

        <p9r-tab-panel id="quotas" label="Quotas">
            <p9r-alert type="info">Quotas — coming later.</p9r-alert>
        </p9r-tab-panel>
    </p9r-tabs>
</hub-page>
