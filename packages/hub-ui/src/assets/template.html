<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Admin</title>
    <meta name="basePath" content="{{BASE_PATH}}">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="{{BASE_PATH}}/assets/style.css">
    <link rel="stylesheet" href="{{BASE_PATH}}/assets/hub-ui.css">
    <script src="{{BASE_PATH}}/assets/ui.js"></script>
    <script src="{{BASE_PATH}}/assets/hub-components.js"></script>
</head>
<body>
    <w13c-left-menu-layout>

        <w13c-lateral-menu slot="sidebar">
            <h2 slot="header">Hub Admin</h2>

            <w13c-lateral-menu-item href="{{BASE_PATH}}/">
                <svg slot="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="9"/>
                    <rect x="14" y="3" width="7" height="5"/>
                    <rect x="14" y="12" width="7" height="9"/>
                    <rect x="3" y="16" width="7" height="5"/>
                </svg>
                Dashboard
            </w13c-lateral-menu-item>

            <w13c-lateral-menu-item href="{{BASE_PATH}}/namespaces/">
                <svg slot="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 5h7v7H3z"/>
                    <path d="M14 5h7v7h-7z"/>
                    <path d="M3 16h7v5H3z"/>
                    <path d="M14 16h7v5h-7z"/>
                </svg>
                Namespaces
            </w13c-lateral-menu-item>

            <w13c-lateral-menu-item href="{{BASE_PATH}}/providers/">
                <svg slot="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <ellipse cx="12" cy="5" rx="9" ry="3"/>
                    <path d="M3 5v6c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
                    <path d="M3 11v6c0 1.66 4.03 3 9 3s9-1.34 9-3v-6"/>
                </svg>
                Tenant-provisioners
            </w13c-lateral-menu-item>

            <w13c-lateral-menu-item href="{{BASE_PATH}}/issuer">
                <svg slot="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                Hub-issuer
            </w13c-lateral-menu-item>

            <w13c-lateral-menu-item slot="footer" href="{{BASE_PATH}}/auth/logout">
                <svg slot="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Logout
            </w13c-lateral-menu-item>
        </w13c-lateral-menu>

        <main>{{CONTENT}}</main>

    </w13c-left-menu-layout>
</body>
</html>
