<style>
    .profil-hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 48px 24px 32px;
        border-radius: 16px;
        background: linear-gradient(180deg,
            color-mix(in srgb, var(--primary-base, #4361ee) 12%, var(--bg-surface, #fff)) 0%,
            var(--bg-surface, #fff) 100%);
        border: 1px solid var(--border-default, #e2e8f0);
    }
    .profil-name {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text-main, #1e293b);
        line-height: 1.2;
    }
    .profil-email {
        font-size: 0.875rem;
        color: var(--text-muted, #94a3b8);
    }
    .tokens-hint {
        font-size: 0.875rem;
        color: var(--text-muted, #94a3b8);
        line-height: 1.5;
        margin: 0;
    }
</style>

<cms-event-toast event="profil:updated"   message="Profile updated"  type="success"></cms-event-toast>
<cms-event-toast event="password:changed" message="Password changed" type="success"></cms-event-toast>

<w13c-fixed-admin-layout>
    <span slot="title">Profile</span>

    <cms-fetch url="{{BASE_PATH}}/api/profil">
        <template>
            <a slot="action" href="{{ logoutUrl }}">
                <p9r-button color="danger">Log out</p9r-button>
            </a>
        </template>
    </cms-fetch>

    <p9r-container size="md">
        <p9r-tabs active="profile">

            <p9r-tab-panel id="profile" label="Profile">
                <cms-fetch url="{{BASE_PATH}}/api/profil" reload-on="profil:updated">
                    <template>
                        <p9r-stack gap="lg">
                            <div class="profil-hero">
                                <p9r-avatar size="xl" color="primary" name="{{ displayName }}"></p9r-avatar>
                                <p9r-stack gap="xs" align="center">
                                    <span class="profil-name">{{ displayName }}</span>
                                    <p9r-tag color="primary">{{ roleLabel }}</p9r-tag>
                                    <span class="profil-email">{{ email }}</span>
                                </p9r-stack>
                            </div>

                            <p9r-card>
                                <span slot="header">Account</span>
                                <cms-form target="{{BASE_PATH}}/api/profil" emit="profil:updated">
                                    <p9r-stack gap="md">
                                        <p9r-input name="displayName" label="Display name" value="{{ displayName }}" placeholder="Your name"></p9r-input>
                                        <p9r-stack direction="row" justify="end">
                                            <p9r-button color="primary" type="submit">Save</p9r-button>
                                        </p9r-stack>
                                    </p9r-stack>
                                </cms-form>
                            </p9r-card>

                            <template for="passwordCard">
                                <p9r-card>
                                    <span slot="header">Password</span>
                                    <cms-form target="{{BASE_PATH}}/api/profil/password" emit="password:changed">
                                        <p9r-stack gap="md">
                                            <p9r-input name="currentPassword" type="password" label="Current password" autocomplete="current-password" required></p9r-input>
                                            <p9r-input name="newPassword" type="password" label="New password" placeholder="At least 8 characters" autocomplete="new-password" required></p9r-input>
                                            <p9r-stack direction="row" justify="end">
                                                <p9r-button color="primary" type="submit">Change password</p9r-button>
                                            </p9r-stack>
                                        </p9r-stack>
                                    </cms-form>
                                </p9r-card>
                            </template>
                        </p9r-stack>
                    </template>
                </cms-fetch>
            </p9r-tab-panel>

            <p9r-tab-panel id="tokens" label="Tokens">
                <p9r-stack gap="lg">
                    <p class="tokens-hint">
                        Bearer tokens for the CLI and server-to-server access. They authenticate as you,
                        whatever provider you log in with. Send as Authorization: Bearer &lt;token&gt;.
                    </p>

                    <p9r-stack direction="row" justify="end">
                        <p9r-open-modal modal-target="new-token-modal">
                            <p9r-button color="primary">+ New token</p9r-button>
                        </p9r-open-modal>
                    </p9r-stack>

                    <cms-fetch url="{{BASE_PATH}}/api/pats" reload-on="pat:changed">
                        <template slot="empty">
                            <cms-empty-state>
                                <svg slot="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="7.5" cy="15.5" r="5.5"/>
                                    <path d="m21 2-9.6 9.6"/>
                                    <path d="m15.5 7.5 3 3L22 7l-3-3"/>
                                </svg>
                                <p slot="title">No access tokens yet</p>
                                <p slot="hint">Create one to authenticate the CLI or server-to-server calls. The secret is shown once, at creation.</p>
                            </cms-empty-state>
                        </template>
                        <template>
                            <p9r-table>
                                <p9r-row slot="header">
                                    <p9r-cell><strong>Name</strong></p9r-cell>
                                    <p9r-cell><strong>Created</strong></p9r-cell>
                                    <p9r-cell><strong>Last used</strong></p9r-cell>
                                    <p9r-cell></p9r-cell>
                                </p9r-row>
                                <template for=".">
                                    <p9r-row>
                                        <p9r-cell><strong>{{ name }}</strong></p9r-cell>
                                        <p9r-cell>{{ createdLabel }}</p9r-cell>
                                        <p9r-cell>{{ lastUsedLabel }}</p9r-cell>
                                        <p9r-cell>
                                            <cms-confirm-form target="{{BASE_PATH}}/api/pats?id={{ id }}" method="DELETE" emit="pat:changed" message="Revoke this token? Any client using it stops working immediately.">
                                                <p9r-button color="danger" variant="ghost">Revoke</p9r-button>
                                            </cms-confirm-form>
                                        </p9r-cell>
                                    </p9r-row>
                                </template>
                            </p9r-table>
                        </template>
                    </cms-fetch>
                </p9r-stack>
            </p9r-tab-panel>

        </p9r-tabs>
    </p9r-container>
</w13c-fixed-admin-layout>

<p9r-modal id="new-token-modal" aria-label="Create access token">
    <span slot="title">New access token</span>
    <cms-token-create api="{{BASE_PATH}}/api/pats" emit="pat:changed"></cms-token-create>
</p9r-modal>
