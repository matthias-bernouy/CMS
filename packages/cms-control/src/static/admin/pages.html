<w13c-fixed-admin-layout>
    <span slot="title">Pages</span>
    <p9r-open-modal modal-target="create-page-modal" slot="action">
        <p9r-button color="primary">+ New page</p9r-button>
    </p9r-open-modal>

    <cms-list-filter tags-url="{{BASE_PATH}}/api/tags?resource=pages">

        <div style="display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 1.25rem;">
            <div style="flex: 1 1 240px; min-width: 200px;">
                <p9r-input data-filter="search" label="Search" placeholder="Title or path…"></p9r-input>
            </div>
            <div style="flex: 0 0 170px;">
                <p9r-select data-filter="visible" label="Visibility" value="">
                    <option value="">All</option>
                    <option value="published">Published</option>
                    <option value="draft">Draft</option>
                </p9r-select>
            </div>
            <div style="flex: 0 0 190px;">
                <p9r-select data-filter="tag" label="Tag" value="">
                    <option value="">All tags</option>
                </p9r-select>
            </div>
        </div>

        <p9r-table>
            <p9r-row slot="header">
                <p9r-cell data-sort="title"><strong>Page title</strong> <span data-sort-ind></span></p9r-cell>
                <p9r-cell data-sort="path"><strong>Path</strong> <span data-sort-ind></span></p9r-cell>
                <p9r-cell><strong>Tags</strong></p9r-cell>
                <p9r-cell data-sort="visible"><strong>Visibility</strong> <span data-sort-ind></span></p9r-cell>
            </p9r-row>

            <cms-fetch url="{{BASE_PATH}}/api/page/list" reload-on="new:page">
                <template for=".">
                    <p9r-row href="{{BASE_PATH}}/editor/page?id={{ id }}">
                        <p9r-cell><strong>{{ title }}</strong></p9r-cell>
                        <p9r-cell><p9r-tag>{{ path }}</p9r-tag></p9r-cell>
                        <p9r-cell>
                            <template for="tags">
                                <p9r-tag>{{value}}</p9r-tag>
                            </template>
                        </p9r-cell>
                        <p9r-cell><p9r-tag color="{{ visibleColor }}">{{ visibleLabel }}</p9r-tag></p9r-cell>
                    </p9r-row>
                </template>
                <template slot="empty">
                    <cms-empty-state>
                        <svg slot="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="8" y1="13" x2="16" y2="13"/>
                            <line x1="8" y1="17" x2="13" y2="17"/>
                        </svg>
                        <p slot="title">No pages found</p>
                        <p slot="hint">Try adjusting your search or filters — or create a new page.</p>
                    </cms-empty-state>
                </template>
            </cms-fetch>
        </p9r-table>

    </cms-list-filter>
</w13c-fixed-admin-layout>

<p9r-modal id="create-page-modal" aria-label="Create a new page">
    <span slot="title">Page creation</span>
    <cms-form target="{{BASE_PATH}}/api/page" emit="new:page">
        <p9r-stack gap="m">
            <p9r-input name="title" label="Name" placeholder="My Beautiful Article"></p9r-input>
            <p9r-input name="path" label="Path" placeholder="/article"></p9r-input>
            <p9r-button color="primary" fullWidth type="submit">Create new page</p9r-button>
        </p9r-stack>
    </cms-form>
</p9r-modal>
