<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS — Editor</title>

    <meta name="basePath" content="{{BASE_PATH}}">

    <!-- The site's own theme.css. Loaded at document scope so the user's
         design tokens cascade into the frame content. -->
    <link rel="stylesheet" href="{{BASE_PATH}}/.cms/style">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        cms-binding-core,
        cms-editor-shell {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>

    <script src="{{BASE_PATH}}/assets/control-components.js"></script>
</head>
<body>
    <cms-binding-core>
    {{CONTENT}}
    </cms-binding-core>
</body>
</html>
