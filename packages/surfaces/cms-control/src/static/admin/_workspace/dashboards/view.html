<style>
    [data-dashboard-switcher] { display: block; padding: 4px 10px 10px; }
    [data-dashboard-switcher] select { appearance: none; background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 8px; color: var(--text-main); cursor: pointer; font: inherit; font-weight: 600; min-height: 40px; padding: 8px 12px; width: 100%; }
    [data-dashboard-switcher] select:focus-visible { outline: 2px solid var(--primary-base); outline-offset: 2px; }
    [data-dashboard-tabs] cms-library-icon { margin-right: 6px; vertical-align: -3px; }
</style>
<w13c-fixed-admin-layout operator>
    <div slot="operator-dashboard-switcher" data-dashboard-switcher></div>
    <div slot="operator-primary-navigation" data-primary-navigation></div>
    <a slot="operator-profile" href="{{BASE_PATH}}/admin/dashboards">Manage dashboards</a>
    <w13c-lateral-menu slot="secondary-lateral-nav" aria-label="Dashboard sections" data-secondary-navigation hidden>
        <span slot="header" data-secondary-title>Sections</span>
    </w13c-lateral-menu>
    <span slot="secondary-mobile-label" data-secondary-mobile-label>Sections</span>
    <p9r-nav-tabs slot="tabs" aria-label="Dashboard tabs" data-dashboard-tabs hidden></p9r-nav-tabs>
    <cms-dashboard-view></cms-dashboard-view>
</w13c-fixed-admin-layout>
