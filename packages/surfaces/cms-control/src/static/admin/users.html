<w13c-fixed-admin-layout>
    <span slot="title">Users</span>
    <a href="{{BASE_PATH}}/admin/roles" slot="action" style="text-decoration:none">
        <p9r-button variant="ghost">Manage roles</p9r-button>
    </a>
    <p9r-open-modal modal-target="create-user-modal" slot="action">
        <p9r-button color="primary">+ Add user</p9r-button>
    </p9r-open-modal>

    <p9r-table cms-source="{{BASE_PATH}}/api/users" cms-reload-on="user:updated">
        <p9r-row slot="header" cms-condition="$source.loaded">
            <p9r-cell><strong>User</strong></p9r-cell>
            <p9r-cell><strong>Role</strong></p9r-cell>
            <p9r-cell><strong>Provider</strong></p9r-cell>
            <p9r-cell><strong>Email</strong></p9r-cell>
            <p9r-cell><strong>Last seen</strong></p9r-cell>
        </p9r-row>

        <p9r-row cms-repeat="." cms-condition="$source.loaded" href="{{BASE_PATH}}/admin/users/detail?sub={{ subParam }}">
            <p9r-cell>
                <p9r-stack gap="xs">
                    <strong>{{ displayName }}</strong>
                    <span>{{ email }}</span>
                </p9r-stack>
            </p9r-cell>
            <p9r-cell><p9r-tag>{{ roleLabel }}</p9r-tag></p9r-cell>
            <p9r-cell>{{ providerLabel }}</p9r-cell>
            <p9r-cell>{{ emailStatusLabel }}</p9r-cell>
            <p9r-cell>{{ lastSeenAtLabel }}</p9r-cell>
        </p9r-row>

        <cms-empty-state cms-condition="$source.empty">
            <p slot="title">No users yet</p>
            <p slot="hint">Users appear here after their first login.</p>
        </cms-empty-state>
    </p9r-table>
</w13c-fixed-admin-layout>

<p9r-modal id="create-user-modal" aria-label="Add a local user">
    <span slot="title">Add user</span>
    <form cms-source="{{BASE_PATH}}/api/users as result" cms-source-trigger="submit" cms-source-method="POST" cms-source-publish="user:updated">
        <p9r-stack gap="md">
            <p9r-input name="email" type="email" label="Email" placeholder="user@example.com" required></p9r-input>
            <p9r-input name="password" type="password" label="Password" placeholder="At least 8 characters" required></p9r-input>
            <p9r-input name="displayName" label="Display name" placeholder="Jane Doe"></p9r-input>
            <div>
                <label style="display:block;font-size:.8rem;color:var(--text-muted,#666);margin-bottom:.25rem">Role</label>
                <cms-role-select name="role" value="user" list-url="{{BASE_PATH}}/api/roles/list"></cms-role-select>
            </div>
            <p9r-button color="primary" fullWidth type="submit">Create user</p9r-button>
        </p9r-stack>
    </form>
</p9r-modal>
