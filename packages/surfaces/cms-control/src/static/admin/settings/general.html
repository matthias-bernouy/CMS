<w13c-fixed-admin-layout>
    <span slot="title">Settings</span>
    <cms-settings-nav slot="secondary-lateral-nav"></cms-settings-nav>

    <p9r-container size="lg">
        <div cms-source="{{BASE_PATH}}/api/system/settings" cms-reload-on="settings:saved">
            <template>
                <form id="settings-form" cms-source="{{BASE_PATH}}/api/system/settings as result" cms-source-trigger="submit" cms-source-method="POST" cms-source-publish="settings:saved" cms-source-success-reset="false">
                    <cms-shell-detail>
                        <a slot="back" href="{{BASE_PATH}}/admin/settings" aria-label="Back to settings">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M4 21v-7"></path>
                                <path d="M4 10V3"></path>
                                <path d="M12 21v-9"></path>
                                <path d="M12 8V3"></path>
                                <path d="M20 21v-5"></path>
                                <path d="M20 12V3"></path>
                                <path d="M2 14h4"></path>
                                <path d="M10 8h4"></path>
                                <path d="M18 16h4"></path>
                            </svg>
                        </a>
                        <span slot="title">General</span>
                        <p9r-button slot="actions" type="submit" color="primary">Save</p9r-button>

                        <cms-detail-section slot="main" heading="Site">
                            <p9r-stack gap="md">
                                <p9r-input name="site.name" label="Site name" value="{{ site.name }}" placeholder="My Website"></p9r-input>
                                <p9r-input name="site.host" label="Host" value="{{ site.host }}" placeholder="https://example.com"></p9r-input>
                                <cms-media-input name="site.favicon" label="Favicon" value="{{ site.favicon }}" types="image" size="128"></cms-media-input>
                                <p9r-select name="site.language" label="Language" value="{{ site.language }}">
                                    <option value="">— Default —</option>
                                    <option value="en">English</option>
                                    <option value="fr">Français</option>
                                    <option value="de">Deutsch</option>
                                    <option value="es">Español</option>
                                    <option value="pt">Português</option>
                                    <option value="it">Italiano</option>
                                    <option value="nl">Nederlands</option>
                                    <option value="pl">Polski</option>
                                    <option value="ja">日本語</option>
                                    <option value="zh">中文</option>
                                </p9r-select>
                            </p9r-stack>
                        </cms-detail-section>

                        <cms-detail-section slot="main" heading="Theme CSS">
                            <p9r-textarea name="site.theme" rows="16" autosize value="{{ site.theme }}" placeholder="/* your CSS */"></p9r-textarea>
                        </cms-detail-section>

                        <cms-detail-section slot="aside" heading="Editor">
                            <p9r-select name="editor.layoutCategory" label="Layout category" value="{{ editor.layoutCategory }}">
                                <option value="">— None —</option>
                                <option cms-repeat="layoutCategories" value="{{value}}">{{value}}</option>
                            </p9r-select>
                        </cms-detail-section>

                        <cms-detail-section slot="aside" heading="System pages">
                            <p9r-stack gap="md">
                                <p9r-select name="site.notFound" label="Not Found page" value="{{ site.notFound.path }}">
                                    <option value="">— None —</option>
                                    <option cms-repeat="pages" value="{{ path }}">{{ title }}</option>
                                </p9r-select>
                                <p9r-select name="site.forbidden" label="Forbidden page" value="{{ site.forbidden.path }}">
                                    <option value="">— None —</option>
                                    <option cms-repeat="pages" value="{{ path }}">{{ title }}</option>
                                </p9r-select>
                                <p9r-select name="site.serverError" label="Internal Server Error page" value="{{ site.serverError.path }}">
                                    <option value="">— None —</option>
                                    <option cms-repeat="pages" value="{{ path }}">{{ title }}</option>
                                </p9r-select>
                                <p9r-select name="site.login" label="Login page" value="{{ site.login.path }}">
                                    <option value="">— None —</option>
                                    <option cms-repeat="pages" value="{{ path }}">{{ title }}</option>
                                </p9r-select>
                            </p9r-stack>
                        </cms-detail-section>
                    </cms-shell-detail>
                </form>
            </template>
        </div>
    </p9r-container>
</w13c-fixed-admin-layout>
