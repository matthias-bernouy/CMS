<w13c-fixed-admin-layout>
    <span slot="title">Pages</span>

    <p9r-container size="lg">
        <div cms-source="{{BASE_PATH}}/api/page/configDetail?id=#{id}">
            <template>
                <cms-page-detail-sync>
                    <cms-shell-detail cms-condition="$source.loaded">
                        <a slot="back" href="{{BASE_PATH}}/admin/pages" aria-label="Back to pages">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="4" y="5" width="16" height="14" rx="2"></rect>
                                <path d="M8 9h8"></path>
                                <path d="M8 13h5"></path>
                            </svg>
                        </a>
                        <span slot="title">{{ title }}</span>
                        <p9r-button slot="actions" form="page-settings-form" type="submit" color="primary">Save settings</p9r-button>
                        <div slot="actions">
                            <p9r-action-menu label="More actions">
                                <p9r-action-menu-item data-action="view-public" href="{{ publicUrl }}" target="_blank">
                                    <svg slot="icon" viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                                        <circle cx="12" cy="12" r="2.5"></circle>
                                    </svg>
                                    View public page
                                </p9r-action-menu-item>
                                <p9r-action-menu-item data-modal-target="manage-page-languages-modal">Manage languages</p9r-action-menu-item>
                                <p9r-action-menu-item data-modal-target="delete-page-modal" color="danger">Delete page</p9r-action-menu-item>
                            </p9r-action-menu>
                        </div>

                        <form slot="body" id="page-settings-form" cms-source="{{BASE_PATH}}/api/page/configDetail as result" cms-source-trigger="submit" cms-source-method="PUT" cms-source-success-reset="false">
                            <p9r-alert type="success" cms-condition="result.ok" role="status">Settings saved.</p9r-alert>
                            <p9r-alert type="error" cms-condition="$source.error" role="alert">{{ $source.message }}</p9r-alert>
                            <cms-shell-detail-body>
                                <p9r-stack slot="main" gap="md">
                                    <cms-detail-section heading="Page settings" description="Set the page title and description used when a language has no custom search copy.">
                                        <p9r-stack gap="md">
                                            <p9r-input name="title" label="Page title" value="{{ title }}" hint="Used as the SEO title when a language has no custom one." maxlength="70" required></p9r-input>
                                            <p9r-textarea name="description" label="Page description" rows="4" maxlength="200" max-count="200" autosize value="{{ description }}" hint="Used as the SEO description when a language has no custom one."></p9r-textarea>
                                            <cms-page-indexing-variables data-indexing-variables hidden></cms-page-indexing-variables>
                                        </p9r-stack>
                                    </cms-detail-section>

                                    <cms-detail-section heading="Indexing" description="Control whether this page can appear in search results. Dynamic pages create one indexable URL for each detected entity.">
                                        <w13c-switch slot="actions" size="sm" data-page-indexing-toggle aria-label="Allow search engines to index this page"></w13c-switch>
                                        <cms-page-indexing-settings value="{{ indexingEditor | jsonurl }}"></cms-page-indexing-settings>
                                    </cms-detail-section>
                                </p9r-stack>

                                <cms-detail-section slot="aside" heading="Page configuration">
                                    <p9r-stack gap="md">
                                        <p9r-input form="page-settings-form" name="path" label="Primary path (read-only)" value="{{ path }}" hint="Use More actions → Manage languages to change this path." readonly></p9r-input>
                                        <p9r-select form="page-settings-form" name="published" label="Status" value="{{ published }}">
                                            <option value="false">Draft</option>
                                            <option value="true">Published</option>
                                        </p9r-select>
                                        <p9r-token-input form="page-settings-form" name="tags" label="Tags" resource="pages" api="{{BASE_PATH}}/api/tags" value="{{ tags }}" placeholder="Add a tag" creatable></p9r-token-input>
                                    </p9r-stack>
                                </cms-detail-section>
                            </cms-shell-detail-body>
                        </form>
                    </cms-shell-detail>
                    <p9r-modal id="manage-page-languages-modal" aria-label="Manage page languages" placement="end" content-layout="contained" style="--p9r-modal-width: 760px;">
                        <span slot="title">Page languages</span>
                        <cms-page-languages page-id="{{ id }}" base-path="{{BASE_PATH}}"></cms-page-languages>
                    </p9r-modal>
                    <p9r-modal id="delete-page-modal" aria-label="Delete page">
                        <span slot="title">Delete page</span>
                        <cms-page-delete page-id="{{ id }}" base-path="{{BASE_PATH}}"></cms-page-delete>
                    </p9r-modal>
                </cms-page-detail-sync>
            </template>
        </div>
    </p9r-container>
</w13c-fixed-admin-layout>
