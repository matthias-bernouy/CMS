<w13c-fixed-admin-layout>
    <span slot="title">Authentication</span>
    <cms-settings-nav slot="secondary-lateral-nav"></cms-settings-nav>
    <cms-authentication-tabs slot="tabs"></cms-authentication-tabs>

    <p9r-container size="lg">
        <cms-shell-detail>
            <cms-detail-section slot="main" heading="Website policy" description="Requirements applied to published website authentication.">
                <p9r-stack gap="sm">
                    <span>No website authentication policy is connected in this layout preview.</span>
                </p9r-stack>
            </cms-detail-section>

            <cms-detail-section slot="main" heading="Administration policy" description="Stronger requirements can be applied independently to administrators.">
                <p9r-stack gap="sm">
                    <span>No administration authentication policy is connected in this layout preview.</span>
                </p9r-stack>
            </cms-detail-section>

            <cms-detail-section slot="aside" heading="Policy evaluation">
                <p9r-stack gap="sm">
                    <span>Policies will combine methods, assurance requirements, and step-up rules.</span>
                </p9r-stack>
            </cms-detail-section>
        </cms-shell-detail>
    </p9r-container>
</w13c-fixed-admin-layout>
