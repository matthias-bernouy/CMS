<w13c-fixed-admin-layout>
    <span slot="title">Authentication</span>
    <cms-settings-nav slot="secondary-lateral-nav"></cms-settings-nav>
    <cms-authentication-tabs slot="tabs"></cms-authentication-tabs>

    <p9r-container size="lg">
        <cms-shell-detail>
            <cms-detail-section slot="main" heading="SSO connections" description="External identity providers configured for website or administration sign-in.">
                <p9r-stack gap="sm">
                    <span>No SSO connections are displayed in this layout preview.</span>
                </p9r-stack>
            </cms-detail-section>

            <cms-detail-section slot="aside" heading="Availability">
                <p9r-stack gap="sm">
                    <span>Each connection will show whether it is available for the website, administration, or both.</span>
                </p9r-stack>
            </cms-detail-section>
        </cms-shell-detail>
    </p9r-container>
</w13c-fixed-admin-layout>
