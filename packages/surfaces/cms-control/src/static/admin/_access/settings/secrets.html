<cms-event-toast event="secret:created" message="Secret created" type="success"></cms-event-toast>

<w13c-fixed-admin-layout>
    <span slot="title">Settings</span>
    <cms-settings-nav slot="secondary-lateral-nav"></cms-settings-nav>

    <p9r-container size="lg">
        <cms-shell-detail>
            <a slot="back" href="{{BASE_PATH}}/admin/settings" aria-label="Back to settings">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="7.5" cy="15.5" r="5.5"></circle>
                    <path d="m12 11 8-8"></path>
                    <path d="m15 6 3 3"></path>
                    <path d="m17 4 3 3"></path>
                </svg>
            </a>
            <span slot="title">Secrets</span>
            <p9r-open-modal slot="actions" modal-target="add-secret-modal">
                <p9r-button color="primary">+ Add secret</p9r-button>
            </p9r-open-modal>

            <cms-detail-section slot="main" heading="Secrets">
                <cms-secrets api="{{BASE_PATH}}/api/secrets"></cms-secrets>
            </cms-detail-section>

            <cms-detail-section slot="aside" heading="Usage">
                <p9r-stack gap="sm">
                    <span>Secret values cannot be viewed after saving. Enter a replacement value to rotate an existing secret.</span>
                    <span>Secrets can be referenced by settings and integration resources without exposing raw values in page markup.</span>
                </p9r-stack>
            </cms-detail-section>
        </cms-shell-detail>
    </p9r-container>
</w13c-fixed-admin-layout>

<p9r-modal id="add-secret-modal" aria-label="Add secret">
    <span slot="title">Add secret</span>
    <form cms-source="{{BASE_PATH}}/api/secrets as result" cms-source-trigger="submit" cms-source-method="POST" cms-source-publish="secret:saved secret:created">
        <p9r-stack gap="md">
            <p9r-input name="key" label="Key" placeholder="MY_API_KEY"></p9r-input>
            <p9r-input name="value" label="Value" type="password" autocomplete="new-password" placeholder="Value kept server-side" required></p9r-input>
            <p9r-button color="primary" fullWidth type="submit">Add secret</p9r-button>
        </p9r-stack>
    </form>
</p9r-modal>
