<w13c-fixed-admin-layout>
    <span slot="title">Authentication</span>
    <cms-settings-nav slot="secondary-lateral-nav"></cms-settings-nav>
    <cms-authentication-tabs slot="tabs"></cms-authentication-tabs>

    <p9r-container size="lg">
        <cms-shell-detail>
            <cms-detail-section slot="main" heading="Enrollment" description="Requirements applied while a person registers their first authenticators.">
                <p9r-stack gap="sm">
                    <span>No enrollment settings are connected in this layout preview.</span>
                </p9r-stack>
            </cms-detail-section>

            <cms-detail-section slot="main" heading="Account recovery" description="Fallback methods and safeguards for lost authenticators.">
                <p9r-stack gap="sm">
                    <span>No recovery settings are connected in this layout preview.</span>
                </p9r-stack>
            </cms-detail-section>

            <cms-detail-section slot="aside" heading="Recovery strength">
                <p9r-stack gap="sm">
                    <span>Recovery must not silently weaken the authentication policy it protects.</span>
                </p9r-stack>
            </cms-detail-section>
        </cms-shell-detail>
    </p9r-container>
</w13c-fixed-admin-layout>
