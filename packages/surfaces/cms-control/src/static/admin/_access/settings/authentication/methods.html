<w13c-fixed-admin-layout>
    <span slot="title">Authentication</span>
    <cms-settings-nav slot="secondary-lateral-nav"></cms-settings-nav>
    <cms-authentication-tabs slot="tabs"></cms-authentication-tabs>

    <p9r-container size="lg">
        <cms-shell-detail>
            <cms-detail-section slot="main" heading="Website sign-in" description="Methods available to people signing in to the published website.">
                <p9r-stack gap="sm">
                    <span>No website methods are connected in this layout preview.</span>
                </p9r-stack>
            </cms-detail-section>

            <cms-detail-section slot="main" heading="Administration sign-in" description="Methods allowed to access CmsCore administration.">
                <p9r-stack gap="sm">
                    <span>No administration methods are connected in this layout preview.</span>
                </p9r-stack>
            </cms-detail-section>

            <cms-detail-section slot="aside" heading="Method roles">
                <p9r-stack gap="sm">
                    <span>A method can be used for primary sign-in, additional verification, or recovery.</span>
                </p9r-stack>
            </cms-detail-section>
        </cms-shell-detail>
    </p9r-container>
</w13c-fixed-admin-layout>
