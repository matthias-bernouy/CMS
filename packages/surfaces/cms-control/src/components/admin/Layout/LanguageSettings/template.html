<section class="language-section" aria-labelledby="selected-languages-heading">
    <header class="language-section-header">
        <h2 id="selected-languages-heading">Selected languages</h2>
        <p9r-badge data-selected-count></p9r-badge>
    </header>
    <p class="language-empty" data-selected-empty hidden>Choose a language below to make it your default.</p>
    <div class="language-list" data-selected-list></div>
</section>

<section class="language-section" aria-labelledby="available-languages-heading">
    <header class="language-section-header">
        <h2 id="available-languages-heading">Available languages</h2>
        <p9r-badge data-available-count></p9r-badge>
    </header>
    <div class="language-list" data-available-list></div>
</section>
