<div class="layout">
    <nav class="sidebar" aria-label="Sources" data-list></nav>

    <main class="content">
        <section class="panel empty" data-empty>
            <strong>Select a source</strong>
            <span>Choose a source contract to inspect endpoints and response fields.</span>
        </section>

        <section class="hero" data-hero hidden>
            <div>
                <h2 data-source-name></h2>
                <p><code data-source-urn></code></p>
            </div>
            <span class="pill" data-source-state></span>
        </section>

        <section class="panel" data-detail hidden>
            <div class="section-head">
                <div>
                    <h3 data-current-name></h3>
                    <p>
                        <code data-current-method></code>
                        <span data-current-path></span>
                    </p>
                </div>
                <span class="pill"><span data-endpoint-count></span> endpoints</span>
            </div>

            <div class="contract" data-contract>
                <section>
                    <h4>Inputs</h4>
                    <div class="contract-list" data-inputs></div>
                </section>
                <section>
                    <h4>Outputs</h4>
                    <div class="contract-list" data-outputs></div>
                </section>
            </div>
        </section>
    </main>
</div>

<template data-source-template>
    <button class="source-item" type="button">
        <span data-name></span>
        <small data-meta></small>
    </button>
</template>

<template data-endpoint-template>
    <button class="endpoint-item" type="button">
        <code data-method></code>
        <span data-endpoint-name></span>
        <small data-path></small>
    </button>
</template>

<template data-contract-row-template>
    <div class="contract-row">
        <span data-label></span>
        <code data-value></code>
        <small data-detail></small>
    </div>
</template>
