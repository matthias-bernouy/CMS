<p9r-open-modal slot="action" role="presentation" tabindex="-1" modal-target="new-collection-modal" cms-condition="workspace.isLanding">
    <p9r-button type="button" variant="outlined">Create private collection</p9r-button>
</p9r-open-modal>

<cms-available-collections cms-condition="workspace.isLanding" cms-bind-stop></cms-available-collections>

<p9r-modal id="new-collection-modal" cms-condition="workspace.isLanding" aria-label="Create private collection">
    <span slot="title">Create private collection</span>
    <form data-new-collection-form cms-source="" cms-source-method="POST" cms-source-trigger="submit" cms-source-success-redirect="">
        <p9r-stack gap="md">
            <p9r-input name="name" label="Label" maxlength="120" required></p9r-input>
            <p9r-select name="icon" label="Icon">
                <option value="folder">Folder</option>
                <option value="layers">Layers</option>
                <option value="grid">Grid</option>
                <option value="layout">Layout</option>
                <option value="star">Star</option>
                <option value="code">Code</option>
            </p9r-select>
            <p9r-textarea name="description" label="Description" maxlength="1000"></p9r-textarea>
            <p9r-button type="submit" color="primary">Create collection</p9r-button>
            <span role="status" cms-condition="$source.loading">Creating collection…</span>
            <p class="collection-form-error" role="alert" cms-condition="$source.error">{{ $source.message }}</p>
        </p9r-stack>
    </form>
</p9r-modal>
