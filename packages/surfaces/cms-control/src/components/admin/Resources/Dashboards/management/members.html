<div class="member-setting">
    <div class="member-avatars" data-avatars role="img" aria-label="No members assigned"></div>
    <p9r-button type="button" variant="outlined" data-open>Manage</p9r-button>
</div>
<p9r-modal data-modal aria-label="Manage dashboard members">
    <span slot="title">Manage members</span>
    <p9r-input data-search type="search" label="Search members" placeholder="Name or email"></p9r-input>
    <div class="member-list" data-list></div>
    <p class="member-empty" data-empty hidden>No users match this search.</p>
    <p9r-button slot="footer" type="button" color="primary" data-close>Done</p9r-button>
</p9r-modal>
