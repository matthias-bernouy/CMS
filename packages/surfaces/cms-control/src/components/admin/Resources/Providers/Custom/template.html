<form data-form>
    <p9r-stack gap="md">
        <p class="introduction">Enter the public URL where the provider publishes its manifest.</p>
        <p9r-input name="manifestUrl" type="url" label="Manifest URL" placeholder="https://provider.example/definition.json" required></p9r-input>
        <p class="hint">The manifest must reference contracts available from your configured repositories.</p>
        <p9r-button type="submit" color="primary" fullWidth data-submit>Import and continue</p9r-button>
        <p role="status" aria-live="polite"></p>
    </p9r-stack>
</form>
