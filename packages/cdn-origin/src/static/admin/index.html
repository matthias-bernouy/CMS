<p9r-stack gap="m">

    <p9r-stack direction="row" justify="space-between" align="center">
        <h1>Origin status</h1>
        <p9r-stack direction="row" gap="s">
            <w13c-form target="{{BASE_PATH}}/api/edges/probe" method="POST" emit="edge:probed">
                <p9r-button variant="outlined" color="primary" type="submit">Probe edges</p9r-button>
            </w13c-form>
            <w13c-form target="{{BASE_PATH}}/api/edges/sync" method="POST" emit="cluster:kicked">
                <p9r-button variant="outlined" color="primary" type="submit">Kick lsyncd</p9r-button>
            </w13c-form>
        </p9r-stack>
    </p9r-stack>

    <p>
        This origin is the authoritative source for every bucket. It pushes blob updates to the connected
        edges via lsyncd-over-SSH and serves the admin / upload APIs you're using right now. Manage edges
        on the <a href="{{BASE_PATH}}/edges">Edges</a> page.
    </p>

    <w13c-fetch url="{{BASE_PATH}}/api/status" reload-on="edge:added edge:removed edge:probed cluster:kicked">
        <template>
            <p9r-stack gap="m">

                <h2>Connected edges</h2>
                <p>
                    <strong>{{ data.edges.length }}</strong> edge(s) registered.
                    <a href="{{BASE_PATH}}/edges">Manage →</a>
                </p>

                <h2>SSH public key</h2>
                <p>
                    Paste this line into <code>~/.ssh/authorized_keys</code> of the
                    <code>cdn-sync</code> user on every edge server.
                </p>
                <pre style="overflow: auto; background: var(--secondary-muted, #f5f5f5); border: 1px solid var(--secondary-base, #ddd); padding: 0.75rem; border-radius: 6px; white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, monospace; font-size: 0.85rem;">{{ data.sshPubkey }}</pre>

                <h2>lsyncd</h2>
                <p9r-stack gap="s">
                    <p>config: <code>{{ data.lsyncd.configPath }}</code></p>
                    <p>status file: <code>{{ data.lsyncd.statusPath }}</code> (present: <code>{{ data.lsyncd.statusPresent }}</code>)</p>
                    <details>
                        <summary>Status excerpt</summary>
                        <pre style="overflow: auto; max-height: 300px; background: var(--secondary-muted, #f5f5f5); border: 1px solid var(--secondary-base, #ddd); padding: 0.75rem; border-radius: 6px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.8rem;">{{ data.lsyncd.statusExcerpt }}</pre>
                    </details>
                </p9r-stack>
            </p9r-stack>
        </template>
        <template slot="error">
            <p9r-alert type="error">Failed to load origin status.</p9r-alert>
        </template>
    </w13c-fetch>

</p9r-stack>
