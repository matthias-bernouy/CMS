<div cms-bloc="ulvia--mossa--field" label-position="top">
    <span slot="label">{{ cms.i18n.ulvia/mossa.ui-email-address }}</span>
    <div cms-bloc="ulvia--mossa--field-help" slot="help">
        <span slot="label">{{ cms.i18n.ulvia/mossa.ui-more-information }}</span
        ><span slot="content">{{ cms.i18n.ulvia/mossa.ui-we-will-only-use-this-address-to-reply }}</span>
    </div>
    <div cms-bloc="ulvia--mossa--input" slot="control"><input type="email" name="email" autocomplete="email"></div>
    <span slot="description">{{ cms.i18n.ulvia/mossa.ui-use-a-valid-address-such-as-alex-example-com }}</span>
</div>
