<div cms-bloc="ulvia--mossa--choice-group" orientation="vertical">
    <span slot="legend">{{ cms.i18n.ulvia/mossa.ui-preferred-contact-method }}</span><span slot="help">{{ cms.i18n.ulvia/mossa.ui-choose-one-option }}</span>
    <div cms-bloc="ulvia--mossa--choice-field" slot="items">
        <div cms-bloc="ulvia--mossa--radio" slot="control" size="md"><input type="radio" name="contact" value="email" checked></div>
        <span slot="label">{{ cms.i18n.ulvia/mossa.ui-email }}</span>
    </div>
    <div cms-bloc="ulvia--mossa--choice-field" slot="items">
        <div cms-bloc="ulvia--mossa--radio" slot="control" size="md"><input type="radio" name="contact" value="phone"></div>
        <span slot="label">{{ cms.i18n.ulvia/mossa.ui-phone }}</span>
    </div>
</div>
