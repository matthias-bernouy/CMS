<details part="picker">
    <summary aria-label="{{ cms.i18n.ulvia/mossa.ui-log-period }}">
        <svg cms-svg="{{ cms.asset.ulvia/mossa.icons/controls/calendar.svg }}" aria-hidden="true"></svg>
        <span data-range-summary>{{ cms.i18n.ulvia/mossa.ui-log-period }}</span>
    </summary>
    <div part="popover">
        <div part="presets">
            <button type="button" data-minutes="15">{{ cms.i18n.ulvia/mossa.ui-log-period-15 }}</button>
            <button type="button" data-minutes="60">{{ cms.i18n.ulvia/mossa.ui-log-period-hour }}</button>
            <button type="button" data-minutes="1440">{{ cms.i18n.ulvia/mossa.ui-log-period-day }}</button>
        </div>
        <label>{{ cms.i18n.ulvia/mossa.ui-log-since }}<input type="datetime-local" data-range-from required></label>
        <label>{{ cms.i18n.ulvia/mossa.ui-log-until }}<input type="datetime-local" data-range-to required></label>
        <p role="alert" data-range-error hidden>{{ cms.i18n.ulvia/mossa.ui-log-period-invalid }}</p>
        <button type="button" data-range-apply>{{ cms.i18n.ulvia/mossa.ui-log-apply }}</button>
    </div>
</details>
