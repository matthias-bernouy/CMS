<main cms-bloc="ulvia-repository-shell">
    <section slot="content">
        <h1 cms-bloc="ulvia-official-heading">{{ cms.i18n.ulvia-repository.signup }}</h1>
        <form cms-mutation="ulvia.cms.access:signup as session" cms-mutation-redirect="/login">
            <label>{{ cms.i18n.ulvia-repository.email }}<input type="email" name="email" autocomplete="username" maxlength="320" required></label>
            <label>{{ cms.i18n.ulvia-repository.password }}<input type="password" name="password" autocomplete="new-password" maxlength="4096" required></label>
            <button cms-bloc="ulvia-official-action" type="submit"><span>{{ cms.i18n.ulvia-repository.signup }}</span></button>
            <div cms-match="session.outcome.kind">
                <span cms-case='"none"'></span>
                <div cms-case='"success"'>
                    <p role="status">{{ cms.i18n.ulvia-repository.success }}</p>
                </div>
                <div cms-case='"error"' cms-match="session.outcome.code">
                    <p role="alert" cms-case='"INVALID_INPUT"'>{{ cms.i18n.ulvia-repository.failed }}</p>
                    <p role="alert" cms-case='"CORE_UNAVAILABLE"'>{{ cms.i18n.ulvia-repository.failed }}</p>
                </div>
                <p role="alert" cms-case='"failure"'>{{ cms.i18n.ulvia-repository.failed }}</p>
            </div>
        </form>
    </section>
</main>
