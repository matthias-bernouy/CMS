<div cms-bloc="ulvia-official-pricing-plan">
    <h3 cms-bloc="ulvia-official-heading" slot="name">{{ cms.i18n.ulvia-official.ui-plan-name }}</h3>
    <p slot="price">{{ cms.i18n.ulvia-official.ui-29-month }}</p>
    <p slot="description">{{ cms.i18n.ulvia-official.ui-a-clear-description-of-who-this-plan-is-for }}</p>
    <ul slot="features">
        <li>{{ cms.i18n.ulvia-official.ui-first-benefit }}</li>
        <li>{{ cms.i18n.ulvia-official.ui-second-benefit }}</li>
    </ul>
    <button cms-bloc="ulvia-official-action" wide="" slot="action" type="button"><span>{{ cms.i18n.ulvia-official.ui-choose-plan }}</span></button>
</div>
