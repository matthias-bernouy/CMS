<div cms-bloc="ulvia-official-field" label-position="top">
    <span slot="label">{{ cms.i18n.ulvia-official.ui-email-address }}</span>
    <div cms-bloc="ulvia-official-field-help" slot="help">
        <span slot="label">{{ cms.i18n.ulvia-official.ui-more-information }}</span
        ><span slot="content">{{ cms.i18n.ulvia-official.ui-we-will-only-use-this-address-to-reply }}</span>
    </div>
    <div cms-bloc="ulvia-official-input" slot="control"><input type="email" name="email" autocomplete="email"></div>
    <span slot="description">{{ cms.i18n.ulvia-official.ui-use-a-valid-address-such-as-alex-example-com }}</span>
</div>
