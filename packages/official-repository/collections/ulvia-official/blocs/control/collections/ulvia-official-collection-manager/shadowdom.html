<section part="workspace" aria-labelledby="collection-manager-title">
    <header part="header"><div data-heading></div><div data-header-action></div></header>
    <div part="notice" data-notice role="status" aria-live="polite"></div>
    <div part="summary" data-summary></div>
    <nav part="tabs" data-tabs></nav>
    <section part="panel" data-panel="installed">
        <div part="toolbar" data-installed-toolbar></div>
        <div part="cards" data-installed></div>
    </section>
    <section part="panel" data-panel="repository" hidden>
        <div part="toolbar" data-repository-toolbar></div>
        <div part="cards" data-releases></div>
    </section>
    <section part="panel" data-panel="activity" hidden>
        <div part="toolbar" data-activity-toolbar></div>
        <div part="activity" data-activity></div>
    </section>
</section>
<div data-dialogs></div>
