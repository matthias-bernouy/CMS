<section part="workspace" aria-labelledby="settings-title">
    <span hidden><slot name="copy"></slot></span>
    <nav part="navigation" data-copy-key="settings-sections" data-copy-attribute="aria-label">
        <strong id="settings-title" data-copy-key="settings"></strong>
        <button type="button" data-section="general" aria-current="page" data-copy-key="general"></button>
        <button type="button" data-section="languages" data-copy-key="languages"></button>
    </nav>
    <main part="content">
        <div part="notice" data-notice role="status" aria-live="polite"></div>
        <section data-panel="general" aria-labelledby="settings-general-title">
            <header part="section-header">
                <div>
                    <p part="eyebrow" data-copy-key="site"></p>
                    <h2 id="settings-general-title" data-copy-key="general"></h2>
                    <p data-copy-key="identity-help"></p>
                </div>
            </header>
            <form data-form="general">
                <div part="fields">
                    <label>
                        <span data-copy-key="site-name"></span>
                        <input data-site-name maxlength="160" required autocomplete="organization">
                        <small data-copy-key="site-name-help"></small>
                    </label>
                    <label>
                        <span data-copy-key="public-host"></span>
                        <input data-site-host maxlength="2048" inputmode="url" data-copy-key="public-host-placeholder" data-copy-attribute="placeholder">
                        <small data-copy-key="public-host-help"></small>
                    </label>
                    <label>
                        <span data-copy-key="site-availability"></span>
                        <select data-site-visible>
                            <option value="true" data-copy-key="public"></option>
                            <option value="false" data-copy-key="private"></option>
                        </select>
                        <small data-copy-key="site-availability-help"></small>
                    </label>
                </div>
                <footer part="actions"><button type="submit" data-emphasis="primary" data-copy-key="save-general"></button></footer>
            </form>
        </section>
        <section data-panel="languages" aria-labelledby="settings-languages-title" hidden>
            <header part="section-header">
                <div>
                    <p part="eyebrow" data-copy-key="localization"></p>
                    <h2 id="settings-languages-title" data-copy-key="languages"></h2>
                    <p data-copy-key="languages-help"></p>
                </div>
            </header>
            <form data-form="languages">
                <div part="fields">
                    <label>
                        <span data-copy-key="default-language"></span>
                        <input data-language maxlength="64" required autocomplete="off">
                        <small data-copy-key="default-language-help"></small>
                    </label>
                    <label>
                        <span data-copy-key="available-languages"></span>
                        <input data-additional autocomplete="off" data-copy-key="available-languages-placeholder" data-copy-attribute="placeholder">
                        <small data-copy-key="available-languages-help"></small>
                    </label>
                    <label>
                        <span data-copy-key="active-languages"></span>
                        <input data-active autocomplete="off" data-copy-key="active-languages-placeholder" data-copy-attribute="placeholder">
                        <small data-copy-key="active-languages-help"></small>
                    </label>
                </div>
                <footer part="actions"><button type="submit" data-emphasis="primary" data-copy-key="save-languages"></button></footer>
            </form>
        </section>
    </main>
</section>
